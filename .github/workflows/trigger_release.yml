---
name: "Release"
on: # yamllint disable
  release:
    types: [published]

jobs:
  build_collection:
    name: "Build Collection"
    runs-on: "ubuntu-latest"
    if: "startsWith(github.ref, 'refs/tags/v')"
    steps:
      - name: "Check out repository code"
        uses: "actions/checkout@v6"
      - name: "Set up Python"
        uses: "actions/setup-python@v6"
        with:
          python-version: "3.11"
      - name: "Install Python Packages"
        run: "pip install ansible-core"
      - name: "Build the collection"
        run: "ansible-galaxy collection build --output-path build"
      - name: "Upload collection artifact"
        uses: "actions/upload-artifact@v7"
        with:
          name: "collection"
          path: "build/*.tar.gz"

  publish_github:
    name: "Publish to GitHub"
    needs: "build_collection"
    runs-on: "ubuntu-latest"
    steps:
      - name: "Download collection artifact"
        uses: "actions/download-artifact@v8"
        with:
          name: "collection"
          path: "build"
      - name: "Upload binaries to release"
        uses: "svenstaro/upload-release-action@v2"
        with:
          repo_token: "${{ secrets.GH_NAUTOBOT_BOT_TOKEN }}"
          file: "build/*"
          tag: "${{ github.ref }}"
          overwrite: true
          file_glob: true

  publish_galaxy:
    name: "Publish to Ansible Galaxy"
    needs: "build_collection"
    runs-on: "ubuntu-latest"
    steps:
      - name: "Set up Python"
        uses: "actions/setup-python@v6"
        with:
          python-version: "3.11"
      - name: "Install Python Packages"
        run: "pip install ansible-core"
      - name: "Download collection artifact"
        uses: "actions/download-artifact@v8"
        with:
          name: "collection"
          path: "build"
      - name: "Create the ansible.cfg file"
        run: |
          cat << EOF > ansible.cfg
          [galaxy]
          server_list = published
          [galaxy_server.published]
          url=https://galaxy.ansible.com/api/
          token=${{ secrets.GALAXY_API_TOKEN }}
          EOF
        shell: bash
      - name: "Publish the collection"
        run: "ansible-galaxy collection publish build/*.tar.gz"

  publish_automation_hub:
    name: "Publish to Red Hat Automation Hub"
    needs: "build_collection"
    runs-on: "ubuntu-latest"
    continue-on-error: true
    steps:
      - name: "Set up Python"
        uses: "actions/setup-python@v6"
        with:
          python-version: "3.11"
      - name: "Install Python Packages"
        run: "pip install ansible-core"
      - name: "Download collection artifact"
        uses: "actions/download-artifact@v8"
        with:
          name: "collection"
          path: "build"
      - name: "Create the ansible.cfg file"
        run: |
          cat << EOF > ansible.cfg
          [galaxy]
          server_list = automation_hub
          [galaxy_server.automation_hub]
          url=${{ secrets.AUTOMATION_HUB_URL }}
          auth_url=${{ secrets.AUTOMATION_HUB_SSO_URL }}
          token=${{ secrets.AUTOMATION_HUB_API_TOKEN }}
          EOF
        shell: bash
      - name: "Publish the collection"
        run: "ansible-galaxy collection publish build/*.tar.gz"
