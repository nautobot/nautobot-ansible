---
##
##
### PYNAUTOBOT_CONTROLLER_MANAGED_DEVICE_GROUP_WIRELESS_NETWORK_ASSIGNMENT
##
##
- set_fact:
    test_controller_managed_device_group: "{{ lookup('networktocode.nautobot.lookup', 'controller-managed-device-groups', api_endpoint=nautobot_url, token=nautobot_token, api_filter='name=\"Test Controller Managed Device Group\"') }}"
    test_wireless_network: "{{ lookup('networktocode.nautobot.lookup', 'wireless-networks', api_endpoint=nautobot_url, token=nautobot_token, api_filter='name=\"My Wireless Network\"') }}"
    test_vlan: "{{ lookup('networktocode.nautobot.lookup', 'vlans', api_endpoint=nautobot_url, token=nautobot_token, api_filter='name=\"Test VLAN 1\"') }}"

- name: "1 - Create controller managed device group wireless network assignment"
  networktocode.nautobot.controller_managed_device_group_wireless_network_assignment:
    url: "{{ nautobot_url }}"
    token: "{{ nautobot_token }}"
    controller_managed_device_group: "Test Controller Managed Device Group"
    wireless_network: "My Wireless Network"
    state: present
  register: test_one

- name: "1 - ASSERT"
  assert:
    that:
      - test_one is changed
      - test_one['diff']['before']['state'] == "absent"
      - test_one['diff']['after']['state'] == "present"
      - test_one['controller_managed_device_group_wireless_network_assignment']['controller_managed_device_group'] == test_controller_managed_device_group['key']
      - test_one['controller_managed_device_group_wireless_network_assignment']['wireless_network'] == test_wireless_network['key']
      - "'created' in test_one['msg']"

- name: "2 - Duplicate"
  networktocode.nautobot.controller_managed_device_group_wireless_network_assignment:
    url: "{{ nautobot_url }}"
    token: "{{ nautobot_token }}"
    controller_managed_device_group: "Test Controller Managed Device Group"
    wireless_network: "My Wireless Network"
    state: present
  register: test_two

- name: "2 - ASSERT"
  assert:
    that:
      - not test_two['changed']
      - test_two['controller_managed_device_group_wireless_network_assignment']['controller_managed_device_group'] == test_controller_managed_device_group['key']
      - test_two['controller_managed_device_group_wireless_network_assignment']['wireless_network'] == test_wireless_network['key']
      - "'already exists' in test_two['msg']"

- name: "3 - Update with VLAN"
  networktocode.nautobot.controller_managed_device_group_wireless_network_assignment:
    url: "{{ nautobot_url }}"
    token: "{{ nautobot_token }}"
    controller_managed_device_group: "Test Controller Managed Device Group"
    wireless_network: "My Wireless Network"
    vlan: "Test VLAN 1"
    state: present
  register: test_three

- name: "3 - ASSERT"
  assert:
    that:
      - test_three is changed
      - test_three['controller_managed_device_group_wireless_network_assignment']['vlan'] == test_vlan['key']

- name: "4 - Delete"
  networktocode.nautobot.controller_managed_device_group_wireless_network_assignment:
    url: "{{ nautobot_url }}"
    token: "{{ nautobot_token }}"
    controller_managed_device_group: "Test Controller Managed Device Group"
    wireless_network: "My Wireless Network"
    state: absent
  register: test_four

- name: "4 - ASSERT"
  assert:
    that:
      - test_four is changed
      - test_four['diff']['before']['state'] == "present"
      - test_four['diff']['after']['state'] == "absent"
      - "'deleted' in test_four['msg']"

- name: "5 - Delete idempotent"
  networktocode.nautobot.controller_managed_device_group_wireless_network_assignment:
    url: "{{ nautobot_url }}"
    token: "{{ nautobot_token }}"
    controller_managed_device_group: "Test Controller Managed Device Group"
    wireless_network: "My Wireless Network"
    state: absent
  register: test_five

- name: "5 - ASSERT"
  assert:
    that:
      - not test_five['changed']
      - "'already absent' in test_five['msg']"
