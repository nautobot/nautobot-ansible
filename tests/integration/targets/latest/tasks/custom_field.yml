---
##
##
### PYNAUTOBOT_CUSTOM_FIELD
##
##
- name: "1 - Create custom field within Nautobot with only required information"
  networktocode.nautobot.custom_field:
    url: "{{ nautobot_url }}"
    token: "{{ nautobot_token }}"
    label: Test Custom Field
    key: test_custom_field
    type: select
    content_types:
      - dcim.device
    custom_field_choices:
      objects:
        - value: "Choice A"
          weight: 100
  register: test_create_min

- name: "1 - ASSERT"
  assert:
    that:
      - test_create_min is changed
      - test_create_min['diff']['before']['state'] == "absent"
      - test_create_min['diff']['after']['state'] == "present"
      - test_create_min['custom_field']['label'] == "Test Custom Field"
      - test_create_min['custom_field']['key'] == "test_custom_field"
      - test_create_min['custom_field']['type'] == "select"
      - test_create_min['msg'] == "custom_field Test Custom Field created"
      - test_create_min['diff']['after']['custom_field_choices'] | length == 1

- name: "2 - Duplicate"
  networktocode.nautobot.custom_field:
    url: "{{ nautobot_url }}"
    token: "{{ nautobot_token }}"
    label: Test Custom Field
    key: test_custom_field
    type: select
    content_types:
      - dcim.device
    custom_field_choices:
      objects:
        - value: "Choice A"
          weight: 100
  register: test_create_idem

- name: "2 - ASSERT"
  assert:
    that:
      - not test_create_idem['changed']
      - test_create_idem['msg'] == "custom_field Test Custom Field already exists"
      - test_create_idem['custom_field']['label'] == "Test Custom Field"

- name: "3 - Merge second choice"
  networktocode.nautobot.custom_field:
    url: "{{ nautobot_url }}"
    token: "{{ nautobot_token }}"
    label: Test Custom Field
    custom_field_choices:
      objects:
        - value: "Choice B"
          weight: 200
  register: test_update

- name: "3 - ASSERT"
  assert:
    that:
      - test_update is changed
      - test_update['diff']['before']['custom_field_choices'] | length == 1
      - test_update['diff']['after']['custom_field_choices'] | length == 2

- name: "4 - Duplicate merge"
  networktocode.nautobot.custom_field:
    url: "{{ nautobot_url }}"
    token: "{{ nautobot_token }}"
    label: Test Custom Field
    custom_field_choices:
      objects:
        - value: "Choice B"
          weight: 200
  register: test_update_idem

- name: "4 - ASSERT"
  assert:
    that:
      - not test_update_idem['changed']

- name: "5 - Delete second choice"
  networktocode.nautobot.custom_field:
    url: "{{ nautobot_url }}"
    token: "{{ nautobot_token }}"
    label: Test Custom Field
    custom_field_choices:
      state: delete
      objects:
        - value: "Choice B"
          weight: 200
  register: test_m2m_delete

- name: "5 - ASSERT"
  assert:
    that:
      - test_m2m_delete is changed
      - test_m2m_delete['diff']['before']['custom_field_choices'] | length == 2
      - test_m2m_delete['diff']['after']['custom_field_choices'] | length == 1

- name: "6 - Duplicate delete"
  networktocode.nautobot.custom_field:
    url: "{{ nautobot_url }}"
    token: "{{ nautobot_token }}"
    label: Test Custom Field
    custom_field_choices:
      state: delete
      objects:
        - value: "Choice B"
          weight: 200
  register: test_m2m_delete_idem

- name: "6 - ASSERT"
  assert:
    that:
      - not test_m2m_delete_idem['changed']

- name: "7 - Replace choices"
  networktocode.nautobot.custom_field:
    url: "{{ nautobot_url }}"
    token: "{{ nautobot_token }}"
    label: Test Custom Field
    custom_field_choices:
      state: replace
      objects:
        - value: "Choice B"
          weight: 200
  register: test_m2m_replace

- name: "7 - ASSERT"
  assert:
    that:
      - test_m2m_replace is changed
      - test_m2m_replace['diff']['before']['custom_field_choices'] | length == 1
      - test_m2m_replace['diff']['after']['custom_field_choices'] | length == 1

- name: "8 - Duplicate replace"
  networktocode.nautobot.custom_field:
    url: "{{ nautobot_url }}"
    token: "{{ nautobot_token }}"
    label: Test Custom Field
    custom_field_choices:
      state: replace
      objects:
        - value: "Choice B"
          weight: 200
  register: test_m2m_replace_idem

- name: "8 - ASSERT"
  assert:
    that:
      - not test_m2m_replace_idem['changed']

- name: "9 - Delete custom field"
  networktocode.nautobot.custom_field:
    url: "{{ nautobot_url }}"
    token: "{{ nautobot_token }}"
    label: Test Custom Field
    state: absent
  register: test_delete

- name: "9 - ASSERT"
  assert:
    that:
      - test_delete is changed
      - test_delete['diff']['before']['state'] == "present"
      - test_delete['diff']['after']['state'] == "absent"
      - test_delete['custom_field']['label'] == "Test Custom Field"
      - "'deleted' in test_delete['msg']"

- name: "10 - Delete idempotent"
  networktocode.nautobot.custom_field:
    url: "{{ nautobot_url }}"
    token: "{{ nautobot_token }}"
    label: Test Custom Field
    state: absent
  register: test_delete_idem

- name: "10 - ASSERT"
  assert:
    that:
      - not test_delete_idem['changed']
      - "'already absent' in test_delete_idem['msg']"
