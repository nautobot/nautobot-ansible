---
##
##
### PYNAUTOBOT_VM_INTERFACE
##
##
- set_fact:
    vm100: "{{ lookup('networktocode.nautobot.lookup', 'virtual-machines', api_endpoint=nautobot_url, token=nautobot_token, api_filter='name=test100-vm') }}"
    tag_schnozzberry: "{{ lookup('networktocode.nautobot.lookup', 'tags', api_endpoint=nautobot_url, token=nautobot_token, api_filter='name=Schnozzberry') }}"
    wireless: "{{ lookup('networktocode.nautobot.lookup', 'vlans', api_endpoint=nautobot_url, token=nautobot_token, api_filter='name=Wireless') }}"
    vm_interface_role: "{{ lookup('networktocode.nautobot.lookup', 'roles', api_endpoint=nautobot_url, token=nautobot_token, api_filter='name=\"Test VM Interface Role\"' )}}"
    test_ip_one: "{{ lookup('networktocode.nautobot.lookup', 'ip-addresses', api_endpoint=nautobot_url, token=nautobot_token, api_filter='address=\"10.200.0.1/32\"') }}"
    test_ip_two: "{{ lookup('networktocode.nautobot.lookup', 'ip-addresses', api_endpoint=nautobot_url, token=nautobot_token, api_filter='address=\"10.200.0.2/32\"') }}"

- name: "PYNAUTOBOT_VM_INTERFACE 1: Necessary info creation"
  networktocode.nautobot.vm_interface:
    url: "{{ nautobot_url }}"
    token: "{{ nautobot_token }}"
    virtual_machine: "test100-vm"
    name: "Eth10"
    status: "Active"
    ip_addresses:
      objects:
        - ip_address: "10.200.0.1/32"
    state: present
  register: test_one

- name: "PYNAUTOBOT_VM_INTERFACE 1: ASSERT - Necessary info creation"
  assert:
    that:
      - test_one is changed
      - test_one['diff']['before']['state'] == "absent"
      - test_one['diff']['after']['state'] == "present"
      - test_one['interface']['name'] == "Eth10"
      - test_one['interface']['virtual_machine'] == vm100['key']
      - test_one['msg'] == "interface Eth10 created"
      - test_one['diff']['after']['ip_addresses'] | length == 1
      - test_ip_one['key'] in test_one['diff']['after']['ip_addresses']

- name: "PYNAUTOBOT_VM_INTERFACE 2: Create duplicate"
  networktocode.nautobot.vm_interface:
    url: "{{ nautobot_url }}"
    token: "{{ nautobot_token }}"
    virtual_machine: "test100-vm"
    name: "Eth10"
    status: "Active"
    ip_addresses:
      objects:
        - ip_address: "10.200.0.1/32"
    state: present
  register: test_two

- name: "PYNAUTOBOT_VM_INTERFACE 2: ASSERT - Create duplicate"
  assert:
    that:
      - not test_two['changed']
      - test_two['interface']['name'] == "Eth10"
      - test_two['interface']['virtual_machine'] == vm100['key']
      - test_two['msg'] == "interface Eth10 already exists"

- name: "PYNAUTOBOT_VM_INTERFACE 3: Updated"
  networktocode.nautobot.vm_interface:
    url: "{{ nautobot_url }}"
    token: "{{ nautobot_token }}"
    virtual_machine: "test100-vm"
    name: "Eth10"
    enabled: false
    mtu: 9000
    mac_address: "00:00:00:AA:AA:01"
    description: "Updated test100-vm"
    mode: Tagged
    untagged_vlan:
      name: Wireless
      location: "Child Test Location"
    tagged_vlans:
      - name: Data
        location: "Child Test Location"
      - name: VoIP
        location: "Child Test Location"
    ip_addresses:
      objects:
        - ip_address: "10.200.0.2/32"
    tags:
      - "Schnozzberry"
    state: present
  register: test_three

- name: "PYNAUTOBOT_VM_INTERFACE 3: ASSERT - Updated"
  assert:
    that:
      - test_three is changed
      - test_three['diff']['after']['enabled'] == false
      - test_three['diff']['after']['mtu'] == 9000
      - test_three['diff']['after']['mac_address'] == "00:00:00:AA:AA:01"
      - test_three['diff']['after']['description'] == "Updated test100-vm"
      - test_three['diff']['after']['mode'] == "tagged"
      - test_three['diff']['after']['untagged_vlan'] == wireless['key']
      - test_three['diff']['after']['tagged_vlans']|length == 2
      - test_three['diff']['after']['tags'][0] == tag_schnozzberry['key']
      - test_three['interface']['name'] == "Eth10"
      - test_three['interface']['status'] == active['key']
      - test_three['interface']['virtual_machine'] == vm100['key']
      - test_three['interface']['enabled'] == false
      - test_three['interface']['mtu'] == 9000
      - test_three['interface']['mac_address'] == "00:00:00:AA:AA:01"
      - test_three['interface']['description'] == "Updated test100-vm"
      - test_three['interface']['mode'] == "tagged"
      - test_three['interface']['untagged_vlan'] == wireless['key']
      - test_three['interface']['tagged_vlans']|length == 2
      - test_three['interface']['tags'][0] == tag_schnozzberry['key']
      - test_three['msg'] == "interface Eth10 updated"
      - test_three['diff']['before']['ip_addresses'] | length == 1
      - test_three['diff']['after']['ip_addresses'] | length == 2
      - test_ip_one['key'] in test_three['diff']['after']['ip_addresses']
      - test_ip_two['key'] in test_three['diff']['after']['ip_addresses']

- name: "PYNAUTOBOT_VM_INTERFACE 4: Duplicate merge"
  networktocode.nautobot.vm_interface:
    url: "{{ nautobot_url }}"
    token: "{{ nautobot_token }}"
    virtual_machine: "test100-vm"
    name: "Eth10"
    ip_addresses:
      objects:
        - ip_address: "10.200.0.2/32"
    state: present
  register: test_four

- name: "PYNAUTOBOT_VM_INTERFACE 4: ASSERT - Duplicate merge"
  assert:
    that:
      - not test_four['changed']
      - test_four['msg'] == "interface Eth10 already exists"

- name: "PYNAUTOBOT_VM_INTERFACE 5: Delete second IP address"
  networktocode.nautobot.vm_interface:
    url: "{{ nautobot_url }}"
    token: "{{ nautobot_token }}"
    virtual_machine: "test100-vm"
    name: "Eth10"
    ip_addresses:
      state: delete
      objects:
        - ip_address: "10.200.0.2/32"
    state: present
  register: test_five_m2m

- name: "PYNAUTOBOT_VM_INTERFACE 5: ASSERT - Delete M2M"
  assert:
    that:
      - test_five_m2m is changed
      - test_five_m2m['diff']['before']['ip_addresses'] | length == 2
      - test_five_m2m['diff']['after']['ip_addresses'] | length == 1
      - test_ip_one['key'] in test_five_m2m['diff']['after']['ip_addresses']
      - test_ip_two['key'] not in test_five_m2m['diff']['after']['ip_addresses']

- name: "PYNAUTOBOT_VM_INTERFACE 6: Duplicate delete"
  networktocode.nautobot.vm_interface:
    url: "{{ nautobot_url }}"
    token: "{{ nautobot_token }}"
    virtual_machine: "test100-vm"
    name: "Eth10"
    ip_addresses:
      state: delete
      objects:
        - ip_address: "10.200.0.2/32"
    state: present
  register: test_six_m2m

- name: "PYNAUTOBOT_VM_INTERFACE 6: ASSERT - Duplicate delete"
  assert:
    that:
      - not test_six_m2m['changed']

- name: "PYNAUTOBOT_VM_INTERFACE 7: Replace IP addresses"
  networktocode.nautobot.vm_interface:
    url: "{{ nautobot_url }}"
    token: "{{ nautobot_token }}"
    virtual_machine: "test100-vm"
    name: "Eth10"
    ip_addresses:
      state: replace
      objects:
        - ip_address: "10.200.0.2/32"
    state: present
  register: test_seven_m2m

- name: "PYNAUTOBOT_VM_INTERFACE 7: ASSERT - Replace"
  assert:
    that:
      - test_seven_m2m is changed
      - test_seven_m2m['diff']['before']['ip_addresses'] | length == 1
      - test_ip_one['key'] in test_seven_m2m['diff']['before']['ip_addresses']
      - test_seven_m2m['diff']['after']['ip_addresses'] | length == 1
      - test_ip_two['key'] in test_seven_m2m['diff']['after']['ip_addresses']

- name: "PYNAUTOBOT_VM_INTERFACE 8: Duplicate replace"
  networktocode.nautobot.vm_interface:
    url: "{{ nautobot_url }}"
    token: "{{ nautobot_token }}"
    virtual_machine: "test100-vm"
    name: "Eth10"
    ip_addresses:
      state: replace
      objects:
        - ip_address: "10.200.0.2/32"
    state: present
  register: test_eight_m2m

- name: "PYNAUTOBOT_VM_INTERFACE 8: ASSERT - Duplicate replace"
  assert:
    that:
      - not test_eight_m2m['changed']

- name: "PYNAUTOBOT_VM_INTERFACE 9: Delete"
  networktocode.nautobot.vm_interface:
    url: "{{ nautobot_url }}"
    token: "{{ nautobot_token }}"
    name: "Eth10"
    virtual_machine: "test100-vm"
    state: absent
  register: test_nine

- name: "PYNAUTOBOT_VM_INTERFACE 9: ASSERT - Delete"
  assert:
    that:
      - test_nine is changed
      - test_nine['interface']['name'] == "Eth10"
      - test_nine['interface']['virtual_machine'] == vm100['key']
      - test_nine['msg'] == "interface Eth10 deleted"

- name: "PYNAUTOBOT_VM_INTERFACE 10: Attempt to update interface with same name on other VMs"
  networktocode.nautobot.vm_interface:
    url: "{{ nautobot_url }}"
    token: "{{ nautobot_token }}"
    virtual_machine: "test100-vm"
    name: "Eth0"
    status: "Active"
    enabled: false
    mtu: 9000
    mac_address: "00:00:00:AA:AA:01"
    description: "Updated test100-vm Eth0 intf"
    mode: Tagged
    untagged_vlan:
      name: Wireless
      location: "Child Test Location"
    tagged_vlans:
      - name: Data
        location: "Child Test Location"
      - name: VoIP
        location: "Child Test Location"
    tags:
      - "Schnozzberry"
    state: present
  register: test_ten

- name: "PYNAUTOBOT_VM_INTERFACE 10: ASSERT - Updated"
  assert:
    that:
      - test_ten is changed
      - test_ten['diff']['after']['enabled'] == false
      - test_ten['diff']['after']['mtu'] == 9000
      - test_ten['diff']['after']['mac_address'] == "00:00:00:AA:AA:01"
      - test_ten['diff']['after']['description'] == "Updated test100-vm Eth0 intf"
      - test_ten['diff']['after']['mode'] == "tagged"
      - test_ten['diff']['after']['untagged_vlan'] == wireless['key']
      - test_ten['diff']['after']['tagged_vlans']|length == 2
      - test_ten['diff']['after']['tags'][0] == tag_schnozzberry['key']
      - test_ten['interface']['name'] == "Eth0"
      - test_ten['interface']['virtual_machine'] == vm100['key']
      - test_ten['interface']['enabled'] == false
      - test_ten['interface']['mtu'] == 9000
      - test_ten['interface']['mac_address'] == "00:00:00:AA:AA:01"
      - test_ten['interface']['description'] == "Updated test100-vm Eth0 intf"
      - test_ten['interface']['mode'] == "tagged"
      - test_ten['interface']['untagged_vlan'] == wireless['key']
      - test_ten['interface']['tagged_vlans']|length == 2
      - test_ten['interface']['tags'][0] == tag_schnozzberry['key']
      - test_ten['msg'] == "interface Eth0 updated"

- name: "PYNAUTOBOT_VM_INTERFACE 11: Created"
  networktocode.nautobot.vm_interface:
    url: "{{ nautobot_url }}"
    token: "{{ nautobot_token }}"
    virtual_machine: "test100-vm"
    name: "Eth101"
    enabled: false
    mtu: 9000
    mac_address: "00:00:00:AA:AA:01"
    description: "Updated test100-vm"
    mode: Tagged
    role: "Test VM Interface Role"
    status: "Active"
    untagged_vlan:
      name: Wireless
      location: "Child Test Location"
    tagged_vlans:
      - name: Data
        location: "Child Test Location"
      - name: VoIP
        location: "Child Test Location"
    tags:
      - "Schnozzberry"
    state: present
  register: test_eleven

- name: "PYNAUTOBOT_VM_INTERFACE 11: ASSERT - Created"
  assert:
    that:
      - test_eleven is changed
      - test_eleven['diff']['before']['state'] == "absent"
      - test_eleven['diff']['after']['state'] == "present"
      - test_eleven['interface']['name'] == "Eth101"
      - test_eleven['interface']['status'] == active['key']
      - test_eleven['interface']['virtual_machine'] == vm100['key']
      - test_eleven['interface']['enabled'] == false
      - test_eleven['interface']['mtu'] == 9000
      - test_eleven['interface']['mac_address'] == "00:00:00:AA:AA:01"
      - test_eleven['interface']['description'] == "Updated test100-vm"
      - test_eleven['interface']['mode'] == "tagged"
      - test_eleven['interface']['untagged_vlan'] == wireless['key']
      - test_eleven['interface']['tagged_vlans']|length == 2
      - test_eleven['interface']['tags'][0] == tag_schnozzberry['key']
      - test_eleven['interface']['role'] == vm_interface_role['key']
      - test_eleven['msg'] == "interface Eth101 created"
