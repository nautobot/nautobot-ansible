##
##
### PYNAUTOBOT_PROVIDER_NETWORK
##
##
- name: "PYNAUTOBOT_PROVIDER_NETWORK 1: Create provider network within Nautobot with only required information"
  networktocode.nautobot.provider_network:
    url: "{{ nautobot_url }}"
    token: "{{ nautobot_token }}"
    name: Test Provider Network One
    provider: Test Provider
    state: present
  register: test_one

- name: "PYNAUTOBOT_PROVIDER_NETWORK 1: ASSERT - Necessary info creation"
  assert:
    that:
      - test_one is changed
      - test_one['diff']['before']['state'] == "absent"
      - test_one['diff']['after']['state'] == "present"
      - test_one['provider_network']['name'] == "Test Provider Network One"
      - test_one['msg'] == "provider_network Test Provider Network One created"

- name: "PYNAUTOBOT_PROVIDER_NETWORK 2: Duplicate"
  networktocode.nautobot.provider_network:
    url: "{{ nautobot_url }}"
    token: "{{ nautobot_token }}"
    name: Test Provider Network One
    provider: Test Provider
    state: present
  register: test_two

- name: "PYNAUTOBOT_PROVIDER_NETWORK 2: ASSERT - Create duplicate"
  assert:
    that:
      - not test_two['changed']
      - test_two['provider_network']['name'] == "Test Provider Network One"
      - test_two['msg'] == "provider_network Test Provider Network One already exists"

- name: "PYNAUTOBOT_PROVIDER_NETWORK 3: Update provider network with other fields"
  networktocode.nautobot.provider_network:
    url: "{{ nautobot_url }}"
    token: "{{ nautobot_token }}"
    name: Test Provider Network One
    provider: Test Provider
    description: "A test provider network"
    comments: "Some comments about this provider network"
    state: present
  register: test_three

- name: "PYNAUTOBOT_PROVIDER_NETWORK 3: ASSERT - Updated"
  assert:
    that:
      - test_three is changed
      - test_three['diff']['after']['description'] == "A test provider network"
      - test_three['diff']['after']['comments'] == "Some comments about this provider network"
      - test_three['provider_network']['name'] == "Test Provider Network One"
      - test_three['provider_network']['description'] == "A test provider network"
      - test_three['provider_network']['comments'] == "Some comments about this provider network"
      - test_three['msg'] == "provider_network Test Provider Network One updated"

- name: "PYNAUTOBOT_PROVIDER_NETWORK 4: Idempotent update"
  networktocode.nautobot.provider_network:
    url: "{{ nautobot_url }}"
    token: "{{ nautobot_token }}"
    name: Test Provider Network One
    provider: Test Provider
    description: "A test provider network"
    comments: "Some comments about this provider network"
    state: present
  register: test_four

- name: "PYNAUTOBOT_PROVIDER_NETWORK 4: ASSERT - Idempotent"
  assert:
    that:
      - not test_four['changed']
      - test_four['provider_network']['name'] == "Test Provider Network One"
      - test_four['msg'] == "provider_network Test Provider Network One already exists"

- name: "PYNAUTOBOT_PROVIDER_NETWORK 5: Delete provider network within nautobot"
  networktocode.nautobot.provider_network:
    url: "{{ nautobot_url }}"
    token: "{{ nautobot_token }}"
    name: Test Provider Network One
    provider: Test Provider
    state: absent
  register: test_five

- name: "PYNAUTOBOT_PROVIDER_NETWORK 5: ASSERT - Delete"
  assert:
    that:
      - test_five is changed
      - test_five['provider_network']['name'] == "Test Provider Network One"
      - test_five['provider_network']['description'] == "A test provider network"
      - test_five['provider_network']['comments'] == "Some comments about this provider network"
      - test_five['msg'] == "provider_network Test Provider Network One deleted"

- name: "PYNAUTOBOT_PROVIDER_NETWORK 6: Idempotent delete"
  networktocode.nautobot.provider_network:
    url: "{{ nautobot_url }}"
    token: "{{ nautobot_token }}"
    name: Test Provider Network One
    provider: Test Provider
    state: absent
  register: test_six

- name: "PYNAUTOBOT_PROVIDER_NETWORK 6: ASSERT - Idempotent delete"
  assert:
    that:
      - not test_six['changed']
      - test_six['msg'] == "provider_network Test Provider Network One already absent"
