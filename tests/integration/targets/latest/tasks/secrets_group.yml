---
##
##
### PYNAUTOBOT_SECRETS_GROUP
##
##
- set_fact:
    test_secret_one: "{{ lookup('networktocode.nautobot.lookup', 'secrets', api_endpoint=nautobot_url, token=nautobot_token, api_filter='name=\"Test Secret\"') }}"
    test_secret_two: "{{ lookup('networktocode.nautobot.lookup', 'secrets', api_endpoint=nautobot_url, token=nautobot_token, api_filter='name=\"Test Secret Two\"') }}"

- name: "1 - Create a secrets group"
  networktocode.nautobot.secrets_group:
    url: "{{ nautobot_url }}"
    token: "{{ nautobot_token }}"
    name: My Secrets Group
    secrets:
      objects:
        - secret: "Test Secret"
          access_type: "Generic"
          secret_type: "secret"
    state: present
  register: test_create_min

- name: "1 - ASSERT"
  assert:
    that:
      - test_create_min is changed
      - test_create_min['diff']['before']['state'] == "absent"
      - test_create_min['diff']['after']['state'] == "present"
      - test_create_min['secrets_group']['name'] == "My Secrets Group"
      - test_create_min['msg'] == "secrets_group My Secrets Group created"
      - test_create_min['diff']['after']['secrets'] | length == 1
      - test_secret_one['key'] in test_create_min['diff']['after']['secrets']

- name: "2 - Duplicate"
  networktocode.nautobot.secrets_group:
    url: "{{ nautobot_url }}"
    token: "{{ nautobot_token }}"
    name: My Secrets Group
    secrets:
      objects:
        - secret: "Test Secret"
          access_type: "Generic"
          secret_type: "secret"
    state: present
  register: test_create_idem

- name: "2 - ASSERT"
  assert:
    that:
      - not test_create_idem['changed']
      - test_create_idem['msg'] == "secrets_group My Secrets Group already exists"
      - test_create_idem['secrets_group']['name'] == "My Secrets Group"

- name: "3 - Update secrets group with second secret (merge)"
  networktocode.nautobot.secrets_group:
    url: "{{ nautobot_url }}"
    token: "{{ nautobot_token }}"
    name: My Secrets Group
    secrets:
      objects:
        - secret: "Test Secret Two"
          access_type: "Generic"
          secret_type: "token"
    state: present
  register: test_update

- name: "3 - ASSERT"
  assert:
    that:
      - test_update is changed
      - test_update['diff']['before']['secrets'] | length == 1
      - test_update['diff']['after']['secrets'] | length == 2
      - test_secret_one['key'] in test_update['diff']['after']['secrets']
      - test_secret_two['key'] in test_update['diff']['after']['secrets']

- name: "4 - Duplicate merge"
  networktocode.nautobot.secrets_group:
    url: "{{ nautobot_url }}"
    token: "{{ nautobot_token }}"
    name: My Secrets Group
    secrets:
      objects:
        - secret: "Test Secret Two"
          access_type: "Generic"
          secret_type: "token"
    state: present
  register: test_update_idem

- name: "4 - ASSERT"
  assert:
    that:
      - not test_update_idem['changed']
      - test_update_idem['msg'] == "secrets_group My Secrets Group already exists"

- name: "5 - Delete second secret association"
  networktocode.nautobot.secrets_group:
    url: "{{ nautobot_url }}"
    token: "{{ nautobot_token }}"
    name: My Secrets Group
    secrets:
      state: delete
      objects:
        - secret: "Test Secret Two"
          access_type: "Generic"
          secret_type: "token"
    state: present
  register: test_m2m_delete

- name: "5 - ASSERT"
  assert:
    that:
      - test_m2m_delete is changed
      - test_m2m_delete['diff']['before']['secrets'] | length == 2
      - test_m2m_delete['diff']['after']['secrets'] | length == 1
      - test_secret_one['key'] in test_m2m_delete['diff']['after']['secrets']
      - test_secret_two['key'] not in test_m2m_delete['diff']['after']['secrets']

- name: "6 - Duplicate delete"
  networktocode.nautobot.secrets_group:
    url: "{{ nautobot_url }}"
    token: "{{ nautobot_token }}"
    name: My Secrets Group
    secrets:
      state: delete
      objects:
        - secret: "Test Secret Two"
          access_type: "Generic"
          secret_type: "token"
    state: present
  register: test_m2m_delete_idem

- name: "6 - ASSERT"
  assert:
    that:
      - not test_m2m_delete_idem['changed']

- name: "7 - Replace secrets"
  networktocode.nautobot.secrets_group:
    url: "{{ nautobot_url }}"
    token: "{{ nautobot_token }}"
    name: My Secrets Group
    secrets:
      state: replace
      objects:
        - secret: "Test Secret Two"
          access_type: "Generic"
          secret_type: "token"
    state: present
  register: test_m2m_replace

- name: "7 - ASSERT"
  assert:
    that:
      - test_m2m_replace is changed
      - test_m2m_replace['diff']['before']['secrets'] | length == 1
      - test_secret_one['key'] in test_m2m_replace['diff']['before']['secrets']
      - test_m2m_replace['diff']['after']['secrets'] | length == 1
      - test_secret_two['key'] in test_m2m_replace['diff']['after']['secrets']

- name: "8 - Duplicate replace"
  networktocode.nautobot.secrets_group:
    url: "{{ nautobot_url }}"
    token: "{{ nautobot_token }}"
    name: My Secrets Group
    secrets:
      state: replace
      objects:
        - secret: "Test Secret Two"
          access_type: "Generic"
          secret_type: "token"
    state: present
  register: test_m2m_replace_idem

- name: "8 - ASSERT"
  assert:
    that:
      - not test_m2m_replace_idem['changed']

- name: "9 - Delete secrets group"
  networktocode.nautobot.secrets_group:
    url: "{{ nautobot_url }}"
    token: "{{ nautobot_token }}"
    name: My Secrets Group
    state: absent
  register: test_delete

- name: "9 - ASSERT"
  assert:
    that:
      - test_delete is changed
      - test_delete['diff']['before']['state'] == "present"
      - test_delete['diff']['after']['state'] == "absent"
      - test_delete['secrets_group']['name'] == "My Secrets Group"
      - "'deleted' in test_delete['msg']"

- name: "10 - Delete idempotent"
  networktocode.nautobot.secrets_group:
    url: "{{ nautobot_url }}"
    token: "{{ nautobot_token }}"
    name: My Secrets Group
    state: absent
  register: test_delete_idem

- name: "10 - ASSERT"
  assert:
    that:
      - not test_delete_idem['changed']
      - "'already absent' in test_delete_idem['msg']"
