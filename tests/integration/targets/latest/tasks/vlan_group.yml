---
##
##
### PYNAUTOBOT_VLAN_GROUP
##
##
- set_fact:
    test_location: "{{ lookup('networktocode.nautobot.lookup', 'locations', api_endpoint=nautobot_url, token=nautobot_token, api_filter='name=\"Child Test Location\" parent=\"Parent Test Location\"') }}"
    test_location2: "{{ lookup('networktocode.nautobot.lookup', 'locations', api_endpoint=nautobot_url, token=nautobot_token, api_filter='name=\"Child-Child Test Location\"') }}"

- name: "VLAN_GROUP 1: Necessary info creation"
  networktocode.nautobot.vlan_group:
    url: "{{ nautobot_url }}"
    token: "{{ nautobot_token }}"
    name: "VLAN Group One"
    location:
      name: "Child Test Location"
      parent: "Parent Test Location"
    state: present
  register: test_one

- name: "VLAN_GROUP 1: ASSERT - Necessary info creation"
  assert:
    that:
      - test_one is changed
      - test_one['diff']['before']['state'] == "absent"
      - test_one['diff']['after']['state'] == "present"
      - test_one['vlan_group']['name'] == "VLAN Group One"
      - test_one['vlan_group']['location'] == test_location['key']
      - test_one['msg'] == "vlan_group VLAN Group One created"

- name: "VLAN_GROUP 2: Create duplicate"
  networktocode.nautobot.vlan_group:
    url: "{{ nautobot_url }}"
    token: "{{ nautobot_token }}"
    name: "VLAN Group One"
    location:
      name: "Child Test Location"
      parent: "Parent Test Location"
    state: present
  register: test_two

- name: "VLAN_GROUP 2: ASSERT - Create duplicate"
  assert:
    that:
      - not test_two['changed']
      - test_two['vlan_group']['name'] == "VLAN Group One"
      - test_two['vlan_group']['location'] == test_location['key']
      - test_two['msg'] == "vlan_group VLAN Group One already exists"

- name: "VLAN_GROUP 3: ASSERT - Create with same name, different location"
  networktocode.nautobot.vlan_group:
    url: "{{ nautobot_url }}"
    token: "{{ nautobot_token }}"
    name: "VLAN Group One"
    location: "Child-Child Test Location"
    state: present
  register: test_three
  ignore_errors: true

- name: "VLAN_GROUP 3: ASSERT - Create with same name, different location"
  assert:
    that:
      - test_three is failed
      - "'already exists' in test_three['msg']"

- name: "VLAN_GROUP 4: ASSERT - Create vlan group, no location"
  networktocode.nautobot.vlan_group:
    url: "{{ nautobot_url }}"
    token: "{{ nautobot_token }}"
    name: "VLAN Group One"
    state: present
  register: test_four

- name: "VLAN_GROUP 4: ASSERT - Create with same name, different location"
  assert:
    that:
      - not test_four is changed
      - test_four['msg'] == "vlan_group VLAN Group One already exists"

- name: "VLAN_GROUP 5: ASSERT - Delete"
  networktocode.nautobot.vlan_group:
    url: "{{ nautobot_url }}"
    token: "{{ nautobot_token }}"
    name: VLAN Group One
    state: absent
  register: test_five

- name: "VLAN_GROUP 5: ASSERT - Delete"
  assert:
    that:
      - test_five is changed
      - test_five['diff']['before']['state'] == "present"
      - test_five['diff']['after']['state'] == "absent"
      - test_five['vlan_group']['name'] == "VLAN Group One"
      - test_five['vlan_group']['location'] == test_location['key']
      - test_five['msg'] == "vlan_group VLAN Group One deleted"

- name: "VLAN_GROUP 6: ASSERT - Delete non existing"
  networktocode.nautobot.vlan_group:
    url: "{{ nautobot_url }}"
    token: "{{ nautobot_token }}"
    name: VLAN Group One
    state: absent
  register: test_six

- name: "VLAN_GROUP 6: ASSERT - Delete non existing`"
  assert:
    that:
      - not test_six['changed']
      - test_six['vlan_group'] == None
      - test_six['msg'] == "vlan_group VLAN Group One already absent"

  - name: "VLAN_GROUP 7: Create with range"
    networktocode.nautobot.vlan_group:
      url: "{{ nautobot_url }}"
      token: "{{ nautobot_token }}"
      name: "VLAN Group Range"
      location:
        name: "Child Test Location"
        parent: "Parent Test Location"
      range: "1-40,200"
      state: present
    register: test_seven

  - name: "VLAN_GROUP 7: ASSERT - Create with range"
    assert:
      that:
        - test_seven is changed
        - test_seven['diff']['before']['state'] == "absent"
        - test_seven['diff']['after']['state'] == "present"
        - test_seven['vlan_group']['name'] == "VLAN Group Range"
        - test_seven['vlan_group']['range'] == "1-40,200"
        - test_seven['msg'] == "vlan_group VLAN Group Range created"

  - name: "VLAN_GROUP 8: Create with range idempotent"
    networktocode.nautobot.vlan_group:
      url: "{{ nautobot_url }}"
      token: "{{ nautobot_token }}"
      name: "VLAN Group Range"
      location:
        name: "Child Test Location"
        parent: "Parent Test Location"
      range: "1-40,200"
      state: present
    register: test_eight

  - name: "VLAN_GROUP 8: ASSERT - Create with range idempotent"
    assert:
      that:
        - not test_eight['changed']
        - test_eight['vlan_group']['range'] == "1-40,200"
        - test_eight['msg'] == "vlan_group VLAN Group Range already exists"

  - name: "VLAN_GROUP 9: Update range on existing group"
    networktocode.nautobot.vlan_group:
      url: "{{ nautobot_url }}"
      token: "{{ nautobot_token }}"
      name: "VLAN Group Range"
      location:
        name: "Child Test Location"
        parent: "Parent Test Location"
      range: "1-100,500-600"
      state: present
    register: test_nine

  - name: "VLAN_GROUP 9: ASSERT - Update range on existing group"
    assert:
      that:
        - test_nine is changed
        - test_nine['diff']['after']['range'] == "1-100,500-600"
        - test_nine['vlan_group']['range'] == "1-100,500-600"
        - test_nine['msg'] == "vlan_group VLAN Group Range updated"

  - name: "VLAN_GROUP 10: Cleanup range group"
    networktocode.nautobot.vlan_group:
      url: "{{ nautobot_url }}"
      token: "{{ nautobot_token }}"
      name: "VLAN Group Range"
      state: absent
    register: test_ten

  - name: "VLAN_GROUP 10: ASSERT - Cleanup range group"
    assert:
      that:
        - test_ten is changed
        - test_ten['diff']['after']['state'] == "absent"
