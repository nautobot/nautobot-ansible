---
##
##
### PYNAUTOBOT_WEBHOOK (generated module)
##
##
- name: "WEBHOOK 1: Necessary info creation"
  networktocode.nautobot.webhook:
    url: "{{ nautobot_url }}"
    token: "{{ nautobot_token }}"
    name: "Test Webhook"
    content_types: ["dcim.device"]
    payload_url: https://example.com/hook
    type_create: true
    webhook_secret: "s3cr3t"
    state: present
  register: test_one

- name: "WEBHOOK 1: ASSERT - Necessary info creation"
  assert:
    that:
      - test_one is changed
      - test_one['diff']['before']['state'] == "absent"
      - test_one['diff']['after']['state'] == "present"
      - test_one['webhook']['name'] == "Test Webhook"
      - test_one['webhook']['content_types'] == ["dcim.device"]
      - test_one['msg'] == "webhook Test Webhook created"

- name: "WEBHOOK 2: Create duplicate"
  networktocode.nautobot.webhook:
    url: "{{ nautobot_url }}"
    token: "{{ nautobot_token }}"
    name: "Test Webhook"
    content_types: ["dcim.device"]
    payload_url: https://example.com/hook
    type_create: true
    webhook_secret: "s3cr3t"
    state: present
  register: test_two

- name: "WEBHOOK 2: ASSERT - Create duplicate"
  assert:
    that:
      - not test_two['changed']
      - test_two['webhook']['id'] == test_one['webhook']['id']
      - test_two['msg'] == "webhook Test Webhook already exists"

- name: "WEBHOOK 3: Update"
  networktocode.nautobot.webhook:
    url: "{{ nautobot_url }}"
    token: "{{ nautobot_token }}"
    name: "Test Webhook"
    webhook_secret: "n3w-s3cr3t"
    http_method: PUT
    state: present
  register: test_three

- name: "WEBHOOK 3: ASSERT - Update"
  assert:
    that:
      - test_three is changed
      - test_three['webhook']['http_method'] == "PUT"
      - test_three['msg'] == "webhook Test Webhook updated"

- name: "WEBHOOK 4: Delete"
  networktocode.nautobot.webhook:
    url: "{{ nautobot_url }}"
    token: "{{ nautobot_token }}"
    name: "Test Webhook"
    state: absent
  register: test_four

- name: "WEBHOOK 4: ASSERT - Delete"
  assert:
    that:
      - test_four is changed
      - test_four['diff']['before']['state'] == "present"
      - test_four['diff']['after']['state'] == "absent"
      - test_four['msg'] == "webhook Test Webhook deleted"

- name: "WEBHOOK 5: Delete again"
  networktocode.nautobot.webhook:
    url: "{{ nautobot_url }}"
    token: "{{ nautobot_token }}"
    name: "Test Webhook"
    state: absent
  register: test_five

- name: "WEBHOOK 5: ASSERT - Already absent"
  assert:
    that:
      - not test_five['changed']
      - test_five['msg'] == "webhook Test Webhook already absent"
