---
##
##
### PYNAUTOBOT_CONTROLLER_MANAGED_DEVICE_GROUP_RADIO_PROFILE_ASSIGNMENT
##
##
- set_fact:
    test_controller_managed_device_group: "{{ lookup('networktocode.nautobot.lookup', 'controller-managed-device-groups', api_endpoint=nautobot_url, token=nautobot_token, api_filter='name=\"Test Controller Managed Device Group\"') }}"
    test_radio_profile: "{{ lookup('networktocode.nautobot.lookup', 'radio-profiles', api_endpoint=nautobot_url, token=nautobot_token, api_filter='name=\"Test Radio Profile\"') }}"

- name: "1 - Create controller managed device group radio profile assignment"
  networktocode.nautobot.controller_managed_device_group_radio_profile_assignment:
    url: "{{ nautobot_url }}"
    token: "{{ nautobot_token }}"
    controller_managed_device_group: "Test Controller Managed Device Group"
    radio_profile: "Test Radio Profile"
    state: present
  register: test_one

- name: "1 - ASSERT"
  assert:
    that:
      - test_one is changed
      - test_one['diff']['before']['state'] == "absent"
      - test_one['diff']['after']['state'] == "present"
      - test_one['controller_managed_device_group_radio_profile_assignment']['controller_managed_device_group'] == test_controller_managed_device_group['key']
      - test_one['controller_managed_device_group_radio_profile_assignment']['radio_profile'] == test_radio_profile['key']
      - "'created' in test_one['msg']"

- name: "2 - Duplicate"
  networktocode.nautobot.controller_managed_device_group_radio_profile_assignment:
    url: "{{ nautobot_url }}"
    token: "{{ nautobot_token }}"
    controller_managed_device_group: "Test Controller Managed Device Group"
    radio_profile: "Test Radio Profile"
    state: present
  register: test_two

- name: "2 - ASSERT"
  assert:
    that:
      - not test_two['changed']
      - test_two['controller_managed_device_group_radio_profile_assignment']['controller_managed_device_group'] == test_controller_managed_device_group['key']
      - test_two['controller_managed_device_group_radio_profile_assignment']['radio_profile'] == test_radio_profile['key']
      - "'already exists' in test_two['msg']"

- name: "3 - Delete"
  networktocode.nautobot.controller_managed_device_group_radio_profile_assignment:
    url: "{{ nautobot_url }}"
    token: "{{ nautobot_token }}"
    controller_managed_device_group: "Test Controller Managed Device Group"
    radio_profile: "Test Radio Profile"
    state: absent
  register: test_three

- name: "3 - ASSERT"
  assert:
    that:
      - test_three is changed
      - test_three['diff']['before']['state'] == "present"
      - test_three['diff']['after']['state'] == "absent"
      - "'deleted' in test_three['msg']"

- name: "4 - Delete idempotent"
  networktocode.nautobot.controller_managed_device_group_radio_profile_assignment:
    url: "{{ nautobot_url }}"
    token: "{{ nautobot_token }}"
    controller_managed_device_group: "Test Controller Managed Device Group"
    radio_profile: "Test Radio Profile"
    state: absent
  register: test_four

- name: "4 - ASSERT"
  assert:
    that:
      - not test_four['changed']
      - "'already absent' in test_four['msg']"
