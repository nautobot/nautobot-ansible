##
##
### PYNAUTOBOT_DYNAMIC_GROUP - Static Group with M2M static_group_associations
##
##
- set_fact:
    test_device_one: "{{ lookup('networktocode.nautobot.lookup', 'devices', api_endpoint=nautobot_url, token=nautobot_token, api_filter='name=test100') }}"
    test_device_two: "{{ lookup('networktocode.nautobot.lookup', 'devices', api_endpoint=nautobot_url, token=nautobot_token, api_filter='name=TestDeviceR1') }}"

- name: "SGA 1 - Create static group with one association"
  networktocode.nautobot.dynamic_group:
    url: "{{ nautobot_url }}"
    token: "{{ nautobot_token }}"
    name: My Static Group
    group_type: static
    content_type: dcim.device
    static_group_associations:
      objects:
        - associated_object_type: "dcim.device"
          associated_object_id: "{{ test_device_one['key'] }}"
  register: test_sga_create

- name: "SGA 1 - ASSERT"
  assert:
    that:
      - test_sga_create is changed
      - test_sga_create['diff']['before']['state'] == "absent"
      - test_sga_create['diff']['after']['state'] == "present"
      - test_sga_create['dynamic_group']['name'] == "My Static Group"
      - test_sga_create['dynamic_group']['group_type'] == "static"
      - test_sga_create['dynamic_group']['content_type'] == "dcim.device"
      - test_sga_create['diff']['after']['static_group_associations'] | length == 1
      - test_sga_create['msg'] == "dynamic_group My Static Group created"

- name: "SGA 2 - Duplicate"
  networktocode.nautobot.dynamic_group:
    url: "{{ nautobot_url }}"
    token: "{{ nautobot_token }}"
    name: My Static Group
    group_type: static
    content_type: dcim.device
    static_group_associations:
      objects:
        - associated_object_type: "dcim.device"
          associated_object_id: "{{ test_device_one['key'] }}"
  register: test_sga_create_idem

- name: "SGA 2 - ASSERT"
  assert:
    that:
      - not test_sga_create_idem['changed']
      - test_sga_create_idem['msg'] == "dynamic_group My Static Group already exists"
      - test_sga_create_idem['dynamic_group']['name'] == "My Static Group"

- name: "SGA 3 - Merge second association"
  networktocode.nautobot.dynamic_group:
    url: "{{ nautobot_url }}"
    token: "{{ nautobot_token }}"
    name: My Static Group
    static_group_associations:
      objects:
        - associated_object_type: "dcim.device"
          associated_object_id: "{{ test_device_two['key'] }}"
  register: test_sga_merge

- name: "SGA 3 - ASSERT"
  assert:
    that:
      - test_sga_merge is changed
      - test_sga_merge['diff']['before']['static_group_associations'] | length == 1
      - test_sga_merge['diff']['after']['static_group_associations'] | length == 2

- name: "SGA 4 - Duplicate merge"
  networktocode.nautobot.dynamic_group:
    url: "{{ nautobot_url }}"
    token: "{{ nautobot_token }}"
    name: My Static Group
    static_group_associations:
      objects:
        - associated_object_type: "dcim.device"
          associated_object_id: "{{ test_device_two['key'] }}"
  register: test_sga_merge_idem

- name: "SGA 4 - ASSERT"
  assert:
    that:
      - not test_sga_merge_idem['changed']

# Look up association records for UUID assertions
- set_fact:
    sg_assoc_one: "{{ lookup('networktocode.nautobot.lookup', 'static-group-associations', api_endpoint=nautobot_url, token=nautobot_token, api_filter='dynamic_group=\"My Static Group\" associated_object_id=\"' + test_device_one['key'] + '\"') }}"
    sg_assoc_two: "{{ lookup('networktocode.nautobot.lookup', 'static-group-associations', api_endpoint=nautobot_url, token=nautobot_token, api_filter='dynamic_group=\"My Static Group\" associated_object_id=\"' + test_device_two['key'] + '\"') }}"

- name: "SGA 5 - Delete second association"
  networktocode.nautobot.dynamic_group:
    url: "{{ nautobot_url }}"
    token: "{{ nautobot_token }}"
    name: My Static Group
    static_group_associations:
      state: delete
      objects:
        - associated_object_type: "dcim.device"
          associated_object_id: "{{ test_device_two['key'] }}"
  register: test_sga_delete

- name: "SGA 5 - ASSERT"
  assert:
    that:
      - test_sga_delete is changed
      - test_sga_delete['diff']['before']['static_group_associations'] | length == 2
      - test_sga_delete['diff']['after']['static_group_associations'] | length == 1
      - sg_assoc_one['key'] in test_sga_delete['diff']['after']['static_group_associations']
      - sg_assoc_two['key'] not in test_sga_delete['diff']['after']['static_group_associations']

- name: "SGA 6 - Duplicate delete"
  networktocode.nautobot.dynamic_group:
    url: "{{ nautobot_url }}"
    token: "{{ nautobot_token }}"
    name: My Static Group
    static_group_associations:
      state: delete
      objects:
        - associated_object_type: "dcim.device"
          associated_object_id: "{{ test_device_two['key'] }}"
  register: test_sga_delete_idem

- name: "SGA 6 - ASSERT"
  assert:
    that:
      - not test_sga_delete_idem['changed']

- name: "SGA 7 - Replace associations"
  networktocode.nautobot.dynamic_group:
    url: "{{ nautobot_url }}"
    token: "{{ nautobot_token }}"
    name: My Static Group
    static_group_associations:
      state: replace
      objects:
        - associated_object_type: "dcim.device"
          associated_object_id: "{{ test_device_two['key'] }}"
  register: test_sga_replace

- name: "SGA 7 - ASSERT"
  assert:
    that:
      - test_sga_replace is changed
      - test_sga_replace['diff']['before']['static_group_associations'] | length == 1
      - sg_assoc_one['key'] in test_sga_replace['diff']['before']['static_group_associations']
      - test_sga_replace['diff']['after']['static_group_associations'] | length == 1

- name: "SGA 8 - Duplicate replace"
  networktocode.nautobot.dynamic_group:
    url: "{{ nautobot_url }}"
    token: "{{ nautobot_token }}"
    name: My Static Group
    static_group_associations:
      state: replace
      objects:
        - associated_object_type: "dcim.device"
          associated_object_id: "{{ test_device_two['key'] }}"
  register: test_sga_replace_idem

- name: "SGA 8 - ASSERT"
  assert:
    that:
      - not test_sga_replace_idem['changed']

- name: "SGA 9 - Delete static group"
  networktocode.nautobot.dynamic_group:
    url: "{{ nautobot_url }}"
    token: "{{ nautobot_token }}"
    name: My Static Group
    state: absent
  register: test_sga_group_delete

- name: "SGA 9 - ASSERT"
  assert:
    that:
      - test_sga_group_delete is changed
      - test_sga_group_delete['diff']['before']['state'] == "present"
      - test_sga_group_delete['diff']['after']['state'] == "absent"
      - test_sga_group_delete['dynamic_group']['name'] == "My Static Group"
      - "'deleted' in test_sga_group_delete['msg']"

- name: "SGA 10 - Delete idempotent"
  networktocode.nautobot.dynamic_group:
    url: "{{ nautobot_url }}"
    token: "{{ nautobot_token }}"
    name: My Static Group
    state: absent
  register: test_sga_group_delete_idem

- name: "SGA 10 - ASSERT"
  assert:
    that:
      - not test_sga_group_delete_idem['changed']
      - "'already absent' in test_sga_group_delete_idem['msg']"