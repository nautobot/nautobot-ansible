##
- name: "7 - Check mode - Replace contacts on test100 with Jane Doe"
  networktocode.nautobot.device:
    url: "{{ nautobot_url }}"
    token: "{{ nautobot_token }}"
    name: "test100"
    contacts:
      state: replace
      objects:
        - contact: "Jane Doe"
          role: "User"
          status: "Active"
    state: present
  register: cm_contact_replace
  check_mode: yes

- name: "7 - ASSERT - Check mode contact replace reports correct diff"
  assert:
    that:
      - cm_contact_replace is changed
      - cm_contact_replace['diff']['before']['contacts'] | length == 1
      - john_smith['key'] in cm_contact_replace['diff']['before']['contacts']
      - cm_contact_replace['diff']['after']['contacts'] | length == 1
      - jane_doe['key'] in cm_contact_replace['diff']['after']['contacts']

- name: "7 - VERIFY no-op - Only John Smith is still associated to test100"
  set_fact:
    cm_contact_replace_assocs: "{{ query('networktocode.nautobot.lookup', 'contact-associations', api_endpoint=nautobot_url, token=nautobot_token, api_filter='associated_object_id=' + test100_dev['key']) }}"

- name: "7 - ASSERT no-op - Contact replace did not persist"
  assert:
    that:
      - cm_contact_replace_assocs | selectattr('value.contact', 'defined') | selectattr('value.contact', 'ne', None) | list | length == 1
      - (cm_contact_replace_assocs | selectattr('value.contact', 'defined') | selectattr('value.contact', 'ne', None) | list)[0]['value']['contact']['id'] == john_smith['key']

##
## 8 - Check mode delete (delete John Smith contact)
##
- name: "8 - Check mode - Delete John Smith contact from test100"
  networktocode.nautobot.device:
    url: "{{ nautobot_url }}"
    token: "{{ nautobot_token }}"
    name: "test100"
    contacts:
      state: delete
      objects:
        - contact: "John Smith"
          role: "Admin"
          status: "Active"
