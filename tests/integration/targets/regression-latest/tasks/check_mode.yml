  register: cm_contact_delete
  check_mode: yes

- name: "8 - ASSERT - Check mode contact delete reports correct diff"
  assert:
    that:
      - cm_contact_delete is changed
      - cm_contact_delete['diff']['before']['contacts'] | length == 1
      - john_smith['key'] in cm_contact_delete['diff']['before']['contacts']
      - "'contacts' not in cm_contact_delete['diff']['after'] or cm_contact_delete['diff']['after']['contacts'] | length == 0"

- name: "8 - VERIFY no-op - John Smith is still associated to test100"
  set_fact:
    cm_contact_delete_assocs: "{{ query('networktocode.nautobot.lookup', 'contact-associations', api_endpoint=nautobot_url, token=nautobot_token, api_filter='associated_object_id=' + test100_dev['key']) }}"

- name: "8 - ASSERT no-op - Contact delete did not persist"
  assert:
    that:
      - cm_contact_delete_assocs | selectattr('value.contact', 'defined') | selectattr('value.contact', 'ne', None) | list | length == 1
      - (cm_contact_delete_assocs | selectattr('value.contact', 'defined') | selectattr('value.contact', 'ne', None) | list)[0]['value']['contact']['id'] == john_smith['key']

##
## 9 - Cleanup: remove the real associations added in step 2
##
- name: "9 - CLEANUP - Remove VRF, cluster, contact, and team associations from test100"
  networktocode.nautobot.device:
    url: "{{ nautobot_url }}"
    token: "{{ nautobot_token }}"
    name: "test100"
    vrfs:
      state: delete
      objects:
        - vrf: "Test VRF"
    clusters:
      state: delete
      objects:
        - cluster: "Test Cluster 2"
    contacts:
      state: delete
      objects:
        - contact: "John Smith"
          role: "Admin"
          status: "Active"
    teams:
      state: delete
      objects:
        - team: "My Test Team"
          role: "Admin"
          status: "Active"
    state: present
