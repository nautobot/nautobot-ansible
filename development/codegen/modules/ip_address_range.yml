examples: |2

  - name: Test Nautobot modules
    connection: local
    hosts: localhost
    gather_facts: false
    tasks:
      - name: Create IP address range within Nautobot with only required information
        networktocode.nautobot.ip_address_range:
          url: http://nautobot.local
          token: thisIsMyToken
          start_address: Test Start Address
          end_address: Test End Address
          status: Active
          state: present
      - name: Delete IP address range within Nautobot
        networktocode.nautobot.ip_address_range:
          url: http://nautobot.local
          token: thisIsMyToken
          start_address: Test Start Address
          end_address: Test End Address
          namespace: Test Namespace
          state: absent
      - name: Delete IP address range by id
        networktocode.nautobot.ip_address_range:
          url: http://nautobot.local
          token: thisIsMyToken
          id: 00000000-0000-0000-0000-000000000000
          state: absent
