documentation:
  module: location_type
  short_description: Creates or removes location types from Nautobot
  description:
    - Creates or removes location types from Nautobot
  notes:
    - Tags should be defined as a YAML list
    - This should be ran with connection C(local) and hosts C(localhost)
  author:
    - Joe Wesch (@joewesch)
  requirements:
    - pynautobot
  version_added: "4.3.0"
  extends_documentation_fragment:
    - networktocode.nautobot.fragments.base
    - networktocode.nautobot.fragments.id
    - networktocode.nautobot.fragments.custom_fields
    - networktocode.nautobot.fragments.contacts_and_teams
    - networktocode.nautobot.fragments.notes
examples: |2

  - name: "Test Nautobot location type module"
    connection: local
    hosts: localhost
    gather_facts: false
    tasks:
      - name: Create location type
        networktocode.nautobot.location_type:
          url: http://nautobot.local
          token: thisIsMyToken
          name: My Location Type
          state: present

      - name: Delete location type
        networktocode.nautobot.location_type:
          url: http://nautobot.local
          token: thisIsMyToken
          name: My Location Type
          state: absent

      - name: Create location type with all parameters
        networktocode.nautobot.location_type:
          url: http://nautobot.local
          token: thisIsMyToken
          name: My Nested Location Type
          description: My Nested Location Type Description
          parent:
            name: My Location Type
          nestable: false
          content_types:
            - "dcim.device"
          state: present

      - name: Delete location type by id
        networktocode.nautobot.location_type:
          url: http://nautobot.local
          token: thisIsMyToken
          id: 00000000-0000-0000-0000-000000000000
          state: absent
return: |2

  location_type:
    description: Serialized object as created or already existent within Nautobot
    returned: on creation
    type: dict
  msg:
    description: Message indicating failure or info about what has been achieved
    returned: always
    type: str
