documentation:
  module: device_bay
  short_description: Create, update or delete device bays within Nautobot
  description:
    - Creates, updates or removes device bays from Nautobot
  notes:
    - Tags should be defined as a YAML list
    - This should be ran with connection C(local) and hosts C(localhost)
  author:
    - Mikhail Yohman (@FragmentedPacket)
  version_added: "1.0.0"
  extends_documentation_fragment:
    - networktocode.nautobot.fragments.base
    - networktocode.nautobot.fragments.id
    - networktocode.nautobot.fragments.tags
    - networktocode.nautobot.fragments.custom_fields
    - networktocode.nautobot.fragments.contacts_and_teams
    - networktocode.nautobot.fragments.notes
examples: |2

  - name: "Test Nautobot modules"
    connection: local
    hosts: localhost
    gather_facts: false

    tasks:
      - name: Create device bay within Nautobot with only required information
        networktocode.nautobot.device_bay:
          url: http://nautobot.local
          token: thisIsMyToken
          device: Test Nexus One
          name: "Device Bay One"
          state: present

      - name: Add device into device bay
        networktocode.nautobot.device_bay:
          url: http://nautobot.local
          token: thisIsMyToken
          device: Test Nexus One
          name: "Device Bay One"
          description: "First child"
          installed_device: Test Nexus Child One
          state: absent

      - name: Delete device bay within nautobot
        networktocode.nautobot.device_bay:
          url: http://nautobot.local
          token: thisIsMyToken
          name: Device Bay One
          state: absent

      - name: Delete device bay by id
        networktocode.nautobot.device_bay:
          url: http://nautobot.local
          token: thisIsMyToken
          id: 00000000-0000-0000-0000-000000000000
          state: absent
return: |2

  device_bay:
    description: Serialized object as created or already existent within Nautobot
    returned: success (when I(state=present))
    type: dict
  msg:
    description: Message indicating failure or info about what has been achieved
    returned: always
    type: str
