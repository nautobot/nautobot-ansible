documentation:
  module: rear_port
  short_description: Create, update or delete rear ports within Nautobot
  description:
    - Creates, updates or removes rear ports from Nautobot
  notes:
    - Tags should be defined as a YAML list
    - This should be ran with connection C(local) and hosts C(localhost)
  author:
    - Tobias Groß (@toerb)
  version_added: "1.0.0"
  extends_documentation_fragment:
    - networktocode.nautobot.fragments.base
    - networktocode.nautobot.fragments.id
    - networktocode.nautobot.fragments.tags
    - networktocode.nautobot.fragments.custom_fields
    - networktocode.nautobot.fragments.contacts_and_teams
    - networktocode.nautobot.fragments.notes
examples: |2

  - name: "Test Nautobot modules"
    connection: local
    hosts: localhost
    gather_facts: false

    tasks:
      - name: Create rear port within Nautobot with only required information
        networktocode.nautobot.rear_port:
          url: http://nautobot.local
          token: thisIsMyToken
          name: Test Rear Port
          device: Test Device
          type: bnc
          state: present

      - name: Create rear port inside module
        networktocode.nautobot.rear_port:
          url: http://nautobot.local
          token: thisIsMyToken
          name: Test Rear Port
          module: HooverMaxProModel60
          type: bnc
          state: present

      - name: Update rear port with other fields
        networktocode.nautobot.rear_port:
          url: http://nautobot.local
          token: thisIsMyToken
          name: Test Rear Port
          device: Test Device
          type: bnc
          positions: 5
          description: rear port description
          state: present

      - name: Delete rear port within nautobot
        networktocode.nautobot.rear_port:
          url: http://nautobot.local
          token: thisIsMyToken
          name: Test Rear Port
          device: Test Device
          type: bnc
          state: absent

      - name: Delete rear port by id
        networktocode.nautobot.rear_port:
          url: http://nautobot.local
          token: thisIsMyToken
          id: 00000000-0000-0000-0000-000000000000
          state: absent
return: |2

  rear_port:
    description: Serialized object as created or already existent within Nautobot
    returned: success (when I(state=present))
    type: dict
  msg:
    description: Message indicating failure or info about what has been achieved
    returned: always
    type: str
