# Module config for the code generator. The generator reads this file and rewrites it, so keep
# comments out of it. See development/codegen/README.md.
module: cloud_service
api_path: /cloud/cloud-services/
endpoint: cloud_services
header:
  - '# Copyright: (c) 2024, Network to Code (@networktocode) <info@networktocode.com>'
  - '# GNU General Public License v3.0+ (see COPYING or https://www.gnu.org/licenses/gpl-3.0.txt)'
utils_module: cloud
class_name: NautobotCloudModule
endpoint_constant: NB_CLOUD_SERVICES
instance_var: cloud_service
instance_kwargs: {}
main_docstring: "\n    Main entry point for module execution.\n    "
shared_specs:
  - NAUTOBOT_ARG_SPEC
  - ID_ARG_SPEC
  - TAGS_ARG_SPEC
  - CUSTOM_FIELDS_ARG_SPEC
  - CONTACTS_AND_TEAMS_ARG_SPEC
  - NOTES_ARG_SPEC
ansible_module_kwargs:
  supports_check_mode: true
extra_imports: []
post_module_code: []
ignore_api_fields: {}
lookup_fields: null
generated_examples: false
options:
  name:
    api_field: name
    argument_spec:
      required: false
      type: str
    documentation:
      description:
        - The name of the cloud service
        - Required if I(state=present) and the cloud service does not exist yet
      required: false
      type: str
  description:
    api_field: description
    argument_spec:
      required: false
      type: str
    documentation:
      description:
        - The description of the cloud service
      required: false
      type: str
  cloud_resource_type:
    api_field: cloud_resource_type
    argument_spec:
      required: false
      type: raw
    documentation:
      description:
        - Required if I(state=present) and the cloud service does not exist yet
      required: false
      type: raw
  cloud_account:
    api_field: cloud_account
    argument_spec:
      required: false
      type: raw
    documentation:
      description:
        - A cloud account for this service.
      required: false
      type: raw
  extra_config:
    api_field: extra_config
    argument_spec:
      required: false
      type: dict
    documentation:
      description:
        - Arbitrary JSON data to define the extra config.
      required: false
      type: dict
  cloud_networks:
    api_field: null
    argument_spec:
      required: false
      type: dict
      options:
        state:
          required: false
          default: merge
          choices:
            - merge
            - replace
            - delete
        objects:
          required: true
          type: list
          elements: dict
          options:
            cloud_network:
              required: true
              type: raw
    documentation:
      description:
        - List of cloud networks to associate with this cloud service.
      required: false
      type: dict
      version_added: "6.2.0"
      suboptions:
        state:
          description:
            - C(merge) adds associations without removing existing ones.
            - C(replace) enforces exactly the listed associations, removing any extras.
            - C(delete) removes the listed associations.
          required: false
          type: str
          default: merge
          choices:
            - merge
            - replace
            - delete
        objects:
          description:
            - List of cloud networks to associate.
          required: true
          type: list
          elements: dict
          suboptions:
            cloud_network:
              description:
                - The cloud network to associate.
              required: true
              type: raw
documentation:
  module: cloud_service
  short_description: Creates or removes cloud service from Nautobot
  description:
    - Creates or removes cloud service from Nautobot
  notes:
    - Tags should be defined as a YAML list
    - This should be ran with connection C(local) and hosts C(localhost)
  author:
    - Travis Smith (@tsm1th)
  requirements:
    - pynautobot
  version_added: "5.4.0"
  extends_documentation_fragment:
    - networktocode.nautobot.fragments.base
    - networktocode.nautobot.fragments.id
    - networktocode.nautobot.fragments.tags
    - networktocode.nautobot.fragments.custom_fields
    - networktocode.nautobot.fragments.contacts_and_teams
    - networktocode.nautobot.fragments.notes
examples: |2

  ---
  - name: Create a cloud service
    networktocode.nautobot.cloud_service:
      url: http://nautobot.local
      token: thisIsMyToken
      name: Cisco Quantum Service
      cloud_resource_type: Cisco Quantum Type
      cloud_account: Cisco Quantum Account
      description: A quantum service for Cisco
      state: present

  - name: Create a cloud service with inline cloud network associations
    networktocode.nautobot.cloud_service:
      url: http://nautobot.local
      token: thisIsMyToken
      name: Cisco Quantum Service
      cloud_resource_type: Cisco Quantum Type
      cloud_account: Cisco Quantum Account
      cloud_networks:
        state: merge
        objects:
          - cloud_network: Cisco Quantum Network
      state: present

  - name: Delete a cloud service
    networktocode.nautobot.cloud_service:
      url: http://nautobot.local
      token: thisIsMyToken
      name: Cisco Quantum Service
      state: absent

  - name: Delete a cloud service by id
    networktocode.nautobot.cloud_service:
      url: http://nautobot.local
      token: thisIsMyToken
      id: 00000000-0000-0000-0000-000000000000
      state: absent
return: |2

  cloud_service:
    description: Serialized object as created or already existent within Nautobot
    returned: success (when I(state=present))
    type: dict
  msg:
    description: Message indicating failure or info about what has been achieved
    returned: always
    type: str
