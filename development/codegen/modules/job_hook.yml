examples: |2

  - name: Test Nautobot modules
    connection: local
    hosts: localhost
    gather_facts: false
    tasks:
      - name: Create job hook within Nautobot with only required information
        networktocode.nautobot.job_hook:
          url: http://nautobot.local
          token: thisIsMyToken
          content_types: []
          name: Test Name
          job: Test Job
          state: present
      - name: Delete job hook within Nautobot
        networktocode.nautobot.job_hook:
          url: http://nautobot.local
          token: thisIsMyToken
          name: Test Name
          state: absent
      - name: Delete job hook by id
        networktocode.nautobot.job_hook:
          url: http://nautobot.local
          token: thisIsMyToken
          id: 00000000-0000-0000-0000-000000000000
          state: absent
