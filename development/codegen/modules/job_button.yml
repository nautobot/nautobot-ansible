documentation:
  module: job_button
  short_description: Creates or removes job buttons from Nautobot
  description:
    - Creates or removes job buttons from Nautobot
  notes:
    - This should be ran with connection C(local) and hosts C(localhost)
  author:
    - Travis Smith (@tsm1th)
  requirements:
    - pynautobot
  version_added: "5.5.0"
  extends_documentation_fragment:
    - networktocode.nautobot.fragments.base
    - networktocode.nautobot.fragments.id
    - networktocode.nautobot.fragments.contacts_and_teams
    - networktocode.nautobot.fragments.notes
examples: |2

  - name: Create job button within Nautobot with only required information
    networktocode.nautobot.job_button:
      url: http://nautobot.local
      token: thisIsMyToken
      name: MyJobButton
      content_types:
        - dcim.device
      job: MyJob
      text: SubmitMe
      state: present

  - name: Delete job button within Nautobot
    networktocode.nautobot.job_button:
      url: http://nautobot.local
      token: thisIsMyToken
      name: MyJobButton
      state: absent

  - name: Delete job button by id
    networktocode.nautobot.job_button:
      url: http://nautobot.local
      token: thisIsMyToken
      id: 00000000-0000-0000-0000-000000000000
      state: absent
return: |2

  job_button:
