# Module config for the code generator. The generator reads this file and rewrites it, so keep
# comments out of it. See development/codegen/README.md.
module: tenant
api_path: /tenancy/tenants/
endpoint: tenants
header:
  - '# Copyright: (c) 2019, Amy Liebowitz (@amylieb)'
  - '# GNU General Public License v3.0+ (see COPYING or https://www.gnu.org/licenses/gpl-3.0.txt)'
utils_module: tenancy
class_name: NautobotTenancyModule
endpoint_constant: NB_TENANTS
instance_var: tenant
instance_kwargs: {}
main_docstring: "\n    Main entry point for module execution.\n    "
shared_specs:
  - NAUTOBOT_ARG_SPEC
  - ID_ARG_SPEC
  - TAGS_ARG_SPEC
  - CUSTOM_FIELDS_ARG_SPEC
  - CONTACTS_AND_TEAMS_ARG_SPEC
  - NOTES_ARG_SPEC
ansible_module_kwargs:
  supports_check_mode: true
extra_imports: []
post_module_code: []
ignore_api_fields: {}
lookup_fields: null
generated_examples: false
options:
  name:
    api_field: name
    argument_spec:
      required: false
      type: str
    documentation:
      description:
        - Name of the tenant to be created
        - Required if I(state=present) and the tenant does not exist yet
      required: false
      type: str
      version_added: "3.0.0"
  tenant_group:
    api_field: tenant_group
    argument_spec:
      required: false
      type: raw
    documentation:
      description:
        - Tenant group this tenant should be in
      required: false
      type: raw
      version_added: "3.0.0"
  description:
    api_field: description
    argument_spec:
      required: false
      type: str
    documentation:
      description:
        - The description of the tenant
      required: false
      type: str
      version_added: "3.0.0"
  comments:
    api_field: comments
    argument_spec:
      required: false
      type: str
    documentation:
      description:
        - Comments for the tenant. This can be markdown syntax
      required: false
      type: str
      version_added: "3.0.0"
documentation:
  module: tenant
  short_description: Creates or removes tenants from Nautobot
  description:
    - Creates or removes tenants from Nautobot
  notes:
    - Tags should be defined as a YAML list
    - This should be ran with connection C(local) and hosts C(localhost)
  author:
    - Amy Liebowitz (@amylieb)
  version_added: "1.0.0"
  extends_documentation_fragment:
    - networktocode.nautobot.fragments.base
    - networktocode.nautobot.fragments.id
    - networktocode.nautobot.fragments.tags
    - networktocode.nautobot.fragments.custom_fields
    - networktocode.nautobot.fragments.contacts_and_teams
    - networktocode.nautobot.fragments.notes
examples: |2

  - name: "Test Nautobot module"
    connection: local
    hosts: localhost
    gather_facts: false
    tasks:
      - name: Create tenant within Nautobot with only required information
        networktocode.nautobot.tenant:
          url: http://nautobot.local
          token: thisIsMyToken
          name: Tenant ABC
          state: present

      - name: Delete tenant within nautobot
        networktocode.nautobot.tenant:
          url: http://nautobot.local
          token: thisIsMyToken
          name: Tenant ABC
          state: absent

      - name: Create tenant with all parameters
        networktocode.nautobot.tenant:
          url: http://nautobot.local
          token: thisIsMyToken
          name: Tenant ABC
          tenant_group: Very Special Tenants
          description: ABC Incorporated
          comments: '### This tenant is super cool'
          tags:
            - tagA
            - tagB
            - tagC
          state: present

      - name: Delete tenant by id
        networktocode.nautobot.tenant:
          url: http://nautobot.local
          token: thisIsMyToken
          id: 00000000-0000-0000-0000-000000000000
          state: absent
return: |2

  tenant:
    description: Serialized object as created or already existent within Nautobot
    returned: on creation
    type: dict
  msg:
    description: Message indicating failure or info about what has been achieved
    returned: always
    type: str
