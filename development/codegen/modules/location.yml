  prefixes:
    api_field: null
    argument_spec:
      required: false
      type: dict
      options:
        state:
          required: false
          default: merge
          choices:
            - merge
            - replace
            - delete
        objects:
          required: true
          type: list
          elements: dict
          options:
            prefix:
              required: true
              type: raw
    documentation:
      description:
        - List of prefixes to associate with this location.
      required: false
      type: dict
      version_added: "6.2.0"
      suboptions:
        state:
          description:
            - C(merge) adds associations without removing existing ones.
            - C(replace) enforces exactly the listed associations, removing any extras.
            - C(delete) removes the listed associations.
          required: false
          type: str
          default: merge
          choices:
            - merge
            - replace
            - delete
        objects:
          description:
            - List of prefixes to associate.
          required: true
          type: list
          elements: dict
          suboptions:
            prefix:
              description:
