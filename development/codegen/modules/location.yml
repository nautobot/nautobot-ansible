          type: list
          elements: dict
          options:
            vlan:
              required: true
              type: raw
    documentation:
      description:
        - List of VLANs to associate with this location.
      required: false
      type: dict
      version_added: "6.2.0"
      suboptions:
        state:
          description:
            - C(merge) adds associations without removing existing ones.
            - C(replace) enforces exactly the listed associations, removing any extras.
            - C(delete) removes the listed associations.
          required: false
          type: str
          default: merge
          choices:
            - merge
            - replace
            - delete
        objects:
          description:
            - List of VLANs to associate.
          required: true
          type: list
          elements: dict
          suboptions:
            vlan:
              description:
                - The VLAN to associate with the location.
              required: true
              type: raw
documentation:
  module: location
  short_description: Creates or removes locations from Nautobot
  description:
    - Creates or removes locations from Nautobot
  notes:
    - Tags should be defined as a YAML list
    - This should be ran with connection C(local) and hosts C(localhost)
  author:
    - Joe Wesch (@joewesch)
  requirements:
    - pynautobot
  version_added: "4.3.0"
  extends_documentation_fragment:
    - networktocode.nautobot.fragments.base
    - networktocode.nautobot.fragments.tags
    - networktocode.nautobot.fragments.custom_fields
    - networktocode.nautobot.fragments.contacts_and_teams
    - networktocode.nautobot.fragments.notes
examples: |2

  - name: "Test Nautobot location module"
    connection: local
    hosts: localhost
    gather_facts: false
    tasks:
      - name: Create location
        networktocode.nautobot.location:
          url: http://nautobot.local
          token: thisIsMyToken
          name: My Location
          status: Active
          location_type:
            name: My Location Type
          state: present

      - name: Delete location
        networktocode.nautobot.location:
          url: http://nautobot.local
          token: thisIsMyToken
          id: "00000000-0000-0000-0000-000000000000"
          state: absent

      - name: Create location with all parameters
        networktocode.nautobot.location:
          url: http://nautobot.local
          token: thisIsMyToken
          name: My Nested Location
          status: Active
          location_type:
            name: My Location Type
          description: My Nested Location Description
          tenant: Test Tenant
          facility: EquinoxCA7
          asn: "65001"
          time_zone: America/Los Angeles
          physical_address: Hollywood, CA, 90210
          shipping_address: Hollywood, CA, 90210
          latitude: "10.100000"
          longitude: "12.200000"
          contact_name: Jenny
          contact_phone: 867-5309
          contact_email: jenny@example.com
          comments: "**This** is a `markdown` comment"
          parent: My Location
          notes:
            objects:
              - note: Example note text
          contacts:
            objects:
              - contact: Jane Doe
                role: User
                status: Active
              - contact:
                  name: John Smith
                role: User
                status: Active
              - contact:
                  name: John Smith, Jr.
                role: User
                status: Active
            teams:
              objects:
                - team: Network Team
                  role: Admin
                  status: Active
          state: present

      - name: Create location with inline VLAN associations
        networktocode.nautobot.location:
          url: http://nautobot.local
          token: thisIsMyToken
          name: My Location
          vlans:
            state: merge
            objects:
              - vlan: 10
          state: present

      - name: Create location with inline prefix associations
        networktocode.nautobot.location:
          url: http://nautobot.local
          token: thisIsMyToken
          name: My Location
          prefixes:
            state: merge
            objects:
              - prefix: 10.0.0.0/8
          state: present
return: |2

  location:
    description: Serialized object as created or already existent within Nautobot
    returned: on creation
    type: dict
  msg:
    description: Message indicating failure or info about what has been achieved
    returned: always
    type: str
