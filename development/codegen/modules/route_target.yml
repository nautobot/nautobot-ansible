documentation:
  module: route_target
  short_description: Creates or removes route targets from Nautobot
  description:
    - Creates or removes route targets from Nautobot
  notes:
    - Tags should be defined as a YAML list
    - This should be ran with connection C(local) and hosts C(localhost)
  author:
    - Mikhail Yohman (@FragmentedPacket)
  version_added: "1.0.0"
  extends_documentation_fragment:
    - networktocode.nautobot.fragments.base
    - networktocode.nautobot.fragments.id
    - networktocode.nautobot.fragments.tags
    - networktocode.nautobot.fragments.custom_fields
    - networktocode.nautobot.fragments.contacts_and_teams
    - networktocode.nautobot.fragments.notes
examples: |2

  - name: "Test route target creation/deletion"
    connection: local
    hosts: localhost
    gather_facts: false
    tasks:
      - name: Create Route Targets
        networktocode.nautobot.route_target:
          url: http://nautobot.local
          token: thisIsMyToken
          name: "{{ item.name }}"
          tenant: "Test Tenant"
          tags:
            - Schnozzberry
        loop:
          - { name: "65000:65001", description: "management" }
          - { name: "65000:65002", description: "tunnel" }

      - name: Update Description on Route Targets
        networktocode.nautobot.route_target:
          url: http://nautobot.local
          token: thisIsMyToken
          name: "{{ item.name }}"
          tenant: "Test Tenant"
          description: "{{ item.description }}"
          tags:
            - Schnozzberry
        loop:
          - { name: "65000:65001", description: "management" }
          - { name: "65000:65002", description: "tunnel" }

      - name: Delete Route Targets
        networktocode.nautobot.route_target:
          url: http://nautobot.local
          token: thisIsMyToken
          name: "{{ item }}"
          state: absent
        loop:
          - "65000:65001"
          - "65000:65002"

      - name: Delete Route Target by id
        networktocode.nautobot.route_target:
          url: http://nautobot.local
          token: thisIsMyToken
          id: 00000000-0000-0000-0000-000000000000
          state: absent
return: |2

  route_target:
    description: Serialized object as created/existent/updated/deleted within Nautobot
    returned: always
    type: dict
  msg:
    description: Message indicating failure or info about what has been achieved
    returned: always
    type: str
