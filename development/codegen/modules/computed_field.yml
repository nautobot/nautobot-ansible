# Module config for the code generator. The generator reads this file and rewrites it, so keep
# comments out of it. See development/codegen/README.md.
module: computed_field
api_path: /extras/computed-fields/
endpoint: computed_fields
header:
  - '# Copyright: (c) 2026, Network to Code (@networktocode) <info@networktocode.com>'
  - '# GNU General Public License v3.0+ (see COPYING or https://www.gnu.org/licenses/gpl-3.0.txt)'
utils_module: extras
class_name: NautobotExtrasModule
endpoint_constant: null
instance_var: computed_field
instance_kwargs: {}
main_docstring: "\n    Main entry point for module execution.\n    "
shared_specs:
  - NAUTOBOT_ARG_SPEC
  - ID_ARG_SPEC
  - CONTACTS_AND_TEAMS_ARG_SPEC
  - NOTES_ARG_SPEC
ansible_module_kwargs:
  supports_check_mode: true
extra_imports: []
post_module_code: []
ignore_api_fields: {}
generated_examples: true
options:
  content_type:
    api_field: content_type
    managed: true
    argument_spec:
      required: false
      type: str
    documentation:
      description:
        - The content type of the computed field
        - Required if I(state=present) and the computed field does not exist yet
      required: false
      type: str
  key:
    api_field: key
    managed: true
    argument_spec:
      required: false
      type: str
      no_log: false
    documentation:
      description:
        - Internal field name. Please use underscores rather than dashes in this key.
      required: false
      type: str
  output_type:
    api_field: output_type
    managed: true
    argument_spec:
      required: false
      type: str
      choices: &id001
        - text
        - markdown
    documentation:
      description:
        - How the rendered result is to be output, by default it is as Plain Text
      required: false
      type: str
      choices: *id001
  grouping:
    api_field: grouping
    managed: true
    argument_spec:
      required: false
      type: str
    documentation:
      description:
        - Human-readable grouping that this computed field belongs to.
      required: false
      type: str
  label:
    api_field: label
    managed: true
    argument_spec:
      required: false
      type: str
    documentation:
      description:
        - Name of the field as displayed to users
        - Required if I(state=present) and the computed field does not exist yet
      required: false
      type: str
  description:
    api_field: description
    managed: true
    argument_spec:
      required: false
      type: str
    documentation:
      description:
        - The description of the computed field
      required: false
      type: str
  template:
    api_field: template
    managed: true
    argument_spec:
      required: false
      type: str
    documentation:
      description:
        - Jinja2 template code for field value
        - Required if I(state=present) and the computed field does not exist yet
      required: false
      type: str
  fallback_value:
    api_field: fallback_value
    managed: true
    argument_spec:
      required: false
      type: str
    documentation:
      description:
        - Fallback value (if any) to be output for the field in the case of a template rendering error.
      required: false
      type: str
  weight:
    api_field: weight
    managed: true
    argument_spec:
      required: false
      type: int
    documentation:
      description:
        - The weight of the computed field
      required: false
      type: int
  advanced_ui:
    api_field: advanced_ui
    managed: true
    argument_spec:
      required: false
      type: bool
    documentation:
      description:
        - Hide this field from the object's primary information tab. It will appear in the "Advanced" tab instead.
      required: false
      type: bool
documentation:
  module: computed_field
  short_description: Create, update or delete computed fields within Nautobot
  description:
    - Creates, updates or removes computed fields from Nautobot.
  notes:
    - This should be ran with connection C(local) and hosts C(localhost)
  author:
    - Network to Code (@networktocode)
  version_added: "6.4.0"
  extends_documentation_fragment:
    - networktocode.nautobot.fragments.base
    - networktocode.nautobot.fragments.id
    - networktocode.nautobot.fragments.contacts_and_teams
    - networktocode.nautobot.fragments.notes
examples: |2

  - name: Test Nautobot modules
    connection: local
    hosts: localhost
    gather_facts: false
    tasks:
      - name: Create computed field within Nautobot with only required information
        networktocode.nautobot.computed_field:
          url: http://nautobot.local
          token: thisIsMyToken
          content_type: dcim.device
          label: Test Label
          template: Test Template
          state: present
      - name: Delete computed field within Nautobot
        networktocode.nautobot.computed_field:
          url: http://nautobot.local
          token: thisIsMyToken
          key: Test Key
          state: absent
      - name: Delete computed field by id
        networktocode.nautobot.computed_field:
          url: http://nautobot.local
          token: thisIsMyToken
          id: 00000000-0000-0000-0000-000000000000
          state: absent
return: |2

  computed_field:
    description: Serialized object as created or already existent within Nautobot
    returned: success (when I(state=present))
    type: dict
  msg:
    description: Message indicating failure or info about what has been achieved
    returned: always
    type: str
lookup_fields:
  - key
