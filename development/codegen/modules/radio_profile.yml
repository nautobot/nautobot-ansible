examples: |2

  ---
  - name: Create a radio profile with required fields
    networktocode.nautobot.radio_profile:
      url: http://nautobot.local
      token: thisIsMyToken
      name: "My Radio Profile"
      regulatory_domain: "US"
      state: present

  - name: Create a radio profile with all fields
    networktocode.nautobot.radio_profile:
      url: http://nautobot.local
      token: thisIsMyToken
      name: "My Radio Profile"
      regulatory_domain: "US"
      channel_width: 20
      allowed_channel_list:
        - 1
        - 6
        - 11
      frequency: "2.4GHz"
      tx_power_min: 10
      tx_power_max: 20
      rx_power_min: 10
      supported_data_rates:
        - standard: "802.11a"
          rate: 1000000
          mcs_index: 10
      state: present

  - name: Delete a radio profile
    networktocode.nautobot.radio_profile:
      url: http://nautobot.local
      token: thisIsMyToken
      name: "My Radio Profile"
      state: absent

  - name: Delete a radio profile by id
    networktocode.nautobot.radio_profile:
      url: http://nautobot.local
      token: thisIsMyToken
      id: 00000000-0000-0000-0000-000000000000
      state: absent
return: |2

