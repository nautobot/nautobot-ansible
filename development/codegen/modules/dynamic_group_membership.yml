examples: |2

  - name: Test Nautobot modules
    connection: local
    hosts: localhost
    gather_facts: false
    tasks:
      - name: Create dynamic group membership within Nautobot with only required information
        networktocode.nautobot.dynamic_group_membership:
          url: http://nautobot.local
          token: thisIsMyToken
          operator: union
          weight: 1
          dynamic_group: Test Group
          parent_group: Test Parent Group
          state: present
      - name: Delete dynamic group membership within Nautobot
        networktocode.nautobot.dynamic_group_membership:
          url: http://nautobot.local
          token: thisIsMyToken
          dynamic_group: Test Group
          parent_group: Test Parent Group
          operator: union
          weight: 1
          state: absent
      - name: Delete dynamic group membership by id
        networktocode.nautobot.dynamic_group_membership:
          url: http://nautobot.local
          token: thisIsMyToken
          id: 00000000-0000-0000-0000-000000000000
          state: absent
