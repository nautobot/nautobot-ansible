# Module config for the code generator. The generator reads this file and rewrites it, so keep
# comments out of it. See development/codegen/README.md.
module: module_type
api_path: /dcim/module-types/
endpoint: module_types
header:
  - '# Copyright: (c) 2024, Network to Code (@networktocode) <info@networktocode.com>'
  - '# GNU General Public License v3.0+ (see COPYING or https://www.gnu.org/licenses/gpl-3.0.txt)'
utils_module: dcim
class_name: NautobotDcimModule
endpoint_constant: NB_MODULE_TYPES
instance_var: module_type
instance_kwargs: {}
main_docstring: "\n    Main entry point for module execution.\n    "
shared_specs:
  - NAUTOBOT_ARG_SPEC
  - ID_ARG_SPEC
  - TAGS_ARG_SPEC
  - CUSTOM_FIELDS_ARG_SPEC
  - CONTACTS_AND_TEAMS_ARG_SPEC
  - NOTES_ARG_SPEC
ansible_module_kwargs:
  supports_check_mode: true
extra_imports: []
post_module_code: []
ignore_api_fields: {}
lookup_fields: null
generated_examples: false
options:
  manufacturer:
    api_field: manufacturer
    argument_spec:
      required: false
      type: raw
    documentation:
      description:
        - The manufacturer of the module type
        - Required if I(state=present) and the module type does not exist yet
      required: false
      type: raw
  model:
    api_field: model
    argument_spec:
      required: false
      type: raw
    documentation:
      description:
        - The model of the module type
        - Required if I(state=present) and the module type does not exist yet
      required: false
      type: raw
  part_number:
    api_field: part_number
    argument_spec:
      required: false
      type: str
    documentation:
      description:
        - The part number of the module type
      required: false
      type: str
  comments:
    api_field: comments
    argument_spec:
      required: false
      type: str
    documentation:
      description:
        - Comments that may include additional information in regards to the module type
      required: false
      type: str
  module_family:
    api_field: module_family
    managed: true
    argument_spec:
      required: false
      type: raw
    documentation:
      description:
        - The module family of the module type
      required: false
      type: raw
      version_added: "6.4.0"
documentation:
  module: module_type
  short_description: Create, update or delete module types within Nautobot
  description:
    - Creates, updates or removes module types from Nautobot
  notes:
    - Tags should be defined as a YAML list
    - This should be ran with connection C(local) and hosts C(localhost)
  author:
    - Travis Smith (@tsm1th)
  version_added: "5.4.0"
  extends_documentation_fragment:
    - networktocode.nautobot.fragments.base
    - networktocode.nautobot.fragments.id
    - networktocode.nautobot.fragments.tags
    - networktocode.nautobot.fragments.custom_fields
    - networktocode.nautobot.fragments.contacts_and_teams
    - networktocode.nautobot.fragments.notes
examples: |2

  - name: Create a module type
    networktocode.nautobot.module_type:
      url: http://nautobot.local
      token: thisIsMyToken
      model: HooverMaxProModel60
      manufacturer: Best Quality Vacuum
      state: present

  - name: Delete a module type
    networktocode.nautobot.module_type:
      url: http://nautobot.local
      token: thisIsMyToken
      model: HooverMaxProModel60
      state: absent

  - name: Delete a module type by id
    networktocode.nautobot.module_type:
      url: http://nautobot.local
      token: thisIsMyToken
      id: 00000000-0000-0000-0000-000000000000
      state: absent
return: |2

  module_type:
    description: Serialized object as created or already existent within Nautobot
    returned: success (when I(state=present))
    type: dict
  msg:
    description: Message indicating failure or info about what has been achieved
    returned: always
    type: str
