  module: git_repository
  short_description: Create, update or delete git repositories within Nautobot
  description:
    - Creates, updates or removes git repositories from Nautobot.
  notes:
    - Tags should be defined as a YAML list
    - This should be ran with connection C(local) and hosts C(localhost)
  author:
    - Network to Code (@networktocode)
  version_added: "6.4.0"
