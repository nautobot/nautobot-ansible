    - networktocode.nautobot.fragments.notes
examples: |2

  - name: Test Nautobot modules
    connection: local
    hosts: localhost
    gather_facts: false
    tasks:
      - name: Create Git repository within Nautobot with only required information
        networktocode.nautobot.git_repository:
          url: http://nautobot.local
          token: thisIsMyToken
          name: Test Name
          remote_url: Test Remote Url
          state: present
      - name: Delete Git repository within Nautobot
        networktocode.nautobot.git_repository:
          url: http://nautobot.local
          token: thisIsMyToken
          name: Test Name
          state: absent
      - name: Delete Git repository by id
        networktocode.nautobot.git_repository:
          url: http://nautobot.local
          token: thisIsMyToken
          id: 00000000-0000-0000-0000-000000000000
          state: absent
return: |2

  git_repository:
