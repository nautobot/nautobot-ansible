          required: false
          default: merge
          choices:
            - merge
            - replace
            - delete
        objects:
          required: true
          type: list
          elements: dict
          options:
            ip_address:
              required: true
              type: raw
            is_source:
              required: false
              type: bool
            is_destination:
              required: false
              type: bool
            is_default:
              required: false
              type: bool
            is_preferred:
              required: false
              type: bool
            is_primary:
              required: false
              type: bool
            is_secondary:
              required: false
              type: bool
            is_standby:
              required: false
              type: bool
    documentation:
      description:
        - List of IP addresses to associate with this VM interface.
      required: false
      type: dict
      version_added: "6.2.0"
      suboptions:
        state:
          description:
            - C(merge) adds associations without removing existing ones.
            - C(replace) enforces exactly the listed associations, removing any extras.
            - C(delete) removes the listed associations.
          required: false
          type: str
          default: merge
          choices:
            - merge
            - replace
            - delete
        objects:
          description:
            - List of IP addresses to associate.
          required: true
          type: list
          elements: dict
          suboptions:
            ip_address:
              description:
                - The IP address to associate with the VM interface.
              required: true
              type: raw
            is_source:
              description:
                - Mark the IP address as a source IP address.
              required: false
              type: bool
            is_destination:
              description:
                - Mark the IP address as a destination IP address.
              required: false
              type: bool
            is_default:
              description:
                - Mark the IP address as a default IP address.
              required: false
              type: bool
            is_preferred:
              description:
                - Mark the IP address as a preferred IP address.
              required: false
              type: bool
            is_primary:
              description:
                - Mark the IP address as a primary IP address.
              required: false
              type: bool
            is_secondary:
              description:
                - Mark the IP address as a secondary IP address.
              required: false
              type: bool
            is_standby:
              description:
                - Mark the IP address as a standby IP address.
              required: false
              type: bool
documentation:
  module: vm_interface
  short_description: Creates or removes interfaces from virtual machines in Nautobot
  description:
    - Creates or removes interfaces from virtual machines in Nautobot
  notes:
    - Tags should be defined as a YAML list
    - This should be ran with connection C(local) and hosts C(localhost)
  author:
    - Benjamin Vergnaud (@bvergnaud)
  version_added: "1.0.0"
  extends_documentation_fragment:
    - networktocode.nautobot.fragments.base
    - networktocode.nautobot.fragments.id
    - networktocode.nautobot.fragments.tags
    - networktocode.nautobot.fragments.custom_fields
    - networktocode.nautobot.fragments.contacts_and_teams
    - networktocode.nautobot.fragments.notes
examples: |2

  - name: "Test Nautobot interface module"
    connection: local
    hosts: localhost
    gather_facts: false
    tasks:
      - name: Create interface within Nautobot with only required information
        networktocode.nautobot.vm_interface:
          url: http://nautobot.local
          token: thisIsMyToken
          virtual_machine: test100
          name: GigabitEthernet1
          state: present

      - name: Delete interface within nautobot
        networktocode.nautobot.vm_interface:
          url: http://nautobot.local
          token: thisIsMyToken
          virtual_machine: test100
          name: GigabitEthernet1
          state: absent

      - name: Create interface as a trunk port
        networktocode.nautobot.vm_interface:
          url: http://nautobot.local
          token: thisIsMyToken
          virtual_machine: test100
          name: GigabitEthernet25
          enabled: false
          untagged_vlan:
            name: Wireless
            location: "{{ test_location['key'] }}"
          tagged_vlans:
            - name: Data
              location: "{{ test_location['key'] }}"
            - name: VoIP
              location: "{{ test_location['key'] }}"
          mtu: 1600
          role: Server
          mode: Tagged
          state: present

      - name: |
          Create an interface and update custom_field data point,
          setting the value to True
        networktocode.nautobot.vm_interface:
          url: http://nautobot.local
          token: thisIsMyToken
          virtual_machine: test100
          name: GigabitEthernet26
          enabled: false
          custom_fields:
            monitored: true

      - name: Create interface with inline IP address associations
        networktocode.nautobot.vm_interface:
          url: http://nautobot.local
          token: thisIsMyToken
          virtual_machine: test100
          name: GigabitEthernet27
          ip_addresses:
            state: merge
            objects:
              - ip_address: 192.168.1.1/24
                is_source: true
              - ip_address: 192.168.1.2/24
                is_destination: true
              - ip_address: 192.168.1.3/24
                is_default: true
          state: present

      - name: Delete interface by id
        networktocode.nautobot.vm_interface:
          url: http://nautobot.local
          token: thisIsMyToken
          id: 00000000-0000-0000-0000-000000000000
          state: absent
return: |2

  interface:
    description: Serialized object as created or already existent within Nautobot
    returned: on creation
    type: dict
  msg:
    description: Message indicating failure or info about what has been achieved
    returned: always
    type: str
