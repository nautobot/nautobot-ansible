        - Required if I(state=present) and the interface does not exist yet
      required: false
      type: raw
      version_added: "3.0.0"
  name:
    api_field: name
    argument_spec:
      required: false
      type: str
    documentation:
      description:
        - Name of the interface to be created
        - Required if I(state=present) and the interface does not exist yet
      required: false
      type: str
      version_added: "3.0.0"
  enabled:
    api_field: enabled
    argument_spec:
      required: false
