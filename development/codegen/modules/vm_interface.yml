      required: false
      type: str
      version_added: "3.0.0"
  description:
    api_field: description
    argument_spec:
      required: false
      type: str
    documentation:
      description:
        - The description of the interface
      required: false
      type: str
      version_added: "3.0.0"
  status:
    api_field: status
    argument_spec:
      required: false
      type: raw
    documentation:
      description:
        - The status of the interface.
        - Required if I(state=present) and does not exist yet
      required: false
      type: raw
      version_added: "3.0.0"
  mode:
    api_field: mode
    argument_spec:
      required: false
      type: raw
    documentation:
      description:
        - The mode of the interface
      required: false
      type: raw
      version_added: "3.0.0"
  untagged_vlan:
    api_field: untagged_vlan
    argument_spec:
      required: false
      type: raw
    documentation:
      description:
        - The untagged VLAN to be assigned to interface
      required: false
      type: raw
      version_added: "3.0.0"
  tagged_vlans:
    api_field: tagged_vlans
    argument_spec:
      required: false
      type: raw
    documentation:
      description:
        - A list of tagged VLANS to be assigned to interface. Mode must be set to either C(Tagged) or C(Tagged All)
      required: false
