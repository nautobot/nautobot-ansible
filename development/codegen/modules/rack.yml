documentation:
  module: rack
  short_description: Create, update or delete racks within Nautobot
  description:
    - Creates, updates or removes racks from Nautobot.
  notes:
    - Tags should be defined as a YAML list.
    - This should be ran with connection C(local) and hosts C(localhost).
    - The module supports C(check_mode).
  author:
    - NMikhail Yohman (@FragmentedPacket)
  version_added: "1.0.0"
  extends_documentation_fragment:
    - networktocode.nautobot.fragments.base
    - networktocode.nautobot.fragments.id
    - networktocode.nautobot.fragments.tags
    - networktocode.nautobot.fragments.custom_fields
    - networktocode.nautobot.fragments.contacts_and_teams
    - networktocode.nautobot.fragments.notes
examples: |2

  - name: "Test Nautobot modules"
    connection: local
    hosts: localhost
    gather_facts: false

    tasks:
      - name: Create rack within Nautobot with only required information
        networktocode.nautobot.rack:
          url: http://nautobot.local
          token: thisIsMyToken
          name: Test rack
          location:
            name: My Location
            parent: Parent Location
          status: active
          state: present

      - name: Create rack with contacts
        networktocode.nautobot.rack:
          url: http://nautobot.local
          token: thisIsMyToken
          name: Test Rack with Contacts
          location:
            name: My Location
            parent: Parent Location
          status: active
          notes:
            objects:
              - note: Example note text
          contacts:
            objects:
              - contact: Jane Doe
                role: User
                status: Active
              - contact:
                  name: John Smith
                role: User
                status: Active
              - contact:
                  name: John Smith, Jr.
                role: User
                status: Active
            teams:
              objects:
                - team: Network Team
                  role: Admin
                  status: Active
          state: present

      - name: Delete rack within nautobot
        networktocode.nautobot.rack:
          url: http://nautobot.local
          token: thisIsMyToken
          name: Test Rack
          state: absent

      - name: Delete rack by id
        networktocode.nautobot.rack:
          url: http://nautobot.local
          token: thisIsMyToken
          id: 00000000-0000-0000-0000-000000000000
          state: absent
return: |2

  rack:
    description: Serialized object as created or already existent within Nautobot.
    returned: success (when I(state=present))
    type: dict
  msg:
    description: Message indicating failure or info about what has been achieved.
    returned: always
    type: str
