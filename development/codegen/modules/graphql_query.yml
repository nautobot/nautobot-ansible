documentation:
  module: graphql_query
  short_description: Create, update or delete graphql queries within Nautobot
  description:
    - Creates, updates or removes graphql queries from Nautobot.
  notes:
    - This should be ran with connection C(local) and hosts C(localhost)
  author:
    - Network to Code (@networktocode)
  version_added: "6.4.0"
  extends_documentation_fragment:
    - networktocode.nautobot.fragments.base
    - networktocode.nautobot.fragments.id
    - networktocode.nautobot.fragments.contacts_and_teams
    - networktocode.nautobot.fragments.notes
examples: |2

  - name: Test Nautobot modules
    connection: local
    hosts: localhost
    gather_facts: false
    tasks:
      - name: Create GraphQL query within Nautobot with only required information
        networktocode.nautobot.graphql_query:
          url: http://nautobot.local
          token: thisIsMyToken
          name: Test Name
          query: Test Query
          state: present
      - name: Delete GraphQL query within Nautobot
        networktocode.nautobot.graphql_query:
          url: http://nautobot.local
          token: thisIsMyToken
          name: Test Name
          state: absent
      - name: Delete GraphQL query by id
        networktocode.nautobot.graphql_query:
          url: http://nautobot.local
          token: thisIsMyToken
          id: 00000000-0000-0000-0000-000000000000
          state: absent
return: |2

  graphql_query:
    description: Serialized object as created or already existent within Nautobot
    returned: success (when I(state=present))
    type: dict
  msg:
    description: Message indicating failure or info about what has been achieved
    returned: always
    type: str
lookup_fields:
