documentation:
  module: webhook
  short_description: Create, update or delete webhooks within Nautobot
  description:
    - Creates, updates or removes webhooks from Nautobot.
  notes:
    - This should be ran with connection C(local) and hosts C(localhost)
  author:
    - Network to Code (@networktocode)
  version_added: "6.4.0"
  extends_documentation_fragment:
    - networktocode.nautobot.fragments.base
    - networktocode.nautobot.fragments.id
    - networktocode.nautobot.fragments.contacts_and_teams
    - networktocode.nautobot.fragments.notes
examples: |2

  - name: Test Nautobot modules
    connection: local
    hosts: localhost
    gather_facts: false
    tasks:
      - name: Create webhook within Nautobot with only required information
        networktocode.nautobot.webhook:
          url: http://nautobot.local
          token: thisIsMyToken
          content_types: []
          name: Test Name
          payload_url: Test Payload Url
          state: present
      - name: Delete webhook within Nautobot
        networktocode.nautobot.webhook:
          url: http://nautobot.local
          token: thisIsMyToken
          name: Test Name
          state: absent
      - name: Delete webhook by id
        networktocode.nautobot.webhook:
          url: http://nautobot.local
          token: thisIsMyToken
          id: 00000000-0000-0000-0000-000000000000
          state: absent
return: |2

  webhook:
    description: Serialized object as created or already existent within Nautobot
    returned: success (when I(state=present))
    type: dict
  msg:
    description: Message indicating failure or info about what has been achieved
    returned: always
