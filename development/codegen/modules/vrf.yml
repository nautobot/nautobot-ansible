documentation:
  module: vrf
  short_description: Create, update or delete vrfs within Nautobot
  description:
    - Creates, updates or removes vrfs from Nautobot
  notes:
    - Tags should be defined as a YAML list
    - This should be ran with connection C(local) and hosts C(localhost)
  author:
    - Mikhail Yohman (@FragmentedPacket)
  version_added: "1.0.0"
  extends_documentation_fragment:
    - networktocode.nautobot.fragments.base
    - networktocode.nautobot.fragments.id
    - networktocode.nautobot.fragments.tags
    - networktocode.nautobot.fragments.custom_fields
    - networktocode.nautobot.fragments.contacts_and_teams
    - networktocode.nautobot.fragments.notes
examples: |2

  - name: "Test Nautobot modules"
    connection: local
    hosts: localhost
    gather_facts: false

    tasks:
      - name: Create vrf within Nautobot with only required information
        networktocode.nautobot.vrf:
          url: http://nautobot.local
          token: thisIsMyToken
          name: Test VRF
          state: present
          rd: "65000:1"

      - name: Delete vrf within nautobot
        networktocode.nautobot.vrf:
          url: http://nautobot.local
          token: thisIsMyToken
          name: Test VRF
          state: absent
          rd: "65000:1"

      - name: Create vrf with all information
        networktocode.nautobot.vrf:
          url: http://nautobot.local
          token: thisIsMyToken
          name: Test VRF
          rd: "65000:1"
          tenant: Test Tenant
          import_targets:
            - "65000:65001"
          export_targets:
            - "65000:65001"
          description: VRF description
          tags:
            - Schnozzberry
          state: present

      - name: Delete vrf by id
        networktocode.nautobot.vrf:
          url: http://nautobot.local
          token: thisIsMyToken
          id: 00000000-0000-0000-0000-000000000000
          state: absent
return: |2

  vrf:
    description: Serialized object as created or already existent within Nautobot
    returned: success (when I(state=present))
    type: dict
  msg:
    description: Message indicating failure or info about what has been achieved
    returned: always
    type: str
