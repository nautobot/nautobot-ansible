# Module config for the code generator. The generator reads this file and rewrites it, so keep
# comments out of it. See development/codegen/README.md.
module: circuit
api_path: /circuits/circuits/
endpoint: circuits
header:
  - '# Copyright: (c) 2019, Mikhail Yohman (@FragmentedPacket) <mikhail.yohman@gmail.com>'
  - '# GNU General Public License v3.0+ (see COPYING or https://www.gnu.org/licenses/gpl-3.0.txt)'
utils_module: circuits
class_name: NautobotCircuitsModule
endpoint_constant: NB_CIRCUITS
instance_var: circuit
instance_kwargs: {}
main_docstring: "\n    Main entry point for module execution.\n    "
shared_specs:
  - NAUTOBOT_ARG_SPEC
  - ID_ARG_SPEC
  - TAGS_ARG_SPEC
  - CUSTOM_FIELDS_ARG_SPEC
  - CONTACTS_AND_TEAMS_ARG_SPEC
  - NOTES_ARG_SPEC
ansible_module_kwargs:
  supports_check_mode: true
extra_imports: []
post_module_code: []
ignore_api_fields: {}
lookup_fields: null
generated_examples: false
options:
  cid:
    api_field: cid
    argument_spec:
      required: false
      type: str
    documentation:
      description:
        - The circuit id of the circuit
        - Required if I(state=present) and the circuit does not exist yet
      required: false
      type: str
      version_added: "3.0.0"
  circuit_provider:
    api_field: provider
    argument_spec:
      required: false
      type: raw
      aliases:
        - provider
    documentation:
      aliases:
        - provider
      description:
        - The provider of the circuit
      required: false
      type: raw
      version_added: "3.0.0"
  circuit_type:
    api_field: circuit_type
    argument_spec:
      required: false
      type: raw
    documentation:
      description:
        - The circuit type of the circuit
      required: false
      type: raw
      version_added: "3.0.0"
  status:
    api_field: status
    argument_spec:
      required: false
      type: raw
    documentation:
      description:
        - The status of the circuit
        - Required if I(state=present) and does not exist yet
      required: false
      type: raw
      version_added: "3.0.0"
  tenant:
    api_field: tenant
    argument_spec:
      required: false
      type: raw
    documentation:
      description:
        - The tenant assigned to the circuit
      required: false
      type: raw
      version_added: "3.0.0"
  install_date:
    api_field: install_date
    argument_spec:
      required: false
      type: str
    documentation:
      description:
        - The date the circuit was installed. e.g. YYYY-MM-DD
      required: false
      type: str
      version_added: "3.0.0"
  commit_rate:
    api_field: commit_rate
    argument_spec:
      required: false
      type: int
    documentation:
      description:
        - Commit rate of the circuit (Kbps)
      required: false
      type: int
      version_added: "3.0.0"
  description:
    api_field: description
    argument_spec:
      required: false
      type: str
    documentation:
      description:
        - Description of the circuit
      required: false
      type: str
      version_added: "3.0.0"
  comments:
    api_field: comments
    argument_spec:
      required: false
      type: str
    documentation:
      description:
        - Comments related to circuit
      required: false
      type: str
      version_added: "3.0.0"
documentation:
  module: circuit
  short_description: Create, update or delete circuits within Nautobot
  description:
    - Creates, updates or removes circuits from Nautobot
  notes:
    - Tags should be defined as a YAML list
    - This should be ran with connection C(local) and hosts C(localhost)
  author:
    - Mikhail Yohman (@FragmentedPacket)
  version_added: "1.0.0"
  extends_documentation_fragment:
    - networktocode.nautobot.fragments.base
    - networktocode.nautobot.fragments.id
    - networktocode.nautobot.fragments.tags
    - networktocode.nautobot.fragments.custom_fields
    - networktocode.nautobot.fragments.contacts_and_teams
    - networktocode.nautobot.fragments.notes
examples: |2

  - name: "Test Nautobot modules"
    connection: local
    hosts: localhost
    gather_facts: false

    tasks:
      - name: Create circuit within Nautobot with only required information
        networktocode.nautobot.circuit:
          url: http://nautobot.local
          token: thisIsMyToken
          cid: Test Circuit
          provider: Test Provider
          circuit_type: Test Circuit Type
          status: active
          state: present

      - name: Update circuit with other fields
        networktocode.nautobot.circuit:
          url: http://nautobot.local
          token: thisIsMyToken
          cid: Test-Circuit-1000
          provider: Test Provider
          circuit_type: Test Circuit Type
          status: Active
          tenant: Test Tenant
          install_date: "2018-12-25"
          commit_rate: 10000
          description: Test circuit
          comments: "FAST CIRCUIT"
          notes:
            objects:
              - note: Example note text
          contacts:
            objects:
              - contact: Jane Doe
                role: User
                status: Active
              - contact:
                  name: John Smith
                role: User
                status: Active
              - contact:
                  name: John Smith, Jr.
                role: User
                status: Active
            teams:
              objects:
                - team: Network Team
                  role: Admin
                  status: Active
          state: present

      - name: Delete circuit within nautobot
        networktocode.nautobot.circuit:
          url: http://nautobot.local
          token: thisIsMyToken
          cid: Test-Circuit-1000
          state: absent

      - name: Delete circuit by id
        networktocode.nautobot.circuit:
          url: http://nautobot.local
          token: thisIsMyToken
          id: 00000000-0000-0000-0000-000000000000
          state: absent
return: |2

  circuit:
    description: Serialized object as created or already existent within Nautobot
    returned: success (when I(state=present))
    type: dict
  msg:
    description: Message indicating failure or info about what has been achieved
    returned: always
    type: str
