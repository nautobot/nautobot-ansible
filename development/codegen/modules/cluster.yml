documentation:
  module: cluster
  short_description: Create, update or delete clusters within Nautobot
  description:
    - Creates, updates or removes clusters from Nautobot
  notes:
    - Tags should be defined as a YAML list
    - This should be ran with connection C(local) and hosts C(localhost)
  author:
    - Gaelle MANGIN (@gmangin)
  version_added: "1.0.0"
  extends_documentation_fragment:
    - networktocode.nautobot.fragments.base
    - networktocode.nautobot.fragments.id
    - networktocode.nautobot.fragments.tags
    - networktocode.nautobot.fragments.custom_fields
    - networktocode.nautobot.fragments.contacts_and_teams
    - networktocode.nautobot.fragments.notes
examples: |2

  - name: "Test Nautobot modules"
    connection: local
    hosts: localhost
    gather_facts: false

    tasks:
      - name: Create cluster within Nautobot with only required information
        networktocode.nautobot.cluster:
          url: http://nautobot.local
          token: thisIsMyToken
          name: Test Cluster
          cluster_type: libvirt
          state: present

      - name: Delete cluster within nautobot
        networktocode.nautobot.cluster:
          url: http://nautobot.local
          token: thisIsMyToken
          name: Test Cluster
          state: absent

      - name: Create cluster with tags
        networktocode.nautobot.cluster:
          url: http://nautobot.local
          token: thisIsMyToken
          name: Another Test Cluster
          cluster_type: libvirt
          tags:
            - Schnozzberry
          state: present

      - name: Update the group and location of an existing cluster
        networktocode.nautobot.cluster:
          url: http://nautobot.local
          token: thisIsMyToken
          name: Test Cluster
          cluster_type: qemu
          cluster_group: GROUP
          location:
            name: My Location
            parent: Parent Location
          state: present

      - name: Delete cluster by id
        networktocode.nautobot.cluster:
          url: http://nautobot.local
          token: thisIsMyToken
          id: 00000000-0000-0000-0000-000000000000
          state: absent
return: |2

  cluster:
    description: Serialized object as created or already existent within Nautobot
    returned: success (when I(state=present))
    type: dict
  msg:
    description: Message indicating failure or info about what has been achieved
    returned: always
    type: str
