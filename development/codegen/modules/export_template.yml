documentation:
  module: export_template
  short_description: Create, update or delete export templates within Nautobot
  description:
    - Creates, updates or removes export templates from Nautobot.
  notes:
    - This should be ran with connection C(local) and hosts C(localhost)
  author:
    - Network to Code (@networktocode)
  version_added: "6.4.0"
  extends_documentation_fragment:
    - networktocode.nautobot.fragments.base
    - networktocode.nautobot.fragments.id
    - networktocode.nautobot.fragments.contacts_and_teams
    - networktocode.nautobot.fragments.notes
examples: |2

  - name: Test Nautobot modules
    connection: local
    hosts: localhost
    gather_facts: false
    tasks:
      - name: Create export template within Nautobot with only required information
        networktocode.nautobot.export_template:
          url: http://nautobot.local
          token: thisIsMyToken
          content_type: dcim.device
          name: Test Name
          template_code: Test Template Code
          state: present
      - name: Delete export template within Nautobot
        networktocode.nautobot.export_template:
          url: http://nautobot.local
          token: thisIsMyToken
          content_type: dcim.device
          name: Test Name
          state: absent
      - name: Delete export template by id
        networktocode.nautobot.export_template:
          url: http://nautobot.local
          token: thisIsMyToken
          id: 00000000-0000-0000-0000-000000000000
          state: absent
return: |2

  export_template:
    description: Serialized object as created or already existent within Nautobot
    returned: success (when I(state=present))
    type: dict
  msg:
