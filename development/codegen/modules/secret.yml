# Module config for the code generator. The generator reads this file and rewrites it, so keep
# comments out of it. See development/codegen/README.md.
module: secret
api_path: /extras/secrets/
endpoint: secrets
header:
  - '# Copyright: (c) 2025, Network to Code (@networktocode) <info@networktocode.com>'
  - '# GNU General Public License v3.0+ (see COPYING or https://www.gnu.org/licenses/gpl-3.0.txt)'
utils_module: extras
class_name: NautobotExtrasModule
endpoint_constant: NB_SECRET
instance_var: secret
instance_kwargs: {}
main_docstring: "\n    Main entry point for module execution.\n    "
shared_specs:
  - NAUTOBOT_ARG_SPEC
  - ID_ARG_SPEC
  - TAGS_ARG_SPEC
  - CUSTOM_FIELDS_ARG_SPEC
  - CONTACTS_AND_TEAMS_ARG_SPEC
  - NOTES_ARG_SPEC
ansible_module_kwargs:
  supports_check_mode: true
extra_imports: []
post_module_code: []
ignore_api_fields: {}
lookup_fields: null
generated_examples: false
options:
  name:
    api_field: name
    argument_spec:
      required: false
      type: str
    documentation:
      description:
        - The name of the secret
        - Required if I(state=present) and the secret does not exist yet
      required: false
      type: str
  description:
    api_field: description
    argument_spec:
      required: false
      type: str
    documentation:
      description:
        - A description of the secret
      required: false
      type: str
  provider:
    api_field: provider
    argument_spec:
      required: false
      type: str
    documentation:
      description:
        - The provider of the secret (e.g., environment-variable, text-file)
        - Required if I(state=present) and the secret does not exist yet
      required: false
      type: str
  parameters:
    api_field: parameters
    argument_spec:
      required: false
      type: dict
    documentation:
      description:
        - A dictionary of parameters for the secret
        - Required if I(state=present) and the secret does not exist yet
      required: false
      type: dict
documentation:
  module: secret
  short_description: Creates or removes secrets from Nautobot
  description:
    - Creates or removes secrets from Nautobot
  notes:
    - Tags should be defined as a YAML list
    - This should be ran with connection C(local) and hosts C(localhost)
  author:
    - Joe Wesch (@joewesch)
  requirements:
    - pynautobot
  version_added: "5.11.0"
  extends_documentation_fragment:
    - networktocode.nautobot.fragments.base
    - networktocode.nautobot.fragments.id
    - networktocode.nautobot.fragments.tags
    - networktocode.nautobot.fragments.custom_fields
    - networktocode.nautobot.fragments.contacts_and_teams
    - networktocode.nautobot.fragments.notes
examples: |2

  ---
  - name: Create an environment variable secret
    networktocode.nautobot.secret:
      url: http://nautobot.local
      token: thisIsMyToken
      name: Device Password
      description: Password for the device
      provider: environment-variable
      parameters:
        variable: NAUTOBOT_NAPALM_PASSWORD
      state: present

  - name: Create a text file secret
    networktocode.nautobot.secret:
      url: http://nautobot.local
      token: thisIsMyToken
      name: Device Certificate
      description: Certificate for the device
      provider: text-file
      parameters:
        file: /path/to/device/certificate.pem
      state: present

  - name: Delete a secret
    networktocode.nautobot.secret:
      url: http://nautobot.local
      token: thisIsMyToken
      name: My Secret
      state: absent

  - name: Delete a secret by id
    networktocode.nautobot.secret:
      url: http://nautobot.local
      token: thisIsMyToken
      id: 00000000-0000-0000-0000-000000000000
      state: absent
return: |2

  secret:
    description: Serialized object as created or already existent within Nautobot
    returned: success (when I(state=present))
    type: dict
  msg:
    description: Message indicating failure or info about what has been achieved
    returned: always
    type: str
