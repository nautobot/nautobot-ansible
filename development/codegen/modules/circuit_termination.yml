documentation:
  module: circuit_termination
  short_description: Create, update or delete circuit terminations within Nautobot
  description:
    - Creates, updates or removes circuit terminations from Nautobot
  notes:
    - Tags should be defined as a YAML list
    - This should be ran with connection C(local) and hosts C(localhost)
  author:
    - Mikhail Yohman (@FragmentedPacket)
  version_added: "1.0.0"
  extends_documentation_fragment:
    - networktocode.nautobot.fragments.base
    - networktocode.nautobot.fragments.id
    - networktocode.nautobot.fragments.tags
    - networktocode.nautobot.fragments.custom_fields
    - networktocode.nautobot.fragments.contacts_and_teams
    - networktocode.nautobot.fragments.notes
examples: |2

  - name: "Test Nautobot modules"
    connection: local
    hosts: localhost
    gather_facts: false

    tasks:
      - name: Create circuit termination within Nautobot with only required information
        networktocode.nautobot.circuit_termination:
          url: http://nautobot.local
          token: thisIsMyToken
          circuit: Test Circuit
          term_side: A
          location:
            name: My Location
            parent: Parent Location
          port_speed: 10000
          state: present

      - name: Create circuit termination to Provider Network
        networktocode.nautobot.circuit_termination:
          url: http://nautobot.local
          token: thisIsMyToken
          circuit: Test Circuit
          term_side: Z
          provider_network:
            name: "Provider A"
          port_speed: 10000
          state: present

      - name: Update circuit termination with other fields
        networktocode.nautobot.circuit_termination:
          url: http://nautobot.local
          token: thisIsMyToken
          circuit: Test Circuit
          term_side: A
          upstream_speed: 1000
          xconnect_id: 10X100
          pp_info: PP10-24
          description: "Test description"
          state: present

      - name: Delete circuit termination within nautobot
        networktocode.nautobot.circuit_termination:
          url: http://nautobot.local
          token: thisIsMyToken
          circuit: Test Circuit
          term_side: A
          state: absent

      - name: Delete circuit termination by id
        networktocode.nautobot.circuit_termination:
          url: http://nautobot.local
          token: thisIsMyToken
          id: 00000000-0000-0000-0000-000000000000
          state: absent
return: |2

  circuit_termination:
    description: Serialized object as created or already existent within Nautobot
    returned: success (when I(state=present))
    type: dict
  msg:
    description: Message indicating failure or info about what has been achieved
    returned: always
    type: str
