documentation:
  module: custom_field_choice
  short_description: Creates or removes custom field choices from Nautobot
  description:
    - Creates or removes custom field choices from Nautobot
  deprecated:
    removed_in: "7.0.0"
    why: Custom field choices are managed via the I(custom_field) module.
    alternative: Use M(networktocode.nautobot.custom_field) with I(custom_field_choices).
  notes:
    - This should be ran with connection C(local) and hosts C(localhost)
  author:
    - Joe Wesch (@joewesch)
  requirements:
    - pynautobot
  version_added: "5.1.0"
  extends_documentation_fragment:
    - networktocode.nautobot.fragments.base
    - networktocode.nautobot.fragments.id
examples: |2

  ---
  - name: Create a custom field choice
    networktocode.nautobot.custom_field_choice:
      url: http://nautobot.local
      token: thisIsMyToken
      value: "Choice 1"
      weight: 100
      custom_field: "Custom Field 1"
      state: present

  - name: Delete a custom field choice by id
    networktocode.nautobot.custom_field_choice:
      url: http://nautobot.local
      token: thisIsMyToken
      id: 00000000-0000-0000-0000-000000000000
      state: absent
return: |2

  custom_field_choice:
    description: Serialized object as created or already existent within Nautobot
    returned: success (when I(state=present))
    type: dict
  msg:
    description: Message indicating failure or info about what has been achieved
    returned: always
    type: str
