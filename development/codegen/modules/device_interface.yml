# Module config for the code generator. The generator reads this file and rewrites it, so keep
# comments out of it. See development/codegen/README.md.
module: device_interface
api_path: /dcim/interfaces/
endpoint: interfaces
header:
  - '# Copyright: (c) 2018, Mikhail Yohman (@FragmentedPacket) <mikhail.yohman@gmail.com>'
  - '# GNU General Public License v3.0+ (see COPYING or https://www.gnu.org/licenses/gpl-3.0.txt)'
utils_module: dcim
class_name: NautobotDcimModule
endpoint_constant: NB_INTERFACES
instance_var: device_interface
instance_kwargs:
  remove_keys:
    - update_vc_child
main_docstring: "\n    Main entry point for module execution.\n    "
shared_specs:
  - NAUTOBOT_ARG_SPEC
  - ID_ARG_SPEC
  - TAGS_ARG_SPEC
  - CUSTOM_FIELDS_ARG_SPEC
  - CONTACTS_AND_TEAMS_ARG_SPEC
  - NOTES_ARG_SPEC
ansible_module_kwargs:
  supports_check_mode: true
extra_imports: []
post_module_code: []
ignore_api_fields: {}
lookup_fields: null
generated_examples: false
options:
  update_vc_child:
    api_field: null
    argument_spec:
      type: bool
      required: false
      default: false
    documentation:
      type: bool
      default: false
      description:
        - |
          Use when master device is specified for C(device) and the specified interface exists on a child device
          and needs updated
      version_added: "3.0.0"
  device:
    api_field: device
    argument_spec:
      required: false
      type: raw
    documentation:
      description:
        - Name of the device the interface will be associated with (case-sensitive)
        - Requires one of I(device) or I(module) when I(state=present) and the interface does not exist yet
      required: false
      type: raw
      version_added: "3.0.0"
  module:
    api_field: module
    argument_spec:
      required: false
      type: raw
    documentation:
      description:
        - The attached module
        - Requires one of I(device) or I(module) when I(state=present) and the interface does not exist yet
      required: false
      type: raw
      version_added: "5.4.0"
  status:
    api_field: status
    argument_spec:
      required: false
      type: raw
    documentation:
      description:
        - The status of the interface
        - Required if I(state=present) and the interface does not exist yet
      required: false
      type: raw
      version_added: "4.5.0"
  name:
    api_field: name
    argument_spec:
      required: false
      type: str
    documentation:
      description:
        - Name of the interface to be created
        - Required if I(state=present) and the interface does not exist yet
      required: false
      type: str
      version_added: "3.0.0"
  label:
    api_field: label
    argument_spec:
      required: false
      type: str
    documentation:
      description:
        - Physical label of the interface
      required: false
      type: str
      version_added: "3.0.0"
  role:
    api_field: role
    argument_spec:
      required: false
      type: raw
    documentation:
      description:
        - The role of the interface
      required: false
      type: raw
      version_added: "5.4.0"
  type:
    api_field: type
    argument_spec:
      required: false
      type: str
    documentation:
      description:
        - |
          Form factor of the interface:
          ex. 1000Base-T (1GE), Virtual, 10GBASE-T (10GE)
          This has to be specified exactly as what is found within UI
        - Required if I(state=present) and the interface does not exist yet
      required: false
      type: str
      version_added: "3.0.0"
  enabled:
    api_field: enabled
    argument_spec:
      required: false
      type: bool
    documentation:
      description:
        - Sets whether interface shows enabled or disabled
      required: false
      type: bool
      version_added: "3.0.0"
  lag:
    api_field: lag
    argument_spec:
      required: false
      type: raw
    documentation:
      description:
        - Parent LAG interface will be a member of
      required: false
      type: raw
      version_added: "3.0.0"
  parent_interface:
    api_field: parent_interface
    argument_spec:
      required: false
      type: raw
    documentation:
      description:
        - Interface that will be the parent of the interface being created
      required: false
      type: raw
      version_added: "4.5.0"
  bridge:
    api_field: bridge
    argument_spec:
      required: false
      type: raw
    documentation:
      description:
        - Interface that will be the bridge of the interface being created
      required: false
      type: raw
      version_added: "4.5.0"
  mtu:
    api_field: mtu
    argument_spec:
      required: false
      type: int
    documentation:
      description:
        - The MTU of the interface
      required: false
      type: int
      version_added: "3.0.0"
  mac_address:
    api_field: mac_address
    argument_spec:
      required: false
      type: str
    documentation:
      description:
        - The MAC address of the interface
      required: false
      type: str
      version_added: "3.0.0"
  mgmt_only:
    api_field: mgmt_only
    argument_spec:
      required: false
      type: bool
    documentation:
      description:
        - This interface is used only for out-of-band management
      required: false
      type: bool
      version_added: "3.0.0"
  description:
    api_field: description
    argument_spec:
      required: false
      type: str
    documentation:
      description:
        - The description of the interface
      required: false
      type: str
      version_added: "3.0.0"
  mode:
    api_field: mode
    argument_spec:
      required: false
      type: raw
    documentation:
      description:
        - The mode of the interface
      required: false
      type: raw
      version_added: "3.0.0"
  untagged_vlan:
    api_field: untagged_vlan
    argument_spec:
      required: false
      type: raw
    documentation:
      description:
        - The untagged VLAN to be assigned to interface
      required: false
      type: raw
      version_added: "3.0.0"
  tagged_vlans:
    api_field: tagged_vlans
    argument_spec:
      required: false
      type: raw
    documentation:
      description:
        - A list of tagged VLANS to be assigned to interface. Mode must be set to either C(Tagged) or C(Tagged All)
      required: false
      type: raw
      version_added: "3.0.0"
  vrf:
    api_field: vrf
    argument_spec:
      required: false
      type: raw
    documentation:
      description:
        - The VRF associated with the interface
      required: false
      type: raw
      version_added: "5.12.0"
  port_type:
    api_field: port_type
    argument_spec:
      required: false
      type: str
    documentation:
      description:
        - The type of port the interface is
      required: false
      type: str
      version_added: "6.3.0"
  ip_addresses:
    api_field: null
    argument_spec:
      required: false
      type: dict
      options:
        state:
          required: false
          default: merge
          choices:
            - merge
            - replace
            - delete
        objects:
          required: true
          type: list
          elements: dict
          options:
            ip_address:
              required: true
              type: raw
            is_source:
              required: false
              type: bool
            is_destination:
              required: false
              type: bool
            is_default:
              required: false
              type: bool
            is_preferred:
              required: false
              type: bool
            is_primary:
              required: false
              type: bool
            is_secondary:
              required: false
              type: bool
            is_standby:
              required: false
              type: bool
    documentation:
      description:
        - List of IP addresses to associate with this interface.
      required: false
      type: dict
      version_added: "6.2.0"
      suboptions:
        state:
          description:
            - C(merge) adds associations without removing existing ones.
            - C(replace) enforces exactly the listed associations, removing any extras.
            - C(delete) removes the listed associations.
          required: false
          type: str
          default: merge
          choices:
            - merge
            - replace
            - delete
        objects:
          description:
            - List of IP addresses to associate.
          required: true
          type: list
          elements: dict
          suboptions:
            ip_address:
              description:
                - The IP address to associate with the interface.
              required: true
              type: raw
            is_source:
              description:
                - Mark the IP address as a source IP address.
              required: false
              type: bool
            is_destination:
              description:
                - Mark the IP address as a destination IP address.
              required: false
              type: bool
            is_default:
              description:
                - Mark the IP address as a default IP address.
              required: false
              type: bool
            is_preferred:
              description:
                - Mark the IP address as a preferred IP address.
              required: false
              type: bool
            is_primary:
              description:
                - Mark the IP address as a primary IP address.
              required: false
              type: bool
            is_secondary:
              description:
                - Mark the IP address as a secondary IP address.
              required: false
              type: bool
            is_standby:
              description:
                - Mark the IP address as a standby IP address.
              required: false
              type: bool
  speed:
    api_field: speed
    managed: true
    argument_spec:
      required: false
      type: int
    documentation:
      description:
        - The speed of the interface
      required: false
      type: int
      version_added: "6.4.0"
  duplex:
    api_field: duplex
    managed: true
    argument_spec:
      required: false
      type: str
      choices: &id001
        - auto
        - full
        - half
    documentation:
      description:
        - The duplex of the interface
      required: false
      type: str
      choices: *id001
      version_added: "6.4.0"
  breakout_position:
    api_field: breakout_position
    managed: true
    argument_spec:
      required: false
      type: int
    documentation:
      description:
        - For a child interface of a breakout-cable trunk, the position on the parent interface's trunk connector that this child interface maps to.
      required: false
      type: int
      version_added: "6.4.0"
documentation:
  module: device_interface
  short_description: Creates or removes interfaces on devices from Nautobot
  description:
    - Creates or removes interfaces from Nautobot
  notes:
    - Tags should be defined as a YAML list
    - This should be ran with connection C(local) and hosts C(localhost)
  author:
    - Mikhail Yohman (@FragmentedPacket)
  version_added: "1.0.0"
  extends_documentation_fragment:
    - networktocode.nautobot.fragments.base
    - networktocode.nautobot.fragments.id
    - networktocode.nautobot.fragments.tags
    - networktocode.nautobot.fragments.custom_fields
    - networktocode.nautobot.fragments.contacts_and_teams
    - networktocode.nautobot.fragments.notes
examples: |2

  - name: "Test Nautobot interface module"
    connection: local
    hosts: localhost
    gather_facts: false
    tasks:
      - name: Create interface within Nautobot with only required information
        networktocode.nautobot.device_interface:
          url: http://nautobot.local
          token: thisIsMyToken
          device: test100
          name: GigabitEthernet1
          state: present

      - name: Delete interface within nautobot
        networktocode.nautobot.device_interface:
          url: http://nautobot.local
          token: thisIsMyToken
          device: test100
          name: GigabitEthernet1
          state: absent

      - name: Create LAG with several specified options
        networktocode.nautobot.device_interface:
          url: http://nautobot.local
          token: thisIsMyToken
          device: test100
          name: port-channel1
          type: Link Aggregation Group (LAG)
          mtu: 1600
          mgmt_only: false
          mode: Access
          state: present

      - name: Create interface and assign it to parent LAG
        networktocode.nautobot.device_interface:
          url: http://nautobot.local
          token: thisIsMyToken
          device: test100
          name: GigabitEthernet1
          enabled: false
          type: 1000Base-t (1GE)
          lag:
            name: port-channel1
          mtu: 1600
          mgmt_only: false
          mode: Access
          state: present

      - name: Create interface as a trunk port
        networktocode.nautobot.device_interface:
          url: http://nautobot.local
          token: thisIsMyToken
          device: test100
          name: GigabitEthernet25
          enabled: false
          role: Loopnetwork
          type: 1000Base-t (1GE)
          untagged_vlan:
            name: Wireless
            location: "{{ location['key'] }}"
          tagged_vlans:
            - name: Data
              location: "{{ location['key'] }}"
            - name: VoIP
              location: "{{ location['key'] }}"
          mtu: 1600
          mgmt_only: true
          mode: Tagged
          state: present

      - name: Update interface on child device on virtual chassis
        networktocode.nautobot.device_interface:
          url: http://nautobot.local
          token: thisIsMyToken
          device: test100
          name: GigabitEthernet2/0/1
          enabled: false
          update_vc_child: true

      - name: |
          Create an interface and update custom_field data point,
          setting the value to True
        networktocode.nautobot.device_interface:
          url: http://nautobot.local
          token: thisIsMyToken
          device: test100
          name: GigabitEthernet1/1/1
          enabled: false
          custom_fields:
            monitored: true

      - name: Create child interface
        networktocode.nautobot.device_interface:
          url: http://nautobot.local
          token: thisIsMyToken
          device: test100
          name: GigabitEthernet1/1/1
          type: Virtual
          parent_interface:
            name: GigabitEthernet1/1

      - name: Create bridge interface
        networktocode.nautobot.device_interface:
          url: http://nautobot.local
          token: thisIsMyToken
          device: test100
          name: Bridge1
          bridge:
            name: GigabitEthernet1/1

      - name: Create interface with inline IP address associations
        networktocode.nautobot.device_interface:
          url: http://nautobot.local
          token: thisIsMyToken
          device: test100
          name: GigabitEthernet1/1/1
          ip_addresses:
            state: merge
            objects:
              - ip_address: 192.168.1.1/24
                is_source: true
              - ip_address: 192.168.1.2/24
                is_destination: true
              - ip_address: 192.168.1.3/24
                is_default: true

      - name: Delete interface by id
        networktocode.nautobot.device_interface:
          url: http://nautobot.local
          token: thisIsMyToken
          id: 00000000-0000-0000-0000-000000000000
          state: absent
return: |2

  interface:
    description: Serialized object as created or already existent within Nautobot
    returned: on creation
    type: dict
  msg:
    description: Message indicating failure or info about what has been achieved
    returned: always
    type: str
