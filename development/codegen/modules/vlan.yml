documentation:
  module: vlan
  short_description: Create, update or delete vlans within Nautobot
  description:
    - Creates, updates or removes vlans from Nautobot
  notes:
    - Tags should be defined as a YAML list
    - This should be ran with connection C(local) and hosts C(localhost)
  author:
    - Mikhail Yohman (@FragmentedPacket)
  version_added: "1.0.0"
  extends_documentation_fragment:
    - networktocode.nautobot.fragments.base
    - networktocode.nautobot.fragments.id
    - networktocode.nautobot.fragments.tags
    - networktocode.nautobot.fragments.custom_fields
    - networktocode.nautobot.fragments.contacts_and_teams
    - networktocode.nautobot.fragments.notes
examples: |2

  - name: "Test Nautobot modules"
    connection: local
    hosts: localhost
    gather_facts: false

    tasks:
      - name: Create vlan within Nautobot with only required information
        networktocode.nautobot.vlan:
          url: http://nautobot.local
          token: thisIsMyToken
          name: Test VLAN
          vid: 400
          status: active
          state: present

      - name: Delete vlan within nautobot
        networktocode.nautobot.vlan:
          url: http://nautobot.local
          token: thisIsMyToken
          name: Test VLAN
          vid: 400
          status: active
          state: absent

      - name: Create vlan with all information
        networktocode.nautobot.vlan:
          url: http://nautobot.local
          token: thisIsMyToken
          name: Test VLAN
          vid: 400
          location:
            name: My Location
            parent: Parent Location
          group: Test VLAN Group
          tenant: Test Tenant
          status: Deprecated
          role: Test VLAN Role
          description: Just a test
          tags:
            - Schnozzberry
          state: present

      - name: Delete vlan by id
        networktocode.nautobot.vlan:
          url: http://nautobot.local
          token: thisIsMyToken
          id: 00000000-0000-0000-0000-000000000000
          state: absent
return: |2

  vlan:
    description: Serialized object as created or already existent within Nautobot
    returned: success (when I(state=present))
    type: dict
  msg:
    description: Message indicating failure or info about what has been achieved
    returned: always
    type: str
