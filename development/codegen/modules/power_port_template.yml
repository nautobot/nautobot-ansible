documentation:
  module: power_port_template
  short_description: Create, update or delete power port templates within Nautobot
  description:
    - Creates, updates or removes power port templates from Nautobot
  notes:
    - Tags should be defined as a YAML list
    - This should be ran with connection C(local) and hosts C(localhost)
  author:
    - Tobias Groß (@toerb)
  version_added: "1.0.0"
  extends_documentation_fragment:
    - networktocode.nautobot.fragments.base
    - networktocode.nautobot.fragments.id
    - networktocode.nautobot.fragments.custom_fields
    - networktocode.nautobot.fragments.contacts_and_teams
examples: |2

  - name: "Test Nautobot modules"
    connection: local
    hosts: localhost
    gather_facts: false

    tasks:
      - name: Create power port within Nautobot with only required information
        networktocode.nautobot.power_port_template:
          url: http://nautobot.local
          token: thisIsMyToken
          name: Test Power Port Template
          device_type: Test Device Type
          state: present

      - name: Update power port with other fields
        networktocode.nautobot.power_port_template:
          url: http://nautobot.local
          token: thisIsMyToken
          name: Test Power Port Template
          device_type: Test Device Type
          type: iec-60320-c6
          allocated_draw: 16
          maximum_draw: 80
          state: present

      - name: Delete power port within nautobot
        networktocode.nautobot.power_port_template:
          url: http://nautobot.local
          token: thisIsMyToken
          name: Test Power Port Template
          device_type: Test Device Type
          state: absent

      - name: Delete power port template by id
        networktocode.nautobot.power_port_template:
          url: http://nautobot.local
          token: thisIsMyToken
          id: 00000000-0000-0000-0000-000000000000
          state: absent
return: |2

  power_port_template:
    description: Serialized object as created or already existent within Nautobot
    returned: success (when I(state=present))
    type: dict
  msg:
    description: Message indicating failure or info about what has been achieved
    returned: always
    type: str
