examples: |2

  - name: Test Nautobot modules
    connection: local
    hosts: localhost
    gather_facts: false
    tasks:
      - name: Create cable to cable termination within Nautobot with only required information
        networktocode.nautobot.cable_to_cable_termination:
          url: http://nautobot.local
          token: thisIsMyToken
          cable_end: A
          cable: Test Cable
          state: present
      - name: Delete cable to cable termination within Nautobot
        networktocode.nautobot.cable_to_cable_termination:
          url: http://nautobot.local
          token: thisIsMyToken
          cable_end: A
          cable: Test Cable
          state: absent
      - name: Delete cable to cable termination by id
        networktocode.nautobot.cable_to_cable_termination:
          url: http://nautobot.local
          token: thisIsMyToken
          id: 00000000-0000-0000-0000-000000000000
          state: absent
