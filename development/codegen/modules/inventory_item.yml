documentation:
  module: inventory_item
  short_description: Creates or removes inventory items from Nautobot
  description:
    - Creates or removes inventory items from Nautobot
  notes:
    - Tags should be defined as a YAML list
    - This should be ran with connection C(local) and hosts C(localhost)
  author:
    - Mikhail Yohman (@FragmentedPacket)
  version_added: "1.0.0"
  extends_documentation_fragment:
    - networktocode.nautobot.fragments.base
    - networktocode.nautobot.fragments.id
    - networktocode.nautobot.fragments.tags
    - networktocode.nautobot.fragments.custom_fields
    - networktocode.nautobot.fragments.contacts_and_teams
    - networktocode.nautobot.fragments.notes
examples: |2

  - name: "Test Nautobot inventory_item module"
    connection: local
    hosts: localhost
    gather_facts: false
    tasks:
      - name: Create inventory item within Nautobot with only required information
        networktocode.nautobot.inventory_item:
          url: http://nautobot.local
          token: thisIsMyToken
          device: test100
          name: "10G-SFP+"
          state: present

      - name: Update inventory item
        networktocode.nautobot.inventory_item:
          url: http://nautobot.local
          token: thisIsMyToken
          device: test100
          name: "10G-SFP+"
          manufacturer: "Cisco"
          part_id: "10G-SFP+"
          serial: "1234"
          asset_tag: "1234"
          description: "New SFP"
          notes:
            objects:
              - note: Example note text
          contacts:
            objects:
              - contact: Jane Doe
                role: User
                status: Active
              - contact:
                  name: John Smith
                role: User
                status: Active
              - contact:
                  name: John Smith, Jr.
                role: User
                status: Active
            teams:
              objects:
                - team: Network Team
                  role: Admin
                  status: Active
          state: present

      - name: Delete inventory item within nautobot
        networktocode.nautobot.inventory_item:
          url: http://nautobot.local
          token: thisIsMyToken
          device: test100
          name: "10G-SFP+"
          state: absent

      - name: Delete inventory item by id
        networktocode.nautobot.inventory_item:
          url: http://nautobot.local
          token: thisIsMyToken
          id: 00000000-0000-0000-0000-000000000000
          state: absent
return: |2

  inventory_item:
    description: Serialized object as created or already existent within Nautobot
    returned: on creation
    type: dict
  msg:
    description: Message indicating failure or info about what has been achieved
    returned: always
    type: str
