examples: |2

  - name: "Test Nautobot modules"
    connection: local
    hosts: localhost
    gather_facts: false

    tasks:
      - name: Create virtual chassis within Nautobot with only required information
        networktocode.nautobot.virtual_chassis:
          url: http://nautobot.local
          token: thisIsMyToken
          name: "Virtual Chassis 1"
          state: present

      - name: Update virtual chassis with other fields
        networktocode.nautobot.virtual_chassis:
          url: http://nautobot.local
          token: thisIsMyToken
          name: "Virtual Chassis 1"
          master: Test Device
          domain: Domain Text
          state: present

      - name: Delete virtual chassis within nautobot
        networktocode.nautobot.virtual_chassis:
          url: http://nautobot.local
          token: thisIsMyToken
          name: "Virtual Chassis 1"
          state: absent

      - name: Delete virtual chassis by id
        networktocode.nautobot.virtual_chassis:
          url: http://nautobot.local
          token: thisIsMyToken
          id: 00000000-0000-0000-0000-000000000000
          state: absent
return: |2

  virtual_chassis:
    description: Serialized object as created or already existent within Nautobot
    returned: success (when I(state=present))
    type: dict
  msg:
    description: Message indicating failure or info about what has been achieved
    returned: always
    type: str
