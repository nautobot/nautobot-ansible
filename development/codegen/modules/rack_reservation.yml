examples: |2

  - name: Test Nautobot modules
    connection: local
    hosts: localhost
    gather_facts: false
    tasks:
      - name: Create rack reservation within Nautobot with only required information
        networktocode.nautobot.rack_reservation:
          url: http://nautobot.local
          token: thisIsMyToken
          units: &id001 []
          description: Test Description
          rack: Test Rack
          state: present
      - name: Delete rack reservation within Nautobot
        networktocode.nautobot.rack_reservation:
          url: http://nautobot.local
          token: thisIsMyToken
          units: *id001
          description: Test Description
          rack: Test Rack
          state: absent
      - name: Delete rack reservation by id
        networktocode.nautobot.rack_reservation:
          url: http://nautobot.local
          token: thisIsMyToken
          id: 00000000-0000-0000-0000-000000000000
          state: absent
