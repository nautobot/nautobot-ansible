documentation:
  module: saved_view
  short_description: Create, update or delete saved views within Nautobot
  description:
    - Creates, updates or removes saved views from Nautobot.
  notes:
    - This should be ran with connection C(local) and hosts C(localhost)
  author:
    - Network to Code (@networktocode)
  version_added: "6.4.0"
  extends_documentation_fragment:
    - networktocode.nautobot.fragments.base
    - networktocode.nautobot.fragments.id
examples: |2

  - name: Test Nautobot modules
    connection: local
    hosts: localhost
    gather_facts: false
    tasks:
      - name: Create saved view within Nautobot with only required information
        networktocode.nautobot.saved_view:
          url: http://nautobot.local
          token: thisIsMyToken
          name: Test Name
          view: Test View
          state: present
      - name: Delete saved view within Nautobot
        networktocode.nautobot.saved_view:
          url: http://nautobot.local
          token: thisIsMyToken
          name: Test Name
          state: absent
      - name: Delete saved view by id
        networktocode.nautobot.saved_view:
          url: http://nautobot.local
          token: thisIsMyToken
          id: 00000000-0000-0000-0000-000000000000
          state: absent
