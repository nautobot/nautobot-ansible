documentation:
  module: virtual_device_context
  short_description: Create, update or delete virtual device contexts within Nautobot
  description:
    - Creates, updates or removes virtual device contexts from Nautobot
  notes:
    - Tags should be defined as a YAML list
    - This should be ran with connection C(local) and hosts C(localhost)
    - This module requires Nautobot 2.4 or later
  author:
    - Joe Wesch (@joewesch)
  requirements:
    - pynautobot
  version_added: "5.16.0"
  extends_documentation_fragment:
    - networktocode.nautobot.fragments.base
    - networktocode.nautobot.fragments.id
    - networktocode.nautobot.fragments.tags
    - networktocode.nautobot.fragments.custom_fields
    - networktocode.nautobot.fragments.contacts_and_teams
    - networktocode.nautobot.fragments.notes
examples: |2

  - name: Create a virtual device context
    networktocode.nautobot.virtual_device_context:
      url: http://nautobot.local
      token: thisIsMyToken
      name: "My Virtual Device Context"
      device: "My Device"
      status: "Active"
      state: present

  - name: Create a virtual device context with inline VRF associations
    networktocode.nautobot.virtual_device_context:
      url: http://nautobot.local
      token: thisIsMyToken
      name: "My Virtual Device Context"
      device: "My Device"
      status: "Active"
      vrfs:
        state: merge
        objects:
          - vrf: "Test VRF"
      state: present

  - name: Delete a virtual device context
    networktocode.nautobot.virtual_device_context:
      url: http://nautobot.local
      token: thisIsMyToken
      name: "My Virtual Device Context"
      state: absent

  - name: Delete a virtual device context by id
    networktocode.nautobot.virtual_device_context:
      url: http://nautobot.local
      token: thisIsMyToken
      id: 00000000-0000-0000-0000-000000000000
      state: absent
return: |2

  virtual_device_context:
    description: Serialized object as created or already existent within Nautobot
    returned: success (when I(state=present))
    type: dict
  msg:
    description: Message indicating successful operation
    returned: success
    type: str
