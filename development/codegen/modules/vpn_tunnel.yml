examples: |2

  - name: Test Nautobot modules
    connection: local
    hosts: localhost
    gather_facts: false
    tasks:
      - name: Create VPN Tunnel within Nautobot with only required information
        networktocode.nautobot.vpn_tunnel:
          url: http://nautobot.local
          token: thisIsMyToken
          name: Test Name
          status: Active
          state: present
      - name: Delete VPN Tunnel within Nautobot
        networktocode.nautobot.vpn_tunnel:
          url: http://nautobot.local
          token: thisIsMyToken
          name: Test Name
          state: absent
      - name: Delete VPN Tunnel by id
        networktocode.nautobot.vpn_tunnel:
          url: http://nautobot.local
          token: thisIsMyToken
          id: 00000000-0000-0000-0000-000000000000
          state: absent
