  - '# GNU General Public License v3.0+ (see COPYING or https://www.gnu.org/licenses/gpl-3.0.txt)'
utils_module: circuits
class_name: NautobotCircuitsModule
endpoint_constant: NB_PROVIDER_NETWORKS
instance_var: provider_network
instance_kwargs: {}
main_docstring: "\n    Main entry point for module execution.\n    "
shared_specs:
  - NAUTOBOT_ARG_SPEC
  - ID_ARG_SPEC
  - TAGS_ARG_SPEC
  - CUSTOM_FIELDS_ARG_SPEC
  - CONTACTS_AND_TEAMS_ARG_SPEC
ansible_module_kwargs:
  supports_check_mode: true
extra_imports: []
post_module_code: []
ignore_api_fields: {}
lookup_fields: null
generated_examples: false
options:
  name:
    api_field: name
    argument_spec:
      required: false
      type: str
    documentation:
      description:
        - The name of the provider network
        - Required if I(state=present) and the provider network does not exist yet
      required: false
      type: str
  circuit_provider:
    api_field: provider
    argument_spec:
      required: false
      type: raw
      aliases:
        - provider
    documentation:
      description:
        - The provider that this network belongs to
        - Required if I(state=present) and the provider network does not exist yet
      required: false
      type: raw
      aliases:
        - provider
  description:
    api_field: description
    argument_spec:
      required: false
      type: str
    documentation:
      description:
        - A description of the provider network
      required: false
      type: str
  comments:
    api_field: comments
    argument_spec:
      required: false
      type: str
    documentation:
      description:
        - Comments related to the provider network
      required: false
      type: str
documentation:
  module: provider_network
  short_description: Create, update or delete provider networks within Nautobot
  description:
    - Creates, updates or removes provider networks from Nautobot
  deprecated:
    removed_in: "7.0.0"
    why: Provider networks are managed on the I(provider) record.
    alternative: Use M(networktocode.nautobot.provider) with I(provider_networks).
  notes:
    - Tags should be defined as a YAML list
    - This should be ran with connection C(local) and hosts C(localhost)
  author:
    - Josh VanDeraa (@jvanderaa)
  requirements:
    - pynautobot
  version_added: "6.2.0"
  extends_documentation_fragment:
    - networktocode.nautobot.fragments.base
    - networktocode.nautobot.fragments.id
    - networktocode.nautobot.fragments.tags
    - networktocode.nautobot.fragments.custom_fields
    - networktocode.nautobot.fragments.contacts_and_teams
examples: |2

  - name: "Test Nautobot modules"
    connection: local
    hosts: localhost
    gather_facts: false

    tasks:
      - name: Create provider network within Nautobot with only required information
        networktocode.nautobot.provider_network:
          url: http://nautobot.local
          token: thisIsMyToken
          name: Test Provider Network
          provider: Test Provider
          state: present

      - name: Update provider network with other fields
        networktocode.nautobot.provider_network:
          url: http://nautobot.local
          token: thisIsMyToken
          name: Test Provider Network
          provider: Test Provider
          description: "A test provider network"
          comments: "Some comments"
          state: present

      - name: Delete provider network within nautobot
        networktocode.nautobot.provider_network:
          url: http://nautobot.local
          token: thisIsMyToken
          name: Test Provider Network
          provider: Test Provider
          state: absent

      - name: Delete provider network by id
        networktocode.nautobot.provider_network:
          url: http://nautobot.local
          token: thisIsMyToken
          id: 00000000-0000-0000-0000-000000000000
          state: absent
return: |2

  provider_network:
    description: Serialized object as created or already existent within Nautobot
    returned: success (when I(state=present))
    type: dict
  msg:
    description: Message indicating failure or info about what has been achieved
    returned: always
    type: str
