# Module config for the code generator. The generator reads this file and rewrites it, so keep
# comments out of it. See development/codegen/README.md.
module: contact
api_path: /extras/contacts/
endpoint: contacts
header:
  - '# Copyright: (c) 2024, Network to Code (@networktocode) <info@networktocode.com>'
  - '# GNU General Public License v3.0+ (see COPYING or https://www.gnu.org/licenses/gpl-3.0.txt)'
utils_module: extras
class_name: NautobotExtrasModule
endpoint_constant: NB_CONTACT
instance_var: contact
instance_kwargs: {}
main_docstring: "\n    Main entry point for module execution.\n    "
shared_specs:
  - NAUTOBOT_ARG_SPEC
  - ID_ARG_SPEC
  - TAGS_ARG_SPEC
  - CUSTOM_FIELDS_ARG_SPEC
  - NOTES_ARG_SPEC
ansible_module_kwargs:
  supports_check_mode: true
extra_imports: []
post_module_code: []
ignore_api_fields: {}
lookup_fields: null
generated_examples: false
options:
  name:
    api_field: name
    argument_spec:
      required: false
      type: str
    documentation:
      description:
        - The name of the contact
        - Required if I(state=present) and the contact does not exist yet
      required: false
      type: str
  phone:
    api_field: phone
    argument_spec:
      required: false
      type: str
    documentation:
      description:
        - The phone number of the contact
      required: false
      type: str
  email:
    api_field: email
    argument_spec:
      required: false
      type: str
    documentation:
      description:
        - The email of the contact
      required: false
      type: str
  address:
    api_field: address
    argument_spec:
      required: false
      type: str
    documentation:
      description:
        - The address of the contact
      required: false
      type: str
  teams:
    api_field: teams
    argument_spec:
      required: false
      type: list
      elements: raw
    documentation:
      description:
        - The teams the contact is associated with
      required: false
      type: list
      elements: raw
  comments:
    api_field: comments
    argument_spec:
      required: false
      type: str
    documentation:
      description:
        - Comments about the contact
      required: false
      type: str
documentation:
  module: contact
  short_description: Creates or removes contacts from Nautobot
  description:
    - Creates or removes contacts from Nautobot
  notes:
    - Tags should be defined as a YAML list
    - This should be ran with connection C(local) and hosts C(localhost)
  author:
    - Joe Wesch (@joewesch)
  requirements:
    - pynautobot
  version_added: "5.3.0"
  extends_documentation_fragment:
    - networktocode.nautobot.fragments.base
    - networktocode.nautobot.fragments.id
    - networktocode.nautobot.fragments.tags
    - networktocode.nautobot.fragments.custom_fields
    - networktocode.nautobot.fragments.notes
examples: |2

  ---
  - name: Create a contact
    networktocode.nautobot.contact:
      url: http://nautobot.local
      token: thisIsMyToken
      name: My Contact
      phone: 123-456-7890
      email: user@example.com
      address: 1234 Main St
      teams:
        - name: team1
        - name: team2
      comments: My Comments
      tags:
        - tag1
        - tag2
      custom_fields:
        my_custom_field: my_value
      state: present

  - name: Delete a contact
    networktocode.nautobot.contact:
      url: http://nautobot.local
      token: thisIsMyToken
      name: My Contact
      state: absent

  - name: Delete a contact by id
    networktocode.nautobot.contact:
      url: http://nautobot.local
      token: thisIsMyToken
      id: 00000000-0000-0000-0000-000000000000
      state: absent
return: |2

  contact:
    description: Serialized object as created or already existent within Nautobot
    returned: success (when I(state=present))
    type: dict
  msg:
    description: Message indicating failure or info about what has been achieved
    returned: always
    type: str
