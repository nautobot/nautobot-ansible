documentation:
  module: admin_user
  short_description: Create, update or delete users within Nautobot
  description:
    - Creates, updates or removes users from Nautobot
  notes:
    - This should be ran with connection C(local) and hosts C(localhost)
  author:
    - Jeff Kala (@jeffkala)
  version_added: "5.3.0"
  extends_documentation_fragment:
    - networktocode.nautobot.fragments.base
    - networktocode.nautobot.fragments.id
examples: |2

  - name: "Test Nautobot modules"
    connection: local
    hosts: localhost
    gather_facts: false

    tasks:
      - name: Create user within Nautobot with only required information
        networktocode.nautobot.admin_user:
          url: http://nautobot.local
          token: thisIsMyToken
          username: nb_user
          email: nb_user@example.com
          first_name: nb
          last_name: user
          state: present

      - name: Delete user within nautobot
        networktocode.nautobot.admin_user:
          url: http://nautobot.local
          token: thisIsMyToken
          username: nb_user
          email: nb_user@example.com
          first_name: nb
          last_name: user
          state: absent

      - name: Delete user by id
        networktocode.nautobot.admin_user:
          url: http://nautobot.local
          token: thisIsMyToken
          id: 00000000-0000-0000-0000-000000000000
          state: absent
return: |2

  user:
    description: Serialized object as created or already existent within Nautobot
    returned: success (when I(state=present))
    type: dict
  msg:
    description: Message indicating failure or info about what has been achieved
    returned: always
    type: str
