documentation:
  module: front_port
  short_description: Create, update or delete front ports within Nautobot
  description:
    - Creates, updates or removes front ports from Nautobot
  notes:
    - Tags should be defined as a YAML list
    - This should be ran with connection C(local) and hosts C(localhost)
  author:
    - Tobias Groß (@toerb)
  version_added: "1.0.0"
  extends_documentation_fragment:
    - networktocode.nautobot.fragments.base
    - networktocode.nautobot.fragments.id
    - networktocode.nautobot.fragments.tags
    - networktocode.nautobot.fragments.custom_fields
    - networktocode.nautobot.fragments.contacts_and_teams
    - networktocode.nautobot.fragments.notes
examples: |2

  - name: "Test Nautobot modules"
    connection: local
    hosts: localhost
    gather_facts: false

    tasks:
      - name: Create front port within Nautobot with only required information
        networktocode.nautobot.front_port:
          url: http://nautobot.local
          token: thisIsMyToken
          name: Test Front Port
          device: Test Device
          type: bnc
          rear_port: Test Rear Port
          state: present

      - name: Create front port inside module
        networktocode.nautobot.front_port:
          url: http://nautobot.local
          token: thisIsMyToken
          name: Test Front Port
          module: HooverMaxProModel60
          type: bnc
          rear_port: Test Rear Port
          state: present

      - name: Update front port with other fields
        networktocode.nautobot.front_port:
          url: http://nautobot.local
          token: thisIsMyToken
          name: Test Front Port
          device: Test Device
          type: bnc
          rear_port: Test Rear Port
          rear_port_position: 5
          description: front port description
          state: present

      - name: Delete front port within nautobot
        networktocode.nautobot.front_port:
          url: http://nautobot.local
          token: thisIsMyToken
          name: Test Front Port
          device: Test Device
          type: bnc
          rear_port: Test Rear Port
          state: absent

      - name: Delete front port by id
        networktocode.nautobot.front_port:
          url: http://nautobot.local
          token: thisIsMyToken
          id: 00000000-0000-0000-0000-000000000000
          state: absent
return: |2

  front_port:
    description: Serialized object as created or already existent within Nautobot
    returned: success (when I(state=present))
    type: dict
  msg:
    description: Message indicating failure or info about what has been achieved
    returned: always
    type: str
