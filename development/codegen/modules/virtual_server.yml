documentation:
  module: virtual_server
  short_description: Create, update or delete virtual servers within Nautobot
  description:
    - Creates, updates or removes virtual servers from Nautobot.
  notes:
    - Tags should be defined as a YAML list
    - This should be ran with connection C(local) and hosts C(localhost)
  author:
    - Network to Code (@networktocode)
  version_added: "6.4.0"
  extends_documentation_fragment:
    - networktocode.nautobot.fragments.base
    - networktocode.nautobot.fragments.id
    - networktocode.nautobot.fragments.tags
    - networktocode.nautobot.fragments.custom_fields
    - networktocode.nautobot.fragments.contacts_and_teams
    - networktocode.nautobot.fragments.notes
examples: |2

  - name: Test Nautobot modules
    connection: local
    hosts: localhost
    gather_facts: false
    tasks:
      - name: Create Virtual Server within Nautobot with only required information
        networktocode.nautobot.virtual_server:
          url: http://nautobot.local
          token: thisIsMyToken
          name: Test Name
          vip: Test Vip
          state: present
      - name: Delete Virtual Server within Nautobot
        networktocode.nautobot.virtual_server:
          url: http://nautobot.local
          token: thisIsMyToken
          vip: Test Vip
          port: 1
          protocol: tcp
          state: absent
      - name: Delete Virtual Server by id
        networktocode.nautobot.virtual_server:
          url: http://nautobot.local
          token: thisIsMyToken
          id: 00000000-0000-0000-0000-000000000000
          state: absent
return: |2

  virtual_server:
    description: Serialized object as created or already existent within Nautobot
    returned: success (when I(state=present))
    type: dict
  msg:
    description: Message indicating failure or info about what has been achieved
    returned: always
    type: str
lookup_fields:
  - vip
