examples: |2

  - name: Test Nautobot modules
    connection: local
    hosts: localhost
    gather_facts: false
    tasks:
      - name: Create module family within Nautobot with only required information
        networktocode.nautobot.module_family:
          url: http://nautobot.local
          token: thisIsMyToken
          name: Test Name
          state: present
      - name: Delete module family within Nautobot
        networktocode.nautobot.module_family:
          url: http://nautobot.local
          token: thisIsMyToken
          name: Test Name
          state: absent
      - name: Delete module family by id
        networktocode.nautobot.module_family:
          url: http://nautobot.local
          token: thisIsMyToken
          id: 00000000-0000-0000-0000-000000000000
          state: absent
return: |2

  module_family:
    description: Serialized object as created or already existent within Nautobot
    returned: success (when I(state=present))
    type: dict
  msg:
    description: Message indicating failure or info about what has been achieved
    returned: always
    type: str
