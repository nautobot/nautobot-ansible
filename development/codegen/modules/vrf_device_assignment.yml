documentation:
  module: vrf_device_assignment
  short_description: Creates or removes VRF to device assignments in Nautobot
  description:
    - Creates or removes VRF to device assignments in Nautobot
  deprecated:
    removed_in: "7.0.0"
    why: VRF assignments are managed on device, virtual machine, or virtual device context records.
    alternative: Use M(networktocode.nautobot.device), M(networktocode.nautobot.virtual_machine), or M(networktocode.nautobot.virtual_device_context) with I(vrfs).
  notes:
    - This should be ran with connection C(local) and hosts C(localhost)
  author:
    - Joe Wesch (@joewesch)
  requirements:
    - pynautobot
  version_added: "5.14.0"
  extends_documentation_fragment:
    - networktocode.nautobot.fragments.base
    - networktocode.nautobot.fragments.id
examples: |2

  - name: "Create a VRF to device assignment"
    networktocode.nautobot.vrf_device_assignment:
      url: http://nautobot.local
      token: thisIsMyToken
      vrf: "My VRF"
      device: "My Device"
      state: present

  - name: "Create a VRF to virtual machine assignment"
    networktocode.nautobot.vrf_device_assignment:
      url: http://nautobot.local
      token: thisIsMyToken
      vrf: "My VRF"
      virtual_machine: "My Virtual Machine"
      state: present

  - name: "Delete a VRF to device assignment"
    networktocode.nautobot.vrf_device_assignment:
      url: http://nautobot.local
      token: thisIsMyToken
      vrf: "My VRF"
      device: "My Device"
      state: absent

  - name: "Delete a VRF to virtual machine assignment"
    networktocode.nautobot.vrf_device_assignment:
      url: http://nautobot.local
      token: thisIsMyToken
      vrf: "My VRF"
      virtual_machine: "My Virtual Machine"
      state: absent

  - name: "Delete a VRF to device assignment by id"
    networktocode.nautobot.vrf_device_assignment:
      url: http://nautobot.local
      token: thisIsMyToken
      id: 00000000-0000-0000-0000-000000000000
      state: absent
return: |2

  vrf_device_assignment:
    description: Serialized object as created or already existent within Nautobot
    returned: success (when I(state=present))
    type: dict
  msg:
    description: Message indicating successful operation
    returned: success
    type: str
