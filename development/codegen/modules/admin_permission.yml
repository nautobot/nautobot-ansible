documentation:
  module: admin_permission
  short_description: Create, update or delete object permissions within Nautobot
  description:
    - Creates, updates or removes object permissions from Nautobot
  notes:
    - This should be ran with connection C(local) and hosts C(localhost)
  author:
    - Jeff Kala (@jeffkala)
  version_added: "5.3.0"
  extends_documentation_fragment:
    - networktocode.nautobot.fragments.base
    - networktocode.nautobot.fragments.id
examples: |2

  - name: "Test Nautobot modules"
    connection: local
    hosts: localhost
    gather_facts: false

    tasks:
      - name: Create object permission within Nautobot with only required information
        networktocode.nautobot.admin_permission:
          url: http://nautobot.local
          token: thisIsMyToken
          name: read only
          description: "ro permissions"
          enabled: true
          object_types:
            - "dcim.device"
          actions:
            - view
            - change
          users:
            - nb_user
          groups:
            - read_only_group
          state: present

      - name: Delete permission
        networktocode.nautobot.admin_permission:
          url: http://nautobot.local
          token: thisIsMyToken
          name: read only
          description: "ro permissions"
          enabled: true
          object_types:
            - "dcim.device"
          actions:
            - view
            - change
          users:
            - nb_user
          groups:
            - read_only_group
          state: absent

      - name: Delete permission by id
        networktocode.nautobot.admin_permission:
          url: http://nautobot.local
          token: thisIsMyToken
          id: 00000000-0000-0000-0000-000000000000
          state: absent
return: |2

  admin_permission:
    description: Serialized object as created or already existent within Nautobot
    returned: success (when I(state=present))
    type: dict
  msg:
    description: Message indicating failure or info about what has been achieved
    returned: always
    type: str
