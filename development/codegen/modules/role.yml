# comments out of it. See development/codegen/README.md.
module: role
api_path: /extras/roles/
endpoint: roles
header:
  - '# Copyright: (c) 2018, Mikhail Yohman (@FragmentedPacket) <mikhail.yohman@gmail.com>'
  - '# GNU General Public License v3.0+ (see COPYING or https://www.gnu.org/licenses/gpl-3.0.txt)'
utils_module: dcim
class_name: NautobotDcimModule
endpoint_constant: NB_ROLES
instance_var: role
instance_kwargs: {}
main_docstring: "\n    Main entry point for module execution.\n    "
shared_specs:
  - NAUTOBOT_ARG_SPEC
  - ID_ARG_SPEC
  - CUSTOM_FIELDS_ARG_SPEC
  - CONTACTS_AND_TEAMS_ARG_SPEC
  - NOTES_ARG_SPEC
ansible_module_kwargs:
  supports_check_mode: true
extra_imports: []
post_module_code: []
ignore_api_fields: {}
lookup_fields: null
generated_examples: false
options:
  name:
    api_field: name
    argument_spec:
      required: false
      type: str
    documentation:
      description:
        - The name of the role
        - Required if I(state=present) and the role does not exist yet
      required: false
      type: str
      version_added: "5.0.0"
  description:
    api_field: description
    argument_spec:
      required: false
      type: str
    documentation:
      description:
        - The description of the role
      required: false
      type: str
      version_added: "5.0.0"
  color:
    api_field: color
    argument_spec:
      required: false
      type: str
    documentation:
      description:
        - Hexidecimal code for a color, ex. FFFFFF
      required: false
      type: str
      version_added: "5.0.0"
  content_types:
    api_field: content_types
    argument_spec:
      required: false
      type: list
      elements: str
    documentation:
      description:
        - Model names which the role can be related to.
      type: list
      elements: str
      version_added: "5.0.0"
  weight:
    api_field: weight
    argument_spec:
      required: false
      type: int
    documentation:
      description:
        - Weight assigned to the role.
      type: int
      version_added: "5.0.0"
documentation:
  module: role
  short_description: Create, update or delete roles within Nautobot
  description:
    - Creates, updates or removes roles from Nautobot
  notes:
    - Tags should be defined as a YAML list
    - This should be ran with connection C(local) and hosts C(localhost)
  author:
    - Mikhail Yohman (@FragmentedPacket)
  version_added: "5.0.0"
  extends_documentation_fragment:
    - networktocode.nautobot.fragments.base
    - networktocode.nautobot.fragments.id
    - networktocode.nautobot.fragments.custom_fields
    - networktocode.nautobot.fragments.contacts_and_teams
    - networktocode.nautobot.fragments.notes
examples: |2

  - name: "Test Nautobot modules"
    connection: local
    hosts: localhost
    gather_facts: false

    tasks:
      - name: Create role within Nautobot with only required information
        networktocode.nautobot.role:
          url: http://nautobot.local
          token: thisIsMyToken
          name: Test role
          color: FFFFFF
          content_types:
            - "dcim.device"
          state: present

      - name: Delete role within nautobot
        networktocode.nautobot.role:
          url: http://nautobot.local
          token: thisIsMyToken
          name: Test role
          state: absent

      - name: Delete role by id
        networktocode.nautobot.role:
          url: http://nautobot.local
          token: thisIsMyToken
          id: 00000000-0000-0000-0000-000000000000
          state: absent
return: |2

  role:
    description: Serialized object as created or already existent within Nautobot
    returned: success (when I(state=present))
    type: dict
  msg:
    description: Message indicating failure or info about what has been achieved
    returned: always
    type: str
