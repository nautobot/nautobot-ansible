documentation:
  module: cloud_network
  short_description: Creates or removes cloud network from Nautobot
  description:
    - Creates or removes cloud network from Nautobot
  notes:
    - Tags should be defined as a YAML list
    - This should be ran with connection C(local) and hosts C(localhost)
  author:
    - Travis Smith (@tsm1th)
  requirements:
    - pynautobot
  version_added: "5.4.0"
  extends_documentation_fragment:
    - networktocode.nautobot.fragments.base
    - networktocode.nautobot.fragments.id
    - networktocode.nautobot.fragments.tags
    - networktocode.nautobot.fragments.custom_fields
    - networktocode.nautobot.fragments.contacts_and_teams
    - networktocode.nautobot.fragments.notes
examples: |2

  ---
  - name: Create a cloud network
    networktocode.nautobot.cloud_network:
      url: http://nautobot.local
      token: thisIsMyToken
      name: Cisco Quantum Network
      cloud_resource_type: Cisco Quantum Type
      cloud_account: Cisco Quantum Account
      description: A quantum network for Cisco
      state: present

  - name: Create a cloud network with inline prefix associations
    networktocode.nautobot.cloud_network:
      url: http://nautobot.local
      token: thisIsMyToken
      name: Cisco Quantum Network
      cloud_resource_type: Cisco Quantum Type
      cloud_account: Cisco Quantum Account
      prefixes:
        state: merge
        objects:
          - prefix: 10.1.198.0/23
      state: present

  - name: Delete a cloud network
    networktocode.nautobot.cloud_network:
      url: http://nautobot.local
      token: thisIsMyToken
      name: Cisco Quantum Network
      state: absent

  - name: Delete a cloud network by id
    networktocode.nautobot.cloud_network:
      url: http://nautobot.local
      token: thisIsMyToken
      id: 00000000-0000-0000-0000-000000000000
      state: absent
return: |2

  cloud_network:
    description: Serialized object as created or already existent within Nautobot
    returned: success (when I(state=present))
    type: dict
  msg:
    description: Message indicating failure or info about what has been achieved
    returned: always
    type: str
