documentation:
  module: software_version
  short_description: Creates, updates or removes software versions from Nautobot
  description:
    - Creates, updates or removes software versions from Nautobot
  notes:
    - This module requires Nautobot v2.2+
    - This should be ran with connection C(local) and hosts C(localhost)
    - Tags should be defined as a YAML list
  author:
    - Joe Wesch (@joewesch)
  requirements:
    - pynautobot
  version_added: "5.7.0"
  extends_documentation_fragment:
    - networktocode.nautobot.fragments.base
    - networktocode.nautobot.fragments.id
    - networktocode.nautobot.fragments.tags
    - networktocode.nautobot.fragments.custom_fields
    - networktocode.nautobot.fragments.contacts_and_teams
    - networktocode.nautobot.fragments.notes
examples: |2

  ---
  - name: Create a software version
    networktocode.nautobot.software_version:
      url: http://nautobot.local
      token: thisIsMyToken
      version: 1.0.0
      platform: Cisco IOS
      status: Active
      alias: My Alias
      release_date: 2024-01-01
      end_of_support_date: 2024-12-31
      documentation_url: https://example.com
      long_term_support: true
      pre_release: false
      state: present

  - name: Update a software version
    networktocode.nautobot.software_version:
      url: http://nautobot.local
      token: thisIsMyToken
      version: 1.0.0
      state: present

  - name: Delete a software version
    networktocode.nautobot.software_version:
      url: http://nautobot.local
      token: thisIsMyToken
      version: 1.0.0
      state: absent

  - name: Delete a software version by id
    networktocode.nautobot.software_version:
      url: http://nautobot.local
      token: thisIsMyToken
      id: 00000000-0000-0000-0000-000000000000
      state: absent
return: |2

  software_version:
    description: Serialized object as created or already existent within Nautobot
    returned: success (when I(state=present))
    type: dict
  msg:
    description: Message indicating failure or info about what has been achieved
    returned: always
