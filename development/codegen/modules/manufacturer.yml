# Module config for the code generator. The generator reads this file and rewrites it, so keep
# comments out of it. See development/codegen/README.md.
module: manufacturer
api_path: /dcim/manufacturers/
endpoint: manufacturers
header:
  - '# Copyright: (c) 2018, Mikhail Yohman (@FragmentedPacket) <mikhail.yohman@gmail.com>'
  - '# GNU General Public License v3.0+ (see COPYING or https://www.gnu.org/licenses/gpl-3.0.txt)'
utils_module: dcim
class_name: NautobotDcimModule
endpoint_constant: NB_MANUFACTURERS
instance_var: manufacturer
instance_kwargs: {}
main_docstring: "\n    Main entry point for module execution.\n    "
shared_specs:
  - NAUTOBOT_ARG_SPEC
  - ID_ARG_SPEC
  - CUSTOM_FIELDS_ARG_SPEC
  - CONTACTS_AND_TEAMS_ARG_SPEC
  - NOTES_ARG_SPEC
ansible_module_kwargs:
  supports_check_mode: true
extra_imports: []
post_module_code: []
ignore_api_fields: {}
lookup_fields: null
generated_examples: false
options:
  name:
    api_field: name
    argument_spec:
      required: false
      type: str
    documentation:
      description:
        - The name of the manufacturer
        - Required if I(state=present) and the manufacturer does not exist yet
      required: false
      type: str
      version_added: "3.0.0"
  description:
    api_field: description
    argument_spec:
      required: false
      type: str
    documentation:
      description:
        - Applies to the description field for Nautobot Manufacturer
      required: false
      type: str
      version_added: "4.2.0"
documentation:
  module: manufacturer
  short_description: Create or delete manufacturers within Nautobot
  description:
    - Creates or removes manufacturers from Nautobot
  notes:
    - Tags should be defined as a YAML list
    - This should be ran with connection C(local) and hosts C(localhost)
  author:
    - Mikhail Yohman (@FragmentedPacket)
  version_added: "1.0.0"
  extends_documentation_fragment:
    - networktocode.nautobot.fragments.base
    - networktocode.nautobot.fragments.id
    - networktocode.nautobot.fragments.custom_fields
    - networktocode.nautobot.fragments.contacts_and_teams
    - networktocode.nautobot.fragments.notes
examples: |2

  - name: "Test Nautobot modules"
    connection: local
    hosts: localhost
    gather_facts: false

    tasks:
      - name: Create manufacturer within Nautobot with only required information
        networktocode.nautobot.manufacturer:
          url: http://nautobot.local
          token: thisIsMyToken
          name: Test Manufacturer
          state: present
          description: The test manufacturer

      - name: Delete manufacturer within nautobot
        networktocode.nautobot.manufacturer:
          url: http://nautobot.local
          token: thisIsMyToken
          name: Test Manufacturer
          state: absent

      - name: Delete manufacturer by id
        networktocode.nautobot.manufacturer:
          url: http://nautobot.local
          token: thisIsMyToken
          id: 00000000-0000-0000-0000-000000000000
          state: absent
return: |2

  manufacturer:
    description: Serialized object as created or already existent within Nautobot
    returned: success (when I(state=present))
    type: dict
  msg:
    description: Message indicating failure or info about what has been achieved
    returned: always
    type: str
