documentation:
  module: cloud_account
  short_description: Creates or removes cloud account from Nautobot
  description:
    - Creates or removes cloud account from Nautobot
  notes:
    - Tags should be defined as a YAML list
    - This should be ran with connection C(local) and hosts C(localhost)
  author:
    - Travis Smith (@tsm1th)
  requirements:
    - pynautobot
  version_added: "5.4.0"
  extends_documentation_fragment:
    - networktocode.nautobot.fragments.base
    - networktocode.nautobot.fragments.id
    - networktocode.nautobot.fragments.tags
    - networktocode.nautobot.fragments.custom_fields
    - networktocode.nautobot.fragments.contacts_and_teams
    - networktocode.nautobot.fragments.notes
examples: |2

  ---
  - name: Create a cloud account
    networktocode.nautobot.cloud_account:
      url: http://nautobot.local
      token: thisIsMyToken
      name: Cisco Quantum Account
      provider: Cisco
      description: A quantum account for Cisco
      account_number: "654321"
      secrets_group: "{{ my_secrets_group['key'] }}"
      state: present
    vars:
      my_secrets_group: >-
        {{ lookup(
          'networktocode.nautobot.lookup',
          'secrets-groups',
          api_endpoint=nautobot_url,
          token=nautobot_token,
          api_filter='name="My Secrets Group"'
        ) }}

  - name: Delete a cloud account
    networktocode.nautobot.cloud_account:
      url: http://nautobot.local
      token: thisIsMyToken
      name: Cisco Quantum Account
      state: absent

  - name: Delete a cloud account by id
    networktocode.nautobot.cloud_account:
      url: http://nautobot.local
      token: thisIsMyToken
      id: 00000000-0000-0000-0000-000000000000
      state: absent
return: |2

  cloud_account:
    description: Serialized object as created or already existent within Nautobot
    returned: success (when I(state=present))
    type: dict
  msg:
    description: Message indicating failure or info about what has been achieved
    returned: always
    type: str
