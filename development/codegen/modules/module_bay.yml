module: module_bay
api_path: /dcim/module-bays/
endpoint: module_bays
header:
  - '# Copyright: (c) 2024, Network to Code (@networktocode) <info@networktocode.com>'
  - '# GNU General Public License v3.0+ (see COPYING or https://www.gnu.org/licenses/gpl-3.0.txt)'
utils_module: dcim
class_name: NautobotDcimModule
endpoint_constant: NB_MODULE_BAYS
instance_var: module_bay
instance_kwargs: {}
main_docstring: "\n    Main entry point for module execution.\n    "
shared_specs:
  - NAUTOBOT_ARG_SPEC
  - ID_ARG_SPEC
  - TAGS_ARG_SPEC
  - CUSTOM_FIELDS_ARG_SPEC
  - CONTACTS_AND_TEAMS_ARG_SPEC
  - NOTES_ARG_SPEC
ansible_module_kwargs:
  supports_check_mode: true
extra_imports: []
post_module_code: []
ignore_api_fields: {}
lookup_fields: null
generated_examples: false
options:
  parent_device:
    api_field: parent_device
    argument_spec:
      required: false
      type: raw
    documentation:
      description:
        - The parent device of the module bay
        - Requires one of I(parent_device) or I(parent_module) when I(state=present) and the module bay does not exist yet
      required: false
      type: raw
  parent_module:
    api_field: parent_module
    argument_spec:
      required: false
      type: raw
    documentation:
      description:
        - The parent module of the module bay
        - Requires one of I(parent_device) or I(parent_module) when I(state=present) and the module bay does not exist yet
      required: false
      type: raw
  name:
    api_field: name
    argument_spec:
      required: false
      type: str
    documentation:
      description:
        - The name of the module bay
        - Required if I(state=present) and the module bay does not exist yet
      required: false
      type: str
  label:
    api_field: label
    argument_spec:
      required: false
      type: str
    documentation:
      description:
        - The label of the module bay
      required: false
      type: str
  position:
    api_field: position
    argument_spec:
      required: false
      type: str
    documentation:
      description:
        - The position of the module bay within the device or module
      required: false
      type: str
  description:
    api_field: description
    argument_spec:
      required: false
      type: str
    documentation:
      description:
        - The description of the module bay
      required: false
      type: str
  requires_first_party_modules:
    api_field: requires_first_party_modules
    managed: true
    argument_spec:
      required: false
      type: bool
    documentation:
      description:
        - This bay will only accept modules from the same manufacturer as the parent device or module
      required: false
      type: bool
      version_added: "6.4.0"
  module_family:
    api_field: module_family
    managed: true
    argument_spec:
      required: false
      type: raw
    documentation:
      description:
        - Module family that can be installed in this bay
      required: false
      type: raw
      version_added: "6.4.0"
documentation:
  module: module_bay
  short_description: Create, update or delete module bays within Nautobot
  description:
    - Creates, updates or removes module bays from Nautobot
  notes:
    - Tags should be defined as a YAML list
    - This should be ran with connection C(local) and hosts C(localhost)
  author:
    - Travis Smith (@tsm1th)
  version_added: "5.4.0"
  extends_documentation_fragment:
    - networktocode.nautobot.fragments.base
    - networktocode.nautobot.fragments.id
    - networktocode.nautobot.fragments.tags
    - networktocode.nautobot.fragments.custom_fields
    - networktocode.nautobot.fragments.contacts_and_teams
    - networktocode.nautobot.fragments.notes
examples: |2

  - name: Create a module bay inside a device
    networktocode.nautobot.module_bay:
      url: http://nautobot.local
      token: thisIsMyToken
      parent_device: test100
      name: Watch Bay
      label: watchbay
      position: "42"
      description: The bay of watches
      state: present

  - name: Create a module bay inside a module
    networktocode.nautobot.module_bay:
      url: http://nautobot.local
      token: thisIsMyToken
      parent_module:
        module_type: HooverMaxProModel60
        parent_module_bay: "{{ some_module_bay['key'] }}"
      name: Fixing Good
      label: FiXiNgGoOd
      position: "321"
      description: Good Fixing is better than Bad Breaking
      state: present

  - name: Delete a module bay
    networktocode.nautobot.module_bay:
      url: http://nautobot.local
      token: thisIsMyToken
      parent_device: test100
      name: Watch Bay
      state: absent

  - name: Delete a module bay by id
    networktocode.nautobot.module_bay:
      url: http://nautobot.local
      token: thisIsMyToken
      id: 00000000-0000-0000-0000-000000000000
      state: absent
return: |2

  module_bay:
    description: Serialized object as created or already existent within Nautobot
    returned: success (when I(state=present))
    type: dict
  msg:
    description: Message indicating failure or info about what has been achieved
    returned: always
    type: str
