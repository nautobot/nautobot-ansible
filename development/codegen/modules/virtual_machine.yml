documentation:
  module: virtual_machine
  short_description: Create, update or delete virtual_machines within Nautobot
  description:
    - Creates, updates or removes virtual_machines from Nautobot
  notes:
    - Tags should be defined as a YAML list
    - This should be ran with connection C(local) and hosts C(localhost)
  author:
    - Gaelle MANGIN (@gmangin)
  version_added: "1.0.0"
  extends_documentation_fragment:
    - networktocode.nautobot.fragments.base
    - networktocode.nautobot.fragments.id
    - networktocode.nautobot.fragments.tags
    - networktocode.nautobot.fragments.custom_fields
    - networktocode.nautobot.fragments.contacts_and_teams
    - networktocode.nautobot.fragments.notes
examples: |2

  - name: "Test Nautobot modules"
    connection: local
    hosts: localhost
    gather_facts: false
    tasks:
      - name: Create virtual machine within Nautobot with only required information
        networktocode.nautobot.virtual_machine:
          url: http://nautobot.local
          token: thisIsMyToken
          name: Test Virtual Machine
          cluster: test cluster
          status: active
          state: present

      - name: Delete virtual machine within nautobot
        networktocode.nautobot.virtual_machine:
          url: http://nautobot.local
          token: thisIsMyToken
          name: Test Virtual Machine
          state: absent

      - name: Create virtual machine with tags
        networktocode.nautobot.virtual_machine:
          url: http://nautobot.local
          token: thisIsMyToken
          name: Another Test Virtual Machine
          cluster: test cluster
          status: active
          tags:
            - Schnozzberry
          state: present

      - name: Update vcpus, memory and disk of an existing virtual machine
        networktocode.nautobot.virtual_machine:
          url: http://nautobot.local
          token: thisIsMyToken
          name: Test Virtual Machine
          cluster: test cluster
          vcpus: 8
          memory: 8
          disk: 8
          state: present

      - name: Create virtual machine with inline VRF associations
        networktocode.nautobot.virtual_machine:
          url: http://nautobot.local
          token: thisIsMyToken
          name: Test Virtual Machine
          vrfs:
            state: merge
            objects:
              - vrf: Test VRF
          state: present

      - name: Delete virtual machine by id
        networktocode.nautobot.virtual_machine:
          url: http://nautobot.local
          token: thisIsMyToken
          id: 00000000-0000-0000-0000-000000000000
          state: absent
return: |2

  virtual machine:
    description: Serialized object as created or already existent within Nautobot
    returned: success (when I(state=present))
    type: dict
  msg:
    description: Message indicating failure or info about what has been achieved
    returned: always
    type: str
