lookup_fields: null
generated_examples: false
options:
  device_type:
    api_field: device_type
    argument_spec:
      required: false
      type: raw
    documentation:
      description:
        - The device type of the module bay template
        - Requires one of I(device_type) or I(module_type) when I(state=present) and the module bay template does not exist yet
      required: false
      type: raw
  module_type:
    api_field: module_type
    argument_spec:
      required: false
      type: raw
    documentation:
      description:
        - The module type of the module bay template
        - Requires one of I(device_type) or I(module_type) when I(state=present) and the module bay template does not exist yet
      required: false
      type: raw
  name:
    api_field: name
    argument_spec:
      required: false
      type: str
    documentation:
      description:
        - The name of the module bay template
        - Required if I(state=present) and the module bay template does not exist yet
      required: false
      type: str
  label:
    api_field: label
    argument_spec:
      required: false
      type: str
    documentation:
      description:
        - The label of the module bay template
      required: false
      type: str
  position:
    api_field: position
    argument_spec:
      required: false
      type: str
    documentation:
      description:
        - The position of the module bay within the device or module
      required: false
      type: str
  description:
    api_field: description
    argument_spec:
      required: false
      type: str
    documentation:
      description:
        - The description of the module bay template
      required: false
      type: str
  requires_first_party_modules:
    api_field: requires_first_party_modules
    managed: true
    argument_spec:
      required: false
      type: bool
    documentation:
      description:
        - This bay will only accept modules from the same manufacturer as the parent device or module
      required: false
      type: bool
      version_added: "6.4.0"
  module_family:
    api_field: module_family
    managed: true
    argument_spec:
      required: false
      type: raw
    documentation:
      description:
        - Module family that can be installed in this bay. Leave blank for no restriction.
      required: false
      type: raw
      version_added: "6.4.0"
documentation:
  module: module_bay_template
  short_description: Create, update or delete module bay templates within Nautobot
  description:
    - Creates, updates or removes module bay templates from Nautobot
  notes:
    - Tags should be defined as a YAML list
    - This should be ran with connection C(local) and hosts C(localhost)
  author:
    - Travis Smith (@tsm1th)
  version_added: "5.4.0"
  extends_documentation_fragment:
    - networktocode.nautobot.fragments.base
    - networktocode.nautobot.fragments.id
    - networktocode.nautobot.fragments.tags
    - networktocode.nautobot.fragments.custom_fields
    - networktocode.nautobot.fragments.contacts_and_teams
examples: |2

  - name: Create a module bay template
    networktocode.nautobot.module_bay_template:
      url: http://nautobot.local
      token: thisIsMyToken
      module_type: HooverMaxProModel60
      name: Edward Galbraith
      label: Br Ba
      position: "1"
      description: Granite State
      state: present

  - name: Delete a module bay template
    networktocode.nautobot.module_bay_template:
      url: http://nautobot.local
      token: thisIsMyToken
      module_type: HooverMaxProModel60
      name: Edward Galbraith
      state: absent

  - name: Delete a module bay template by id
    networktocode.nautobot.module_bay_template:
      url: http://nautobot.local
      token: thisIsMyToken
      id: 00000000-0000-0000-0000-000000000000
      state: absent
return: |2

  module_bay_template:
    description: Serialized object as created or already existent within Nautobot
    returned: success (when I(state=present))
    type: dict
  msg:
    description: Message indicating failure or info about what has been achieved
    returned: always
    type: str
