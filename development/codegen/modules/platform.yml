# Module config for the code generator. The generator reads this file and rewrites it, so keep
# comments out of it. See development/codegen/README.md.
module: platform
api_path: /dcim/platforms/
endpoint: platforms
header:
  - '# Copyright: (c) 2018, Mikhail Yohman (@FragmentedPacket) <mikhail.yohman@gmail.com>'
  - '# GNU General Public License v3.0+ (see COPYING or https://www.gnu.org/licenses/gpl-3.0.txt)'
utils_module: dcim
class_name: NautobotDcimModule
endpoint_constant: NB_PLATFORMS
instance_var: platform
instance_kwargs: {}
main_docstring: "\n    Main entry point for module execution.\n    "
shared_specs:
  - NAUTOBOT_ARG_SPEC
  - ID_ARG_SPEC
  - CUSTOM_FIELDS_ARG_SPEC
  - CONTACTS_AND_TEAMS_ARG_SPEC
  - NOTES_ARG_SPEC
ansible_module_kwargs:
  supports_check_mode: true
extra_imports: []
post_module_code: []
ignore_api_fields: {}
lookup_fields: null
generated_examples: false
options:
  name:
    api_field: name
    argument_spec:
      required: false
      type: str
    documentation:
      description:
        - The name of the platform
        - Required if I(state=present) and the platform does not exist yet
      required: false
      type: str
      version_added: "3.0.0"
  description:
    api_field: description
    argument_spec:
      required: false
      type: str
    documentation:
      description:
        - The description of the platform
      required: false
      type: str
      version_added: "3.0.0"
  manufacturer:
    api_field: manufacturer
    argument_spec:
      required: false
      type: raw
    documentation:
      description:
        - The manufacturer the platform will be tied to
      required: false
      type: raw
      version_added: "3.0.0"
  napalm_driver:
    api_field: napalm_driver
    argument_spec:
      required: false
      type: str
    documentation:
      description:
        - The name of the NAPALM driver to be used when using the NAPALM plugin
      required: false
      type: str
      version_added: "3.0.0"
  napalm_args:
    api_field: napalm_args
    argument_spec:
      required: false
      type: dict
    documentation:
      description:
        - The optional arguments used for NAPALM connections
      required: false
      type: dict
      version_added: "3.0.0"
  network_driver:
    api_field: network_driver
    argument_spec:
      required: false
      type: str
    documentation:
      description:
        - The normalized network driver to use when interacting with devices, e.g. cisco_ios, arista_eos, etc.
        - Library-specific driver names will be derived from this setting as appropriate
      required: false
      type: str
      version_added: "5.8.0"
documentation:
  module: platform
  short_description: Create or delete platforms within Nautobot
  description:
    - Creates or removes platforms from Nautobot
  notes:
    - Tags should be defined as a YAML list
    - This should be ran with connection C(local) and hosts C(localhost)
  author:
    - Mikhail Yohman (@FragmentedPacket)
  version_added: "1.0.0"
  extends_documentation_fragment:
    - networktocode.nautobot.fragments.base
    - networktocode.nautobot.fragments.id
    - networktocode.nautobot.fragments.custom_fields
    - networktocode.nautobot.fragments.contacts_and_teams
    - networktocode.nautobot.fragments.notes
examples: |2

  - name: "Test Nautobot modules"
    connection: local
    hosts: localhost
    gather_facts: false

    tasks:
      - name: Create platform within Nautobot with only required information
        networktocode.nautobot.platform:
          url: http://nautobot.local
          token: thisIsMyToken
          name: Test Platform
          state: present

      - name: Create platform within Nautobot
        networktocode.nautobot.platform:
          url: http://nautobot.local
          token: thisIsMyToken
          name: Test Platform All
          manufacturer: Test Manufacturer
          napalm_driver: ios
          napalm_args:
            global_delay_factor: 2
          network_driver: cisco_ios
          state: present

      - name: Delete platform within nautobot
        networktocode.nautobot.platform:
          url: http://nautobot.local
          token: thisIsMyToken
          name: Test Platform
          state: absent

      - name: Delete platform by id
        networktocode.nautobot.platform:
          url: http://nautobot.local
          token: thisIsMyToken
          id: 00000000-0000-0000-0000-000000000000
          state: absent
return: |2

  platform:
    description: Serialized object as created or already existent within Nautobot
    returned: success (when I(state=present))
    type: dict
  msg:
    description: Message indicating failure or info about what has been achieved
    returned: always
    type: str
