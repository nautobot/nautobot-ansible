options:
  device_type:
    api_field: device_type
    argument_spec:
      required: false
      type: raw
    documentation:
      description:
        - Name of the device the interface template will be associated with (case-sensitive)
        - Requires one of I(device_type) or I(module_type) when I(state=present) and the interface template does not exist yet
      required: false
      type: raw
      version_added: "3.0.0"
  name:
    api_field: name
    argument_spec:
      required: false
      type: str
    documentation:
