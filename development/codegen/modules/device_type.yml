documentation:
  module: device_type
  short_description: Create, update or delete device types within Nautobot
  description:
    - Creates, updates or removes device types from Nautobot
  notes:
    - Tags should be defined as a YAML list
    - This should be ran with connection C(local) and hosts C(localhost)
  author:
    - Mikhail Yohman (@FragmentedPacket)
  version_added: "1.0.0"
  extends_documentation_fragment:
    - networktocode.nautobot.fragments.base
    - networktocode.nautobot.fragments.id
    - networktocode.nautobot.fragments.tags
    - networktocode.nautobot.fragments.custom_fields
    - networktocode.nautobot.fragments.contacts_and_teams
    - networktocode.nautobot.fragments.notes
examples: |2

  - name: "Test Nautobot modules"
    connection: local
    hosts: localhost
    gather_facts: false

    tasks:
      - name: Create device type within Nautobot with only required information
        networktocode.nautobot.device_type:
          url: http://nautobot.local
          token: thisIsMyToken
          model: ws-test-3750
          manufacturer: Test Manufacturer
          state: present

      - name: Create device type within Nautobot
        networktocode.nautobot.device_type:
          url: http://nautobot.local
          token: thisIsMyToken
          model: ws-test-3750
          manufacturer: Test Manufacturer
          part_number: ws-3750g-v2
          u_height: 1
          is_full_depth: false
          subdevice_role: parent
          state: present

      - name: Delete device type within nautobot
        networktocode.nautobot.device_type:
          url: http://nautobot.local
          token: thisIsMyToken
          model: ws-test-3750
          state: absent

      - name: Delete device type by id
        networktocode.nautobot.device_type:
          url: http://nautobot.local
          token: thisIsMyToken
          id: 00000000-0000-0000-0000-000000000000
          state: absent
return: |2

  device_type:
    description: Serialized object as created or already existent within Nautobot
    returned: success (when I(state=present))
    type: dict
  msg:
    description: Message indicating failure or info about what has been achieved
    returned: always
    type: str
