documentation:
  module: power_feed
  short_description: Create, update or delete power feeds within Nautobot
  description:
    - Creates, updates or removes power feeds from Nautobot
  notes:
    - Tags should be defined as a YAML list
    - This should be ran with connection C(local) and hosts C(localhost)
  author:
    - Tobias Groß (@toerb)
  version_added: "1.0.0"
  extends_documentation_fragment:
    - networktocode.nautobot.fragments.base
    - networktocode.nautobot.fragments.id
    - networktocode.nautobot.fragments.tags
    - networktocode.nautobot.fragments.custom_fields
    - networktocode.nautobot.fragments.contacts_and_teams
    - networktocode.nautobot.fragments.notes
examples: |2

  - name: "Test Nautobot modules"
    connection: local
    hosts: localhost
    gather_facts: false

    tasks:
      - name: Create power feed within Nautobot with only required information
        networktocode.nautobot.power_feed:
          url: http://nautobot.local
          token: thisIsMyToken
          name: Test Power Feed
          power_panel: Test Power Panel
          status: active
          state: present

      - name: Update power feed with other fields
        networktocode.nautobot.power_feed:
          url: http://nautobot.local
          token: thisIsMyToken
          name: Test Power Feed
          power_panel: Test Power Panel
          status: offline
          type: primary
          supply: ac
          phase: single-phase
          voltage: 230
          amperage: 16
          max_utilization: 80
          comments: normal power feed
          state: present

      - name: Delete power feed within nautobot
        networktocode.nautobot.power_feed:
          url: http://nautobot.local
          token: thisIsMyToken
          name: Test Power Feed
          power_panel: Test Power Panel
          state: absent

      - name: Delete power feed by id
        networktocode.nautobot.power_feed:
          url: http://nautobot.local
          token: thisIsMyToken
          id: 00000000-0000-0000-0000-000000000000
          state: absent
return: |2

  power_feed:
    description: Serialized object as created or already existent within Nautobot
    returned: success (when I(state=present))
    type: dict
  msg:
    description: Message indicating failure or info about what has been achieved
    returned: always
    type: str
