examples: |2

  - name: Test Nautobot modules
    connection: local
    hosts: localhost
    gather_facts: false
    tasks:
      - name: Create VPN Termination within Nautobot with only required information
        networktocode.nautobot.vpn_termination:
          url: http://nautobot.local
          token: thisIsMyToken
          vpn: Test Vpn
          state: present
      - name: Delete VPN Termination within Nautobot
        networktocode.nautobot.vpn_termination:
          url: http://nautobot.local
          token: thisIsMyToken
          vpn: Test Vpn
          state: absent
      - name: Delete VPN Termination by id
        networktocode.nautobot.vpn_termination:
          url: http://nautobot.local
          token: thisIsMyToken
          id: 00000000-0000-0000-0000-000000000000
          state: absent
