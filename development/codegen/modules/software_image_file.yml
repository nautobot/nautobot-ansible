documentation:
  module: software_image_file
  short_description: Create, update or delete software image files within Nautobot
  description:
    - Creates, updates or removes software image files from Nautobot.
  notes:
    - Tags should be defined as a YAML list
    - This should be ran with connection C(local) and hosts C(localhost)
  author:
    - Network to Code (@networktocode)
  version_added: "6.4.0"
  extends_documentation_fragment:
    - networktocode.nautobot.fragments.base
    - networktocode.nautobot.fragments.id
    - networktocode.nautobot.fragments.tags
    - networktocode.nautobot.fragments.custom_fields
    - networktocode.nautobot.fragments.contacts_and_teams
    - networktocode.nautobot.fragments.notes
examples: |2

  - name: Test Nautobot modules
    connection: local
    hosts: localhost
    gather_facts: false
    tasks:
      - name: Create software image file within Nautobot with only required information
        networktocode.nautobot.software_image_file:
          url: http://nautobot.local
          token: thisIsMyToken
          image_file_name: Test Image File Name
          software_version: Test Software Version
          status: Active
          state: present
      - name: Delete software image file within Nautobot
        networktocode.nautobot.software_image_file:
          url: http://nautobot.local
          token: thisIsMyToken
          image_file_name: Test Image File Name
          software_version: Test Software Version
          state: absent
      - name: Delete software image file by id
        networktocode.nautobot.software_image_file:
          url: http://nautobot.local
          token: thisIsMyToken
          id: 00000000-0000-0000-0000-000000000000
          state: absent
return: |2

  software_image_file:
    description: Serialized object as created or already existent within Nautobot
    returned: success (when I(state=present))
    type: dict
  msg:
    description: Message indicating failure or info about what has been achieved
    returned: always
    type: str
lookup_fields:
  - image_file_name
  - software_version
