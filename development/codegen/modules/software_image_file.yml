      required: false
      type: str
  hashing_algorithm:
    api_field: hashing_algorithm
    managed: true
    argument_spec:
      required: false
      type: str
      choices: &id001
        - md5
        - sha1
        - sha224
        - sha384
        - sha256
        - sha512
        - sha3
        - blake2
        - blake3
    documentation:
      description:
        - Hashing algorithm for image file checksum
      required: false
      type: str
      choices: *id001
  image_file_size:
    api_field: image_file_size
    managed: true
    argument_spec:
      required: false
      type: int
    documentation:
      description:
        - Image file size in bytes
      required: false
      type: int
  download_url:
    api_field: download_url
    managed: true
    argument_spec:
      required: false
      type: str
    documentation:
      description:
