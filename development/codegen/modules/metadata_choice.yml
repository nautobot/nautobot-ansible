utils_module: extras
class_name: NautobotExtrasModule
endpoint_constant: NB_METADATA_CHOICES
instance_var: metadata_choice
instance_kwargs: {}
main_docstring: "\n    Main entry point for module execution.\n    "
shared_specs:
  - NAUTOBOT_ARG_SPEC
  - ID_ARG_SPEC
