examples: |2

  - name: Test Nautobot modules
    connection: local
    hosts: localhost
    gather_facts: false
    tasks:
      - name: Create VPN Profile within Nautobot with only required information
        networktocode.nautobot.vpn_profile:
          url: http://nautobot.local
          token: thisIsMyToken
          name: Test Name
          state: present
      - name: Delete VPN Profile within Nautobot
        networktocode.nautobot.vpn_profile:
          url: http://nautobot.local
          token: thisIsMyToken
          name: Test Name
          state: absent
      - name: Delete VPN Profile by id
        networktocode.nautobot.vpn_profile:
          url: http://nautobot.local
          token: thisIsMyToken
          id: 00000000-0000-0000-0000-000000000000
          state: absent
