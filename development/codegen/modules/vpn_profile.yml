  module: vpn_profile
  short_description: Create, update or delete vpn profiles within Nautobot
  description:
    - Creates, updates or removes vpn profiles from Nautobot.
  notes:
    - Tags should be defined as a YAML list
    - This should be ran with connection C(local) and hosts C(localhost)
