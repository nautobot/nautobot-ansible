options:
  name:
    api_field: name
    argument_spec:
      required: false
      type: str
    documentation:
      description:
        - The name of the secrets group
        - Required if I(state=present) and the secrets group does not exist yet
      required: false
      type: str
  description:
    api_field: description
    argument_spec:
      required: false
      type: str
    documentation:
      description:
        - A description of the secrets group
      required: false
      type: str
  secrets:
    api_field: null
    argument_spec:
      required: false
      type: dict
      no_log: false
      options:
        state:
          required: false
          default: merge
          choices:
            - merge
            - replace
            - delete
        objects:
          required: true
          type: list
          elements: dict
          options:
            secret:
              required: true
              type: raw
              no_log: false
            access_type:
              required: false
              type: str
              choices:
                - Generic
                - Console
                - gNMI
                - HTTP(S)
                - NETCONF
                - REST
                - RESTCONF
                - SNMP
                - SSH
            secret_type:
              required: false
              type: str
              choices:
                - key
                - password
                - secret
                - token
                - username
    documentation:
      description:
        - List of secrets to associate with this secrets group.
      required: false
      type: dict
      version_added: "6.2.0"
      suboptions:
        state:
          description:
            - C(merge) adds associations without removing existing ones.
            - C(replace) enforces exactly the listed associations, removing any extras.
            - C(delete) removes the listed associations.
          required: false
          type: str
          default: merge
          choices:
            - merge
            - replace
            - delete
        objects:
          description:
            - List of secrets to associate.
          required: true
          type: list
          elements: dict
          suboptions:
            secret:
              description:
                - The secret to associate.
              required: true
              type: raw
            access_type:
              description:
                - The access type of the secret.
                - Required if the association does not already exist.
              required: false
              type: str
              choices:
                - Generic
                - Console
                - gNMI
                - HTTP(S)
                - NETCONF
                - REST
                - RESTCONF
                - SNMP
                - SSH
            secret_type:
              description:
                - The type of the secret.
                - Required if the association does not already exist.
              required: false
              type: str
              choices:
                - key
                - password
                - secret
                - token
                - username
documentation:
  module: secrets_group
  short_description: Creates or removes secrets groups from Nautobot
  description:
    - Creates or removes secrets groups from Nautobot
  notes:
    - Tags should be defined as a YAML list
    - This should be ran with connection C(local) and hosts C(localhost)
  author:
    - Joe Wesch (@joewesch)
  requirements:
    - pynautobot
  version_added: "5.11.0"
  extends_documentation_fragment:
    - networktocode.nautobot.fragments.base
    - networktocode.nautobot.fragments.id
    - networktocode.nautobot.fragments.custom_fields
    - networktocode.nautobot.fragments.contacts_and_teams
    - networktocode.nautobot.fragments.notes
examples: |2

  ---
  - name: Create a secrets group
    networktocode.nautobot.secrets_group:
      url: http://nautobot.local
      token: thisIsMyToken
      name: my_secrets_group
      description: My secrets group

  - name: Create a secrets group with inline secret associations
    networktocode.nautobot.secrets_group:
      url: http://nautobot.local
      token: thisIsMyToken
      name: my_secrets_group
      secrets:
        state: merge
        objects:
          - secret: My Secret
            access_type: Generic
            secret_type: key

  - name: Delete a secrets group
    networktocode.nautobot.secrets_group:
      url: http://nautobot.local
      token: thisIsMyToken
      name: my_secrets_group
      state: absent

  - name: Delete a secrets group by id
    networktocode.nautobot.secrets_group:
      url: http://nautobot.local
      token: thisIsMyToken
      id: 00000000-0000-0000-0000-000000000000
      state: absent
return: |2

  secrets_group:
    description: Serialized object as created or already existent within Nautobot
    returned: success (when I(state=present))
    type: dict
  msg:
    description: Message indicating failure or info about what has been achieved
    returned: always
    type: str
